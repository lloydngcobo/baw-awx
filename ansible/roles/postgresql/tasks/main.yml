- name: Create ICN database
  ansible.builtin.shell: |
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='{{ icn_db_name }}'" | grep -q 1 && echo EXISTS && exit 0
    kubectl exec -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- mkdir -p /var/lib/pgsql/data/{{ icn_db_name }}
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres <<'EOSQL'
    CREATE ROLE {{ icn_db_user }} WITH INHERIT LOGIN ENCRYPTED PASSWORD '{{ icn_db_pass }}';
    CREATE TABLESPACE {{ icn_db_name }}_tbs OWNER {{ icn_db_user }} LOCATION '/var/lib/pgsql/data/{{ icn_db_name }}';
    GRANT CREATE ON TABLESPACE {{ icn_db_name }}_tbs TO {{ icn_db_user }};
    CREATE DATABASE {{ icn_db_name }} OWNER {{ icn_db_user }} TABLESPACE {{ icn_db_name }}_tbs TEMPLATE template0 ENCODING UTF8;

    kubectl exec -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- mkdir -p /var/lib/pgsql/data/{{ dos_db_name }}/data /var/lib/pgsql/data/{{ dos_db_name }}/index
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres <<'EOSQL'
    CREATE ROLE {{ dos_db_user }} WITH INHERIT LOGIN ENCRYPTED PASSWORD '{{ dos_db_pass }}';
    CREATE TABLESPACE {{ dos_db_name }}_tbs OWNER {{ dos_db_user }} LOCATION '/var/lib/pgsql/data/{{ dos_db_name }}/data';
    CREATE TABLESPACE {{ dos_db_name }}indexts OWNER {{ dos_db_user }} LOCATION '/var/lib/pgsql/data/{{ dos_db_name }}/index';
    GRANT CREATE ON TABLESPACE {{ dos_db_name }}_tbs TO {{ dos_db_user }};
    GRANT CREATE ON TABLESPACE {{ dos_db_name }}indexts TO {{ dos_db_user }};
    CREATE DATABASE {{ dos_db_name }} OWNER {{ dos_db_user }} TABLESPACE {{ dos_db_name }}_tbs TEMPLATE template0 ENCODING UTF8;

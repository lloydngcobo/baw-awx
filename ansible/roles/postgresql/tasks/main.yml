---
# Role: postgresql
# Deploys PostgreSQL 16 (RHEL image) into the infra namespace.
# Creates all BAW databases: GCD, DOCS, DOS, TOS, ICN, BAS, BAW Runtime, AAE, ODM.
#
# Each DB task is fully idempotent:
#   1. Check if DB already exists → skip if yes
#   2. Create directory for tablespace
#   3. Use multiple -c flags (not heredoc) to create role/tablespace/DB
#      — with IF NOT EXISTS guards where supported, -v ON_ERROR_STOP=0 for safety
#   4. verify DB exists, fail if not
#
# Grounded against install/db/create*.sql from baw-microshift-rhel.

- name: Create PostgreSQL config Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-secret
        namespace: "{{ infra_namespace }}"
        labels:
          app: baw-postgresql
      stringData:
        POSTGRESQL_USER:     "{{ postgres_admin_user }}"
        POSTGRESQL_PASSWORD: "{{ postgres_admin_password }}"
        POSTGRESQL_DATABASE: "{{ postgres_db }}"
  no_log: true

- name: Create PostgreSQL data PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-pvc
        namespace: "{{ infra_namespace }}"
        labels:
          app: baw-postgresql
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 20Gi
        storageClassName: "{{ storage_class_name }}"

# ── Pod security: dedicated SA + anyuid (NOT privileged) ──────────────────────
# The RHEL postgresql-16 image must run as its built-in UID 26 (postgres) so it
# owns the tablespace directories it creates on the NFS RWX volume (mode 700).
# A random restricted-v2 UID cannot read those dirs. anyuid grants RunAsAny
# (keeps UID 26) WITHOUT host privilege — replaces the old privileged:true.

- name: Create PostgreSQL ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: postgresql-sa
        namespace: "{{ infra_namespace }}"
        labels:
          app: baw-postgresql

- name: Grant anyuid SCC to PostgreSQL ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: postgresql-anyuid
        namespace: "{{ infra_namespace }}"
        labels:
          app: baw-postgresql
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:anyuid
      subjects:
        - kind: ServiceAccount
          name: postgresql-sa
          namespace: "{{ infra_namespace }}"

- name: Deploy PostgreSQL
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgresql
        namespace: "{{ infra_namespace }}"
        labels:
          app: baw-postgresql
      spec:
        replicas: 1
        # Recreate: ensure the old pod is terminated before the new one starts —
        # two postgres instances on the same RWX volume would be unsafe.
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: baw-postgresql
        template:
          metadata:
            labels:
              app: baw-postgresql
          spec:
            serviceAccountName: postgresql-sa
            securityContext:
              runAsUser: 26
              fsGroup: 26
            containers:
              - name: postgresql
                image: "{{ postgresql_image }}"
                imagePullPolicy: IfNotPresent
                securityContext:
                  runAsUser: 26
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                ports:
                  - containerPort: 5432
                envFrom:
                  - secretRef:
                      name: postgres-secret
                env:
                  - name: POSTGRESQL_MAX_PREPARED_TRANSACTIONS
                    value: "100"
                  - name: POSTGRESQL_MAX_CONNECTIONS
                    value: "200"
                  - name: TZ
                    value: "{{ timezone }}"
                resources:
                  requests:
                    memory: 512Mi
                    cpu: 500m
                  limits:
                    memory: 1Gi
                    cpu: "1"
                livenessProbe:
                  exec:
                    command: ["/bin/sh", "-c", "pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE"]
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 6
                readinessProbe:
                  exec:
                    command: ["/bin/sh", "-c", "pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE"]
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 6
                startupProbe:
                  exec:
                    command: ["/bin/sh", "-c", "pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE"]
                  periodSeconds: 10
                  failureThreshold: 18
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/pgsql/data
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: postgres-pvc

- name: Create PostgreSQL Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-svc
        namespace: "{{ infra_namespace }}"
        labels:
          app: baw-postgresql
      spec:
        selector:
          app: baw-postgresql
        ports:
          - port: 5432
            targetPort: 5432

- name: Wait for PostgreSQL deployment
  ansible.builtin.shell: >
    oc rollout status deployment/postgresql
    -n {{ infra_namespace }} --timeout=300s
  changed_when: false

- name: Get PostgreSQL pod name
  ansible.builtin.shell: >
    oc get pod -n {{ infra_namespace }} -l app=baw-postgresql
    -o jsonpath='{.items[0].metadata.name}'
  register: _pg_pod
  changed_when: false

# ── Database creation (idempotent) ────────────────────────────────────────────
# Each task:
#  1. Skips entirely if DB already exists (idempotent)
#  2. Creates directories for tablespaces
#  3. Creates role/tablespace/DB with -v ON_ERROR_STOP=0 (ignores already-exists errors)
#  4. Creates DB separately only if it doesn't exist (can't use IF NOT EXISTS on CREATE DATABASE)
#  5. Verifies DB exists at the end — fails the task if missing
# Grounded against install/db/create*.sql from baw-microshift-rhel.

- name: Create GCD database
  ansible.builtin.shell: |
    POD="{{ _pg_pod.stdout }}"
    NS="{{ infra_namespace }}"
    DB="{{ gcd_db_name }}"
    USER="{{ gcd_db_user }}"
    PASS="{{ gcd_db_pass }}"
    DIR="/var/lib/pgsql/data/${DB}"
    TS="${DB}_tbs"
    # Skip if DB already exists
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED && exit 0
    # Create directory
    kubectl exec -n $NS $POD -- mkdir -p $DIR
    # Create role and tablespace (ignore if already exists)
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -v ON_ERROR_STOP=0 \
      -c "CREATE ROLE $USER WITH INHERIT LOGIN ENCRYPTED PASSWORD '$PASS'" \
      -c "CREATE TABLESPACE $TS OWNER $USER LOCATION '$DIR'" \
      -c "GRANT CREATE ON TABLESPACE $TS TO $USER"
    # Create DB only if still missing
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 || \
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres \
      -c "CREATE DATABASE $DB OWNER $USER TABLESPACE $TS TEMPLATE template0 ENCODING UTF8" \
      -c "REVOKE CONNECT ON DATABASE $DB FROM PUBLIC" \
      -c "GRANT ALL PRIVILEGES ON DATABASE $DB TO $USER"
    # Schema
    kubectl exec -n $NS $POD -- psql -U postgres -d $DB -v ON_ERROR_STOP=0 \
      -c "CREATE SCHEMA IF NOT EXISTS AUTHORIZATION $USER" \
      -c "ALTER DATABASE $DB SET search_path TO $USER"
    # Verify
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED
  register: _gcd
  changed_when: "'CREATED' in _gcd.stdout"
  failed_when: "'CREATED' not in _gcd.stdout"
  no_log: true

- name: Create DOCS object store database
  ansible.builtin.shell: |
    POD="{{ _pg_pod.stdout }}"
    NS="{{ infra_namespace }}"
    DB="{{ docs_db_name }}"
    USER="{{ docs_db_user }}"
    PASS="{{ docs_db_pass }}"
    DATADIR="/var/lib/pgsql/data/${DB}/data"
    IDXDIR="/var/lib/pgsql/data/${DB}/index"
    TS="${DB}_tbs"
    IDXTS="${DB}indexts"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED && exit 0
    kubectl exec -n $NS $POD -- mkdir -p $DATADIR $IDXDIR
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -v ON_ERROR_STOP=0 \
      -c "CREATE ROLE $USER WITH INHERIT LOGIN ENCRYPTED PASSWORD '$PASS'" \
      -c "CREATE TABLESPACE $TS OWNER $USER LOCATION '$DATADIR'" \
      -c "CREATE TABLESPACE $IDXTS OWNER $USER LOCATION '$IDXDIR'" \
      -c "GRANT CREATE ON TABLESPACE $TS TO $USER" \
      -c "GRANT CREATE ON TABLESPACE $IDXTS TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 || \
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres \
      -c "CREATE DATABASE $DB OWNER $USER TABLESPACE $TS TEMPLATE template0 ENCODING UTF8" \
      -c "REVOKE CONNECT ON DATABASE $DB FROM PUBLIC" \
      -c "GRANT ALL PRIVILEGES ON DATABASE $DB TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d $DB -v ON_ERROR_STOP=0 \
      -c "CREATE SCHEMA IF NOT EXISTS AUTHORIZATION $USER" \
      -c "ALTER DATABASE $DB SET search_path TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED
  register: _docs
  changed_when: "'CREATED' in _docs.stdout"
  failed_when: "'CREATED' not in _docs.stdout"
  no_log: true


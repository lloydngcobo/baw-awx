    EOSQL
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d {{ icn_db_name }} <<'EOSQL'
    CREATE SCHEMA IF NOT EXISTS icn_schema AUTHORIZATION {{ icn_db_user }};
    ALTER DATABASE {{ icn_db_name }} SET search_path TO icn_schema;
    EOSQL
    echo CREATED
  register: _icn
  changed_when: "'CREATED' in _icn.stdout"
  failed_when: _icn.rc != 0 and 'EXISTS' not in _icn.stdout
  no_log: true
  when: deploy_icn | default(true) | bool

- name: Create BAStudio (BAS) authoring database
  ansible.builtin.shell: |
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='{{ bas_db_name }}'" | grep -q 1 && echo EXISTS && exit 0
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres <<'EOSQL'
    CREATE ROLE {{ bas_db_user }} WITH INHERIT LOGIN ENCRYPTED PASSWORD '{{ bas_db_pass }}' CREATEDB CREATEROLE;
    CREATE DATABASE {{ bas_db_name }} OWNER {{ bas_db_user }} ENCODING UTF8;
    GRANT ALL PRIVILEGES ON DATABASE {{ bas_db_name }} TO {{ bas_db_user }};
    EOSQL
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d {{ bas_db_name }} <<'EOSQL'
    CREATE SCHEMA IF NOT EXISTS {{ bas_db_user }} AUTHORIZATION {{ bas_db_user }};
    GRANT ALL ON SCHEMA {{ bas_db_user }} TO {{ bas_db_user }};
    EOSQL
    echo CREATED
  register: _bas
  changed_when: "'CREATED' in _bas.stdout"
  failed_when: _bas.rc != 0 and 'EXISTS' not in _bas.stdout
  no_log: true
  when: deploy_bastudio | default(true) | bool

- name: Create BAW Runtime databases
  ansible.builtin.shell: |
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='{{ item.db }}'" | grep -q 1 && echo EXISTS && exit 0
    kubectl exec -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- mkdir -p /var/lib/pgsql/data/{{ item.db }}
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres <<'EOSQL'
    CREATE ROLE {{ item.user }} WITH INHERIT LOGIN ENCRYPTED PASSWORD '{{ item.pass }}';
    CREATE TABLESPACE {{ item.db }}_tbs OWNER {{ item.user }} LOCATION '/var/lib/pgsql/data/{{ item.db }}';
    CREATE DATABASE {{ item.db }} OWNER {{ item.user }} TABLESPACE {{ item.db }}_tbs TEMPLATE template0 ENCODING UTF8;
    GRANT ALL PRIVILEGES ON DATABASE {{ item.db }} TO {{ item.user }};
    EOSQL
    echo CREATED
  register: _baw_rt
  changed_when: "'CREATED' in _baw_rt.stdout"
  failed_when: _baw_rt.rc != 0 and 'EXISTS' not in _baw_rt.stdout
  no_log: true
  loop:
    - { db: "{{ baw_rt_db_name }}",  user: "{{ baw_rt_db_user }}",  pass: "{{ baw_rt_db_pass }}" }
    - { db: "{{ baw_pdw_db_name }}", user: "{{ baw_pdw_db_user }}", pass: "{{ baw_pdw_db_pass }}" }
  when: deploy_baw_runtime | default(false) | bool

- name: Create App Engine database
  ansible.builtin.shell: |
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='{{ aae_db_name }}'" | grep -q 1 && echo EXISTS && exit 0
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres <<'EOSQL'
    CREATE ROLE {{ aae_db_user }} WITH INHERIT LOGIN ENCRYPTED PASSWORD '{{ aae_db_pass }}';
    CREATE DATABASE {{ aae_db_name }} OWNER {{ aae_db_user }} ENCODING UTF8;
    GRANT ALL PRIVILEGES ON DATABASE {{ aae_db_name }} TO {{ aae_db_user }};
    EOSQL
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d {{ aae_db_name }} <<'EOSQL'
    CREATE SCHEMA IF NOT EXISTS {{ aae_db_user }} AUTHORIZATION {{ aae_db_user }};
    GRANT ALL ON SCHEMA {{ aae_db_user }} TO {{ aae_db_user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA {{ aae_db_user }} GRANT ALL ON TABLES TO {{ aae_db_user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA {{ aae_db_user }} GRANT ALL ON SEQUENCES TO {{ aae_db_user }};
    ALTER DATABASE {{ aae_db_name }} SET search_path TO {{ aae_db_user }};
    EOSQL
    echo CREATED
  register: _aae
  changed_when: "'CREATED' in _aae.stdout"
  failed_when: _aae.rc != 0 and 'EXISTS' not in _aae.stdout
  no_log: true
  when: deploy_app_engine | default(false) | bool

- name: Create ODM database
  ansible.builtin.shell: |
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='{{ odm_db_name }}'" | grep -q 1 && echo EXISTS && exit 0
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres <<'EOSQL'
    CREATE USER {{ odm_db_user }} WITH PASSWORD '{{ odm_db_pass }}';
    CREATE DATABASE {{ odm_db_name }} WITH OWNER = {{ odm_db_user }} ENCODING = 'UTF8' TABLESPACE = pg_default TEMPLATE = template0;
    REVOKE CONNECT ON DATABASE {{ odm_db_name }} FROM PUBLIC;
    GRANT ALL PRIVILEGES ON DATABASE {{ odm_db_name }} TO {{ odm_db_user }};
    GRANT CONNECT, TEMP, CREATE ON DATABASE {{ odm_db_name }} TO {{ odm_db_user }};
    EOSQL
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d {{ odm_db_name }} <<'EOSQL'
    CREATE SCHEMA IF NOT EXISTS {{ odm_db_user }} AUTHORIZATION {{ odm_db_user }};
    GRANT ALL ON SCHEMA {{ odm_db_user }} TO {{ odm_db_user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA {{ odm_db_user }} GRANT ALL ON TABLES TO {{ odm_db_user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA {{ odm_db_user }} GRANT ALL ON SEQUENCES TO {{ odm_db_user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA {{ odm_db_user }} GRANT ALL ON FUNCTIONS TO {{ odm_db_user }};
    ALTER DATABASE {{ odm_db_name }} SET search_path TO {{ odm_db_user }};
    EOSQL
    echo CREATED
  register: _odm_db
  changed_when: "'CREATED' in _odm_db.stdout"
  failed_when: _odm_db.rc != 0 and 'EXISTS' not in _odm_db.stdout
  when: deploy_odm | default(false) | bool

- name: PostgreSQL summary
  ansible.builtin.debug:
    msg:
      - "PostgreSQL ready at {{ postgres_host }}:{{ postgres_port }}"
      - "Databases created: {{ gcd_db_name }}, {{ docs_db_name }}, {{ dos_db_name }}, {{ tos_db_name }}, {{ icn_db_name }}, {{ bas_db_name }}"

  register: _icn
  changed_when: "'CREATED' in _icn.stdout"
  failed_when: "'CREATED' not in _icn.stdout"
  no_log: true
  when: deploy_icn | default(true) | bool

- name: Create BAStudio (BAS) authoring database
  ansible.builtin.shell: |
    POD="{{ _pg_pod.stdout }}"
    NS="{{ infra_namespace }}"
    DB="{{ bas_db_name }}"
    USER="{{ bas_db_user }}"
    PASS="{{ bas_db_pass }}"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED && exit 0
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -v ON_ERROR_STOP=0 \
      -c "CREATE ROLE $USER WITH INHERIT LOGIN ENCRYPTED PASSWORD '$PASS' CREATEDB CREATEROLE"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 || \
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres \
      -c "CREATE DATABASE $DB OWNER $USER ENCODING UTF8" \
      -c "GRANT ALL PRIVILEGES ON DATABASE $DB TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d $DB -v ON_ERROR_STOP=0 \
      -c "CREATE SCHEMA IF NOT EXISTS $USER AUTHORIZATION $USER" \
      -c "GRANT ALL ON SCHEMA $USER TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED
  register: _bas
  changed_when: "'CREATED' in _bas.stdout"
  failed_when: "'CREATED' not in _bas.stdout"
  no_log: true
  when: deploy_bastudio | default(true) | bool

- name: Create BAW Runtime databases
  ansible.builtin.shell: |
    POD="{{ _pg_pod.stdout }}"
    NS="{{ infra_namespace }}"
    DB="{{ item.db }}"
    USER="{{ item.user }}"
    PASS="{{ item.pass }}"
    DIR="/var/lib/pgsql/data/${DB}"
    TS="${DB}_tbs"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED && exit 0
    kubectl exec -n $NS $POD -- mkdir -p $DIR
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -v ON_ERROR_STOP=0 \
      -c "CREATE ROLE $USER WITH INHERIT LOGIN ENCRYPTED PASSWORD '$PASS'" \
      -c "CREATE TABLESPACE $TS OWNER $USER LOCATION '$DIR'" \
      -c "GRANT CREATE ON TABLESPACE $TS TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 || \
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres \
      -c "CREATE DATABASE $DB OWNER $USER TABLESPACE $TS TEMPLATE template0 ENCODING UTF8" \
      -c "GRANT ALL PRIVILEGES ON DATABASE $DB TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED
  register: _baw_rt
  changed_when: "'CREATED' in _baw_rt.stdout"
  failed_when: "'CREATED' not in _baw_rt.stdout"
  no_log: true
  loop:
    - { db: "{{ baw_rt_db_name }}",  user: "{{ baw_rt_db_user }}",  pass: "{{ baw_rt_db_pass }}" }
    - { db: "{{ baw_pdw_db_name }}", user: "{{ baw_pdw_db_user }}", pass: "{{ baw_pdw_db_pass }}" }
  when: deploy_baw_runtime | default(false) | bool

- name: Create App Engine database
  ansible.builtin.shell: |
    POD="{{ _pg_pod.stdout }}"
    NS="{{ infra_namespace }}"
    DB="{{ aae_db_name }}"
    USER="{{ aae_db_user }}"
    PASS="{{ aae_db_pass }}"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED && exit 0
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -v ON_ERROR_STOP=0 \
      -c "CREATE ROLE $USER WITH INHERIT LOGIN ENCRYPTED PASSWORD '$PASS'"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 || \
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres \
      -c "CREATE DATABASE $DB OWNER $USER ENCODING UTF8" \
      -c "GRANT ALL PRIVILEGES ON DATABASE $DB TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d $DB -v ON_ERROR_STOP=0 \
      -c "CREATE SCHEMA IF NOT EXISTS $USER AUTHORIZATION $USER" \
      -c "GRANT ALL ON SCHEMA $USER TO $USER" \
      -c "ALTER DEFAULT PRIVILEGES IN SCHEMA $USER GRANT ALL ON TABLES TO $USER" \
      -c "ALTER DEFAULT PRIVILEGES IN SCHEMA $USER GRANT ALL ON SEQUENCES TO $USER" \
      -c "ALTER DATABASE $DB SET search_path TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED
  register: _aae
  changed_when: "'CREATED' in _aae.stdout"
  failed_when: "'CREATED' not in _aae.stdout"
  no_log: true
  when: deploy_app_engine | default(false) | bool

- name: Create ODM database
  ansible.builtin.shell: |
    POD="{{ _pg_pod.stdout }}"
    NS="{{ infra_namespace }}"
    DB="{{ odm_db_name }}"
    USER="{{ odm_db_user }}"
    PASS="{{ odm_db_pass }}"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED && exit 0
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -v ON_ERROR_STOP=0 \
      -c "CREATE USER $USER WITH PASSWORD '$PASS'"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 || \
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres \
      -c "CREATE DATABASE $DB WITH OWNER=$USER ENCODING='UTF8' TABLESPACE=pg_default TEMPLATE=template0" \
      -c "REVOKE CONNECT ON DATABASE $DB FROM PUBLIC" \
      -c "GRANT ALL PRIVILEGES ON DATABASE $DB TO $USER" \
      -c "GRANT CONNECT, TEMP, CREATE ON DATABASE $DB TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d $DB -v ON_ERROR_STOP=0 \
      -c "CREATE SCHEMA IF NOT EXISTS $USER AUTHORIZATION $USER" \
      -c "GRANT ALL ON SCHEMA $USER TO $USER" \
      -c "ALTER DEFAULT PRIVILEGES IN SCHEMA $USER GRANT ALL ON TABLES TO $USER" \
      -c "ALTER DEFAULT PRIVILEGES IN SCHEMA $USER GRANT ALL ON SEQUENCES TO $USER" \
      -c "ALTER DEFAULT PRIVILEGES IN SCHEMA $USER GRANT ALL ON FUNCTIONS TO $USER" \
      -c "ALTER DATABASE $DB SET search_path TO $USER"
    kubectl exec -n $NS $POD -- psql -U postgres -d postgres -tAc \
      "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1 && echo CREATED
  register: _odm_db
  changed_when: "'CREATED' in _odm_db.stdout"
  failed_when: "'CREATED' not in _odm_db.stdout"
  when: deploy_odm | default(false) | bool

- name: PostgreSQL summary
  ansible.builtin.debug:
    msg:
      - "PostgreSQL ready at {{ postgres_host }}:{{ postgres_port }}"
      - "Databases created: {{ gcd_db_name }}, {{ docs_db_name }}, {{ dos_db_name }}, {{ tos_db_name }}, {{ icn_db_name }}, {{ bas_db_name }}"

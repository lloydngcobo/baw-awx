    kubectl exec -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- mkdir -p /var/lib/pgsql/data/{{ tos_db_name }}/data /var/lib/pgsql/data/{{ tos_db_name }}/index
    kubectl exec -i -n {{ infra_namespace }} {{ _pg_pod.stdout }} -- psql -U postgres -d postgres <<'EOSQL'
    CREATE ROLE {{ tos_db_user }} WITH INHERIT LOGIN ENCRYPTED PASSWORD '{{ tos_db_pass }}';
    CREATE TABLESPACE {{ tos_db_name }}_tbs OWNER {{ tos_db_user }} LOCATION '/var/lib/pgsql/data/{{ tos_db_name }}/data';
    CREATE TABLESPACE {{ tos_db_name }}indexts OWNER {{ tos_db_user }} LOCATION '/var/lib/pgsql/data/{{ tos_db_name }}/index';

                  - name: odm-liberty-config
                    mountPath: /config/configDropins/overrides/ibm_ldap_custom_default1.xml
                    subPath: ibm_ldap_custom_default1.xml
                  - name: odm-liberty-config
                    mountPath: /config/configDropins/overrides/ibm_ldap_federated.xml
                    subPath: ibm_ldap_federated.xml
                  - name: odm-liberty-config
                    mountPath: /config/configDropins/overrides/ibm_custom-ssl.xml
                    subPath: ibm_custom-ssl.xml
                  - name: odm-liberty-config
                    mountPath: /config/configDropins/overrides/ibm_custom-ltpa.xml
                    subPath: ibm_custom-ltpa.xml
                  - name: odm-liberty-config

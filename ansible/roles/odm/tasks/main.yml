          - port: 9080
            targetPort: 9080
            name: http
          - port: 9443
            targetPort: 9443
            name: https

# ── Wait ──────────────────────────────────────────────────────────────────────

- name: Wait for ODM Decision Center
  ansible.builtin.shell: >
    oc rollout status deployment/odm-decisioncenter
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false

- name: Wait for ODM Decision Server Runtime
  ansible.builtin.shell: >
    oc rollout status deployment/odm-decisionserverruntime
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false

- name: ODM summary
  ansible.builtin.debug:
    msg:
      - "ODM Decision Center  : https://odm-dc-svc.{{ baw_namespace }}.svc.cluster.local:9453"
      - "ODM Decision Runtime : https://odm-dsr-svc.{{ baw_namespace }}.svc.cluster.local:9443"
      - "ODM Decision Center URL : https://{{ baw_hostname }}/odm/decisioncenter"

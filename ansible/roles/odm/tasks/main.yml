                envFrom:
                  - configMapRef:
                      name: odm-config
                env:
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: DB_PASSWORD
                  - name: LDAP_BIND_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret

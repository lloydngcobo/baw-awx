        name: odm-decisionserverruntime
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
          component: decisionserverruntime
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: odm
            component: decisionserverruntime
        template:
          metadata:
            labels:
              app: odm
              component: decisionserverruntime
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000

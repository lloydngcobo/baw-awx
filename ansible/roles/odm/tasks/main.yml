---
# Role: odm
# Deploys IBM Operational Decision Manager (ODM) 9.0.0.0
# Four components: Decision Center, Server Console, Server Runtime, Decision Runner.
# Only runs when deploy_odm: true.
# Requires: PostgreSQL, LDAP running. Uses odm_db database.
# Ref: baw-microshift-rhel/install/odm/

# ── Secrets ───────────────────────────────────────────────────────────────────

- name: Create ODM credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: odm-secret
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
      stringData:
        DB_PASSWORD:       "{{ odm_db_pass }}"
        LDAP_BIND_PASSWORD: "{{ ldap_bind_password }}"
        KEYSTORE_PASSWORD: "{{ keystore_password }}"
  no_log: true

# ── ConfigMap ─────────────────────────────────────────────────────────────────

- name: Create ODM configuration ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: odm-config
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
      data:
        DB_TYPE:           "postgresql"
        DB_SERVER_NAME:    "{{ postgres_host }}"
        DB_PORT_NUMBER:    "{{ postgres_port }}"
        DB_NAME:           "{{ odm_db_name }}"
        DB_USER:           "{{ odm_db_user }}"
        LDAP_SERVER:       "ldap://{{ ldap_host }}:{{ ldap_port }}"
        LDAP_BASE_DN:      "{{ ldap_base_dn }}"
        LDAP_BIND_DN:      "{{ ldap_bind_dn }}"
        LDAP_USER_FILTER:  "(&(uid=%v)(objectclass=inetOrgPerson))"
        LDAP_GROUP_FILTER: "(&(cn=%v)(objectclass=groupOfNames))"
        SAMPLE_MODE:       "false"
        TZ:                "{{ timezone }}"

# ── Storage ───────────────────────────────────────────────────────────────────

- name: Create ODM Decision Center PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: odm-dc-pvc
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 5Gi
        storageClassName: "{{ storage_class_name }}"

# ── 1. Decision Center ────────────────────────────────────────────────────────

- name: Deploy ODM Decision Center
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: odm-decisioncenter
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
          component: decisioncenter
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: odm
            component: decisioncenter
        template:
          metadata:
            labels:
              app: odm
              component: decisioncenter
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000
            containers:
              - name: decisioncenter
                image: "{{ odm_dc_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 9060
                    name: http
                  - containerPort: 9453
                    name: https
                envFrom:
                  - configMapRef:
                      name: odm-config
                env:
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: DB_PASSWORD
                  - name: LDAP_BIND_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: LDAP_BIND_PASSWORD
                resources:
                  requests:
                    memory: 1Gi
                    cpu: 500m
                  limits:
                    memory: 3Gi
                    cpu: "2"
                readinessProbe:
                  tcpSocket:
                    port: 9453
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  failureThreshold: 20
                volumeMounts:
                  - name: data
                    mountPath: /opt/ibm/odm/decisioncenter
                  - name: tls
                    mountPath: /opt/ibm/odm/shared/tls
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: odm-dc-pvc
              - name: tls
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: ca.crt
                      path: ca.crt

- name: Create ODM Decision Center Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: odm-dc-svc
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
          component: decisioncenter
      spec:
        selector:
          app: odm
          component: decisioncenter
        ports:
          - port: 9060
            targetPort: 9060
            name: http
          - port: 9453
            targetPort: 9453
            name: https

# ── 2. Decision Server Console ────────────────────────────────────────────────

- name: Deploy ODM Decision Server Console
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: odm-decisionserverconsole
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
          component: decisionserverconsole
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: odm
            component: decisionserverconsole
        template:
          metadata:
            labels:
              app: odm
              component: decisionserverconsole
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000
            containers:
              - name: decisionserverconsole
                image: "{{ odm_dsc_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 9080
                    name: http
                  - containerPort: 9443
                    name: https
                envFrom:
                  - configMapRef:
                      name: odm-config
                env:
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: DB_PASSWORD
                  - name: LDAP_BIND_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: LDAP_BIND_PASSWORD
                resources:
                  requests:
                    memory: 512Mi
                    cpu: 500m
                  limits:
                    memory: 2Gi
                    cpu: "2"
                readinessProbe:
                  tcpSocket:
                    port: 9443
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  failureThreshold: 20

- name: Create ODM Decision Server Console Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: odm-dsc-svc
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
          component: decisionserverconsole
      spec:
        selector:
          app: odm
          component: decisionserverconsole
        ports:
          - port: 9080
            targetPort: 9080
            name: http
          - port: 9443
            targetPort: 9443
            name: https


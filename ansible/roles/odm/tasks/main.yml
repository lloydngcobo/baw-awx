# ── 4. Decision Runner ────────────────────────────────────────────────────────

- name: Deploy ODM Decision Runner
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: odm-decisionrunner
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
          component: decisionrunner
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: odm
            component: decisionrunner
        template:
          metadata:
            labels:
              app: odm
              component: decisionrunner
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000
            containers:
              - name: decisionrunner
                image: "{{ odm_dr_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 9080
                    name: http
                  - containerPort: 9443
                    name: https
                envFrom:
                  - configMapRef:
                      name: odm-config
                env:
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: DB_PASSWORD
                  - name: LDAP_BIND_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: LDAP_BIND_PASSWORD
                resources:
                  requests:
                    memory: 512Mi
                    cpu: 200m
                  limits:
                    memory: 1Gi
                    cpu: "1"
                readinessProbe:
                  tcpSocket:
                    port: 9443
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  failureThreshold: 20

- name: Create ODM Decision Runner Service
  kubernetes.core.k8s:
    state: present
    definition:

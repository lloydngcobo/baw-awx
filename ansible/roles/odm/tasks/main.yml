---
# Role: odm
# Deploys IBM Operational Decision Manager (ODM) 25.0.1
# Business rules engine for decision automation in workflows.
# Only runs when deploy_odm: true.
# Requires: CPE, UMS running. Uses separate ODM databases.

# ── Secrets ───────────────────────────────────────────────────────────────────

- name: Create ODM credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: odm-secret
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
      stringData:
        ODM_ADMIN_USER:              "{{ ums_admin_user }}"
        ODM_ADMIN_PASSWORD:          "{{ ums_admin_password }}"
        LDAP_BIND_PASSWORD:          "{{ ldap_bind_password }}"
        KEYSTORE_PASSWORD:           "{{ keystore_password }}"
        LTPA_PASSWORD:               "{{ ltpa_password }}"
        UMS_INTERNAL_CLIENT_SECRET:  "{{ ums_internal_client_secret }}"
  no_log: true

# ── Liberty server config ─────────────────────────────────────────────────────

- name: Create ODM Liberty config ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: odm-liberty-config
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
      data:
        ldap-registry.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <ldapRegistry id="LDAPUserRegistry"
              realm="defaultWIMFileBasedRealm"
              host="{{ ldap_host }}"
              port="{{ ldap_port }}"
              baseDN="{{ ldap_base_dn }}"
              bindDN="{{ ldap_bind_dn }}"
              bindPassword="${env.LDAP_BIND_PASSWORD}"
              ldapType="Custom">
              <ldapEntityType name="PersonAccount">
                <rdnProperty name="uid"/>
                <objectClass>inetOrgPerson</objectClass>
              </ldapEntityType>
              <ldapEntityType name="Group">
                <rdnProperty name="cn"/>
                <objectClass>groupOfNames</objectClass>
                <memberAttribute name="member"/>
              </ldapEntityType>
              <userFilter
                filter="(&amp;(uid=%v)(objectclass=inetOrgPerson))"/>
              <groupFilter
                filter="(&amp;(cn=%v)(objectclass=groupOfNames))"/>
              <userIdMap filter="uid"/>
              <groupIdMap filter="cn"/>
              <groupMemberIdMap filter="member"/>
            </ldapRegistry>
          </server>

        ssl-config.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <keyStore id="defaultKeyStore"
              location="/shared/tls/pkcs12/server.p12"
              password="${env.KEYSTORE_PASSWORD}"
              type="PKCS12"/>
            <keyStore id="defaultTrustStore"
              location="/shared/tls/pkcs12/trusts.p12"
              password="${env.KEYSTORE_PASSWORD}"
              type="PKCS12"/>
            <ssl id="defaultSSLConfig"
              keyStoreRef="defaultKeyStore"
              trustStoreRef="defaultTrustStore"
              sslProtocol="TLSv1.2"/>
            <sslDefault sslRef="defaultSSLConfig"/>
          </server>

        transport.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <httpEndpoint id="defaultHttpEndpoint"
              host="*"
              httpPort="9080"
              httpsPort="9443"/>
          </server>

# ── Storage ───────────────────────────────────────────────────────────────────

- name: Create ODM data PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: odm-pvc
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 10Gi
        storageClassName: "{{ storage_class_name }}"

# ── Deployment ────────────────────────────────────────────────────────────────

- name: Deploy ODM
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: odm
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: odm
        template:
          metadata:
            labels:
              app: odm
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000
            containers:
              - name: odm
                image: "{{ odm_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 9080
                    name: http
                  - containerPort: 9443
                    name: https
                envFrom:
                  - secretRef:
                      name: odm-secret
                env:
                  - name: CPE_URI
                    value: "https://{{ cpe_host }}:{{ cpe_port }}/wsi/FNCEWS40MTOM/"
                  - name: UMS_HOST
                    value: "https://{{ baw_hostname }}/ums"
                  - name: TZ
                    value: "{{ timezone }}"
                  - name: JVM_HEAP_XMS
                    value: "512m"
                  - name: JVM_HEAP_XMX
                    value: "1024m"
                  - name: ADMIN_USER
                    value: "{{ ums_admin_user }}"
                  - name: ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: ODM_ADMIN_PASSWORD
                resources:
                  requests:
                    memory: 1Gi
                    cpu: 250m
                  limits:
                    memory: 2Gi
                    cpu: "1"
                livenessProbe:
                  httpGet:
                    path: /res
                    port: 9080
                    scheme: HTTP
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  failureThreshold: 10
                readinessProbe:
                  httpGet:
                    path: /res
                    port: 9080
                    scheme: HTTP
                  initialDelaySeconds: 90
                  periodSeconds: 15
                  failureThreshold: 20
                startupProbe:
                  httpGet:
                    path: /res
                    port: 9080
                    scheme: HTTP
                  periodSeconds: 15
                  failureThreshold: 60
                volumeMounts:
                  - name: data
                    mountPath: /opt/ibm/odm/data
                  - name: logs
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/logs
                  - name: overrides-dir
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ldap-registry.xml
                    subPath: ldap-registry.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ssl-config.xml
                    subPath: ssl-config.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/transport.xml
                    subPath: transport.xml
                  - name: tls
                    mountPath: /shared/tls/pkcs12
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: odm-pvc
              - name: logs
                emptyDir: {}
              - name: overrides-dir
                emptyDir: {}
              - name: liberty-config
                configMap:
                  name: odm-liberty-config
              - name: tls
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: server.p12
                      path: server.p12
                    - key: trusts.p12
                      path: trusts.p12

# ── Service ───────────────────────────────────────────────────────────────────

- name: Create ODM Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: odm-svc
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
      spec:
        selector:
          app: odm
        ports:
          - port: 9080
            targetPort: 9080
            name: http
          - port: 9443
            targetPort: 9443
            name: https

# ── Wait ──────────────────────────────────────────────────────────────────────

- name: Wait for ODM deployment
  ansible.builtin.shell: >
    oc rollout status deployment/odm
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false

- name: ODM summary
  ansible.builtin.debug:
    msg:
      - "ODM ready at https://odm-svc.{{ baw_namespace }}.svc.cluster.local:9443"
      - "ODM URL : https://{{ baw_hostname }}/res/"

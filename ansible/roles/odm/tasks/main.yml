                        key: LDAP_BIND_PASSWORD
                  - name: KEYSTORE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: KEYSTORE_PASSWORD
                  # DSR must register with DSC — use internal svc name
                  - name: DECISIONSERVERCONSOLE_NAME
                    value: "odm-dsc-svc.{{ baw_namespace }}.svc.cluster.local"
                resources:
                  requests:
                    memory: 512Mi
                    cpu: 500m
                  limits:
                    memory: 2Gi
                    cpu: "2"
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                  privileged: false
                  runAsNonRoot: true
                  readOnlyRootFilesystem: false
                  allowPrivilegeEscalation: false
                  seccompProfile:
                    type: RuntimeDefault
                readinessProbe:
                  tcpSocket:
                    port: 9443
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  failureThreshold: 20
                volumeMounts:
                  - name: odm-pvc
                    mountPath: /config/dbdata
                    subPath: decisionserverruntime/dbdata
                  - name: shared-ssl
                    mountPath: /shared/tls/pkcs12
                  - name: odm-liberty-config
                    mountPath: /config/configDropins/overrides/ibm_ldap_custom_default1.xml
                    subPath: ibm_ldap_custom_default1.xml
                  - name: odm-liberty-config
                    mountPath: /config/configDropins/overrides/ibm_ldap_federated.xml
                    subPath: ibm_ldap_federated.xml
                  - name: odm-liberty-config
                    mountPath: /config/configDropins/overrides/ibm_custom-ssl.xml
                    subPath: ibm_custom-ssl.xml
                  - name: odm-liberty-config
                    mountPath: /config/configDropins/overrides/ibm_custom-ltpa.xml
                    subPath: ibm_custom-ltpa.xml
                  - name: odm-liberty-config
                    mountPath: /config/resources/security/custom-ltpa.keys
                    subPath: custom-ltpa.keys
                  - name: odm-liberty-config
                    mountPath: /config/configDropins/overrides/http-session.xml
                    subPath: http-session.xml
            volumes:
              - name: odm-pvc
                persistentVolumeClaim:
                  claimName: odm-pvc
              - name: shared-ssl
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: server.p12
                      path: server.p12
                    - key: trusts.p12
                      path: trusts.p12
              - name: odm-liberty-config
                configMap:
                  name: odm-liberty-config

- name: Create ODM Decision Server Runtime Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service

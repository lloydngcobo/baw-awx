                envFrom:
                  - configMapRef:
                      name: odm-config
                env:
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: DB_PASSWORD
                  - name: LDAP_BIND_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: LDAP_BIND_PASSWORD
                  - name: KEYSTORE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: odm-secret
                        key: KEYSTORE_PASSWORD
                resources:
                  requests:
                    memory: 512Mi
                    cpu: 200m
                  limits:
                    memory: 1Gi
                    cpu: "1"
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                  privileged: false
                  runAsNonRoot: true
                  readOnlyRootFilesystem: false
                  allowPrivilegeEscalation: false
                  seccompProfile:

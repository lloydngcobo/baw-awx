                  claimName: odm-pvc
              - name: shared-ssl
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: server.p12
                      path: server.p12
                    - key: trusts.p12
                      path: trusts.p12
              - name: odm-liberty-config
                configMap:
                  name: odm-liberty-config

- name: Create ODM Decision Runner Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: odm-dr-svc
        namespace: "{{ baw_namespace }}"
        labels:
          app: odm
          component: decisionrunner
      spec:
        selector:
          app: odm
          component: decisionrunner
        ports:
          - port: 9080
            targetPort: 9080
            name: http
          - port: 9443
            targetPort: 9443
            name: https

# ── Wait ──────────────────────────────────────────────────────────────────────

- name: Wait for ODM Decision Center
  ansible.builtin.shell: >
    oc rollout status deployment/odm-decisioncenter
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false

- name: Wait for ODM Decision Server Runtime
  ansible.builtin.shell: >
    oc rollout status deployment/odm-decisionserverruntime
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false

- name: ODM summary
  ansible.builtin.debug:
    msg:
      - "ODM Decision Center     : https://{{ baw_hostname }}/decisioncenter"
      - "ODM Decision Server     : https://{{ baw_hostname }}/res"
      - "ODM Decision Service    : https://{{ baw_hostname }}/DecisionService"
      - "ODM Decision Runner     : https://{{ baw_hostname }}/DecisionRunner"

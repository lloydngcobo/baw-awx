---
# Role: bastudio
# Deploys IBM BAStudio (Business Automation Workflow — authoring) 25.0.1
#
# Image: cp.icr.io/cp/cp4a/bas/workflow-authoring:25.0.1
#
# How the image works (verified by introspection):
#   - Liberty runtime managed by supervisord
#   - ALL configuration via Liberty variable substitution (${variable}) in
#     configDropins/defaults/*.xml; overrides go in configDropins/overrides/
#   - Default datasource is DB2; image overrides with PostgreSQL when DB_TYPE=POSTGRESQL
#     (database.sh copies 60Database.xml.PostgreSQL → config/system/ at Liberty startup)
#   - DB schema created by: /opt/ibm/wlp/ibmProcessServer/bin/dbConfig init defaultServer
#   - workflow-authoring:25.0.1 does NOT ship a PostgreSQL JDBC driver; it must be
#     downloaded at startup (02-download-postgresql-driver.sh) into the emptyDir volume
#     mounted at jdbcdrivers/PostgreSQL/ (same path datasource.xml.PostgreSQL references)
#   - No bootstrap.sh / content_init.sh / etc. — those scripts do not exist
#   - OIDC, UMS JAAS, FileNet JAAS, LTPA all handled by defaults once
#     variables are supplied
#   - mpHealth endpoint at /health (probe directly against pod port 9080)
#   - Context root prefix set to /bas to match OpenShift route
#
# Sequence:
#   1. bastudio-secret        — all passwords as env vars
#   2. bastudio-liberty-config ConfigMap — four override XML files
#   3. PVCs
#   4. bastudio-db-init Job   — dbConfig init defaultServer (PostgreSQL schema)
#   5. BAStudio Deployment + Service

# ── Secrets ───────────────────────────────────────────────────────────────────

- name: Create BAStudio credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: bastudio-secret
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-bastudio
      stringData:
        BAS_ADMIN_PASSWORD:          "{{ ums_admin_password }}"
        BAS_DB_USER:                 "{{ bas_db_user }}"
        BAS_DB_PASS:                 "{{ bas_db_pass }}"
        LDAP_BIND_PASSWORD:          "{{ ldap_bind_password }}"
        KEYSTORE_PASSWORD:           "{{ keystore_password }}"
        BASTUDIO_OIDC_CLIENT_SECRET: "{{ bastudio_oidc_client_secret }}"
        CPE_ADMIN_PASSWORD:          "{{ cpe_admin_password }}"
  no_log: true

# ── Liberty config overrides ──────────────────────────────────────────────────
# Four files land in configDropins/overrides/ and override the built-in defaults.
# PostgreSQL datasource is handled by the image's 60Database.xml.PostgreSQL (installed
# by database.sh when DB_TYPE=POSTGRESQL) + Liberty variables from processServer_variables.xml.
# We do NOT mount a custom datasource.xml — doing so creates a duplicate <properties>
# element for jdbc/TeamWorksDB (CWWKG0074E) since 60Database.xml.PostgreSQL is already live.
#
# processServer_variables.xml  — supplies every ${variable} used by default configs
# transport.xml                — overrides httpEndpoint to bind on container ports (9080/9443)
#                                server.xml uses ${http_port}=-1 and ${https_port}=443 which are
#                                unusable inside the pod (HTTP disabled, HTTPS port privileged)
# ssl.xml                      — points defaultKeyStore/TrustStore to our PKCS12 files
# ldap-registry.xml            — WIM LDAP integration (baseDN = ldap_user_base, rdnProperty = cn)

- name: Create BAStudio Liberty config ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: bastudio-liberty-config
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-bastudio
      data:
        processServer_variables.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <!-- ── Host / ports ───────────────────────────────── -->
            <variable name="hostname"              value="{{ baw_hostname }}"/>
            <variable name="http_port"             value="-1"/>
            <variable name="https_port"            value="443"/>
            <variable name="external_hostname"     value="{{ baw_hostname }}"/>
            <variable name="external_https_port"   value="443"/>

            <!-- ── Context root — must match the /bas OpenShift route ── -->
            <variable name="baw_context_root_prefix" value="/bas"/>

            <!-- ── Admin credentials ─────────────────────────── -->
            <variable name="admin_user"            value="{{ ums_admin_user }}"/>
            <variable name="admin_password"        value="${env.BAS_ADMIN_PASSWORD}"/>

            <!-- ── Database ──────────────────────────────────── -->
            <variable name="db_type"               value="PostgreSQL"/>
            <variable name="db_name"               value="{{ bas_db_name }}"/>
            <variable name="db_host"               value="{{ postgres_host }}"/>
            <variable name="db_port"               value="{{ postgres_port }}"/>
            <variable name="db_user"               value="${env.BAS_DB_USER}"/>
            <variable name="db_password"           value="${env.BAS_DB_PASS}"/>
            <variable name="db_check_wait_time"    value="300"/>
            <variable name="db_check_interval_time" value="10"/>

            <!-- ── OIDC client (registered as 'bastudio' in UMS) ── -->
            <variable name="client_id"             value="bastudio"/>
            <variable name="client_secret"         value="${env.BASTUDIO_OIDC_CLIENT_SECRET}"/>

            <!-- ── UMS ───────────────────────────────────────── -->
            <!--
              ums_hostname/ums_port point to the INTERNAL UMS service so that
              server-side SCIM calls (post-login user lookup) go to the internal
              URL and use the BAW Root CA (trusted by trusts.p12).
              Setting ums_hostname to the external hostname would make BAStudio call
              https://baw_hostname/ibm/api/scim/Users which hits the OCP router and
              presents CN=*.apps.homelab.home.nl — a cert NOT in trusts.p12 (CWPKI0823E).

              logout-domain-override.xml (also in this ConfigMap and mounted below)
              overrides logoutPageRedirectDomainNames back to the external hostname,
              since baw_server.xml derives that attribute from ${ums_hostname}.
            -->
            <variable name="ums_hostname"          value="ums-svc.{{ baw_namespace }}.svc.cluster.local"/>
            <variable name="ums_port"              value="9443"/>
            <variable name="ums_admin_user"        value="{{ ums_admin_user }}"/>
            <variable name="ums_admin_password"    value="${env.BAS_ADMIN_PASSWORD}"/>
            <!--
              ums_urlprefix         : used for browser-facing OIDC authorize redirect
              ums_urlprefix_service_sso : used for server-to-server token/introspect/jwk calls
              Both are hardcoded here (not derived from ums_hostname:ums_port) so that
              the browser redirect still goes to the external URL.
            -->
            <variable name="ums_urlprefix"         value="https://{{ baw_hostname }}"/>
            <variable name="ums_urlprefix_service_sso"
                                                   value="https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443"/>

            <!-- ── SSL / LTPA ─────────────────────────────────── -->
            <variable name="ssl_keystore_password" value="${env.KEYSTORE_PASSWORD}"/>

            <!-- ── Automation service user ──────────────────── -->
            <variable name="automation_service_user"     value="{{ ums_admin_user }}"/>
            <variable name="automation_service_password" value="${env.BAS_ADMIN_PASSWORD}"/>

            <!-- ── Delivery type ─────────────────────────────── -->
            <variable name="delivery_type"         value="baw"/>

            <!-- ── Liberty server type — MUST be "BA Studio" ─── -->
            <!--
              processServer_variables_system.xml (image default, in overrides/) sets:
                libertyServerType = "BAW Designer"
              EnvironmentUtils.isLibertyBAStudio() checks: "BA Studio".equals(libertyServerType)
              With the default value the check returns false and the BAStudio UI shows:
                "/bas/BAStudio is not valid for this server type"
              Override with the correct value for the authoring (BAStudio) server type.
            -->
            <variable name="libertyServerType"     value="BA Studio"/>

            <!-- ── JMS (single-server: loopback) ─────────────── -->
            <variable name="jms_server_host"       value="127.0.0.1"/>

            <!-- ── CPE credentials for FileNetAdminAlias (cpe-auth.xml) ── -->
            <variable name="CPE_USERNAME"          value="{{ cpe_admin_user }}"/>
            <variable name="CPE_PASSWORD"          value="${env.CPE_ADMIN_PASSWORD}"/>
          </server>

        datasource.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            REFERENCE ONLY — not currently mounted by any pod or Job.

            Previously mounted into the DB init Job's configDropins/overrides/ but removed
            because it produced CWWKG0074E: both defaults/datasource.xml (DB2) and
            overrides/datasource.xml (this file, PostgreSQL) merge for the same
            id="jdbc/TeamWorksDB", creating two <properties.*> children (max 1 allowed).

            The DB init Job now instead copies datasource.xml.PostgreSQL over
            datasource.xml inside configDropins/defaults/ at job start — same technique
            as 01-activate-postgresql-ds.sh uses for the Deployment.

            Kept here as documentation of the correct PostgreSQL datasource structure.
          -->
          <server>
            <library id="postgresqlJDBCLib">
              <fileset dir="${wlp.install.dir}/ibmProcessServer/lib/jdbcdrivers/PostgreSQL"
                       includes="postgresql.jar"/>
            </library>

            <dataSource commitOrRollbackOnCleanup="commit"
                        id="jdbc/TeamWorksDB"
                        jndiName="jdbc/TeamWorksDB"
                        isolationLevel="TRANSACTION_READ_COMMITTED"
                        type="javax.sql.XADataSource">
              <connectionManager maxPoolSize="50" minPoolSize="1"/>
              <jdbcDriver javax.sql.XADataSource="org.postgresql.xa.PGXADataSource"
                          libraryRef="postgresqlJDBCLib"/>
              <properties.postgresql
                databaseName="${db_name}"
                serverName="${db_host}"
                portNumber="${db_port}"
                user="${db_user}"
                password="${db_password}"/>
            </dataSource>
          </server>

        ssl.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Overrides the default ssl.xml to point Liberty at our PKCS12 files
            mounted from the shared-ssl-config ConfigMap at /shared/tls/pkcs12/.
            Uses ssl_keystore_password variable (supplied via processServer_variables.xml).
          -->
          <server>
            <keyStore id="defaultKeyStore"
              location="/shared/tls/pkcs12/server.p12"
              password="${ssl_keystore_password}"
              type="PKCS12"
              updateTrigger="polled"
              pollingRate="5000ms"/>

            <keyStore id="defaultTrustStore"
              location="/shared/tls/pkcs12/trusts.p12"
              password="${ssl_keystore_password}"
              type="PKCS12"/>

            <ssl id="defaultSSLConfig"
              keyStoreRef="defaultKeyStore"
              trustStoreRef="defaultTrustStore"
              sslProtocol="TLSv1.2"/>

            <sslDefault sslRef="defaultSSLConfig"/>
          </server>

        transport.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Override the Liberty httpEndpoint to bind on container ports, NOT external ports.

            The image's server.xml sets:
              httpPort  = ${http_port}   → our variable = -1  (HTTP intentionally disabled)
              httpsPort = ${https_port}  → our variable = 443 (external port, privileged, can't bind)
              host      = ${hostname}    → our variable = baw.apps.homelab.home.nl
                                            resolves to the OpenShift router IP, not the pod IP

            All three prevent Liberty from opening any listener inside the container:
              - http_port=-1   → port 9080 never opens → health probes always fail
              - https_port=443 → privileged port (< 1024) → bind fails for UID 1000140000
              - host=<ext>     → binds to router IP, not pod IP → in-cluster connections refused

            This override fixes all three by hardcoding container-side values.
            ${https_port}=443 is still used by oidc-rp.xml for the external redirect URL
            (redirectToRPHostAndPort="https://${hostname}:${https_port}") — that stays correct.

            Liberty config-merge semantics: overrides/ wins over defaults/ and server.xml for
            each attribute. Child elements (sslOptions, tcpOptions, etc.) from server.xml are
            preserved since we only override attributes on the httpEndpoint element itself.
          -->
          <server>
            <httpEndpoint id="defaultHttpEndpoint"
              host="*"
              httpPort="9080"
              httpsPort="9443"/>
          </server>

        ums-jaaslogin.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            UMS JAAS login module — required for post-OIDC user authentication.
            Sets up auth aliases referenced by scim.xml, ums-auth-options, and the
            UMSLoginModule that enriches the Subject after the OIDC token exchange.
            Without this file Liberty has no UMS JAAS context and "The current user
            didn't load properly" is shown after login.
          -->
          <server>
            <authData id="UMSTeams-auth-alias"    user="${ums_admin_user}" password="${ums_admin_password}"/>
            <authData id="UMSAuth-client-alias"   user="${client_id}"      password="${client_secret}"/>
            <authData id="SCIM-client-auth-alias" user="${ums_admin_user}" password="${ums_admin_password}"/>

            <library id="umsJaasLoginLib">
              <fileset dir="${wlp.install.dir}/ibmProcessServer/lib/BPM/Lombardi/lib"
                       includes="com.ibm.dba.ums.jaaslogin.jar"/>
            </library>

            <jaasLoginModule
              id="umsJaasLogin"
              className="com.ibm.dba.ums.security.authentication.jaas.modules.UMSLoginModule"
              controlFlag="REQUIRED"
              libraryRef="umsJaasLoginLib">
              <options
                umsEndpointBaseUrl="https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/oidc/endpoint/ums"
                userinfo="false"
                clientId="${client_id}"
                clientSecret="${client_secret}"
                disableCnCheck="true"/>
            </jaasLoginModule>

            <jaasLoginContextEntry
              id="umsJaasContext"
              name="umsJaasContext"
              loginModuleRef="umsJaasLogin, hashtable"/>
          </server>

        111Custom.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            BAW TeamWorks configuration overlay.
            Enables required server components, configures SCIM options pointing to
            the internal UMS service, and sets ums-auth-options so BAStudio knows
            where to authenticate users after OIDC login.
            Disabling UMS Teams (empty URL) prevents CWLLG2330E timeout errors.
          -->
          <properties>
            <server>
              <components merge="mergeChildren">
                <component name="RapidWorkflow"      enabled="true" merge="replace"/>
                <component name="Workplace"          enabled="true" merge="replace"/>
                <component name="BAWContainerServer" enabled="true" merge="replace"/>
              </components>

              <search-index merge="mergeChildren">
                <task-index-enabled      merge="replace">false</task-index-enabled>
                <federated-index-enabled merge="replace">false</federated-index-enabled>
                <fdr-index-enabled       merge="replace">false</fdr-index-enabled>
              </search-index>

              <exposed-project-types merge="replace">
                <project-type>general</project-type>
                <project-type>processapp</project-type>
                <project-type>casesolution</project-type>
              </exposed-project-types>

              <server-name        merge="replace">workflow authoring</server-name>
              <server-description merge="replace">BAW Workflow Authoring</server-description>
            </server>

            <common>
              <security>
                <scim-options merge="replace">
                  <scim-user-auth-alias-name>SCIM-client-auth-alias</scim-user-auth-alias-name>
                  <scim-server-host-name>ums-svc.{{ baw_namespace }}.svc.cluster.local</scim-server-host-name>
                  <scim-server-port>9443</scim-server-port>
                  <disable-cn-check>true</disable-cn-check>
                  <scim-client-ssl-config></scim-client-ssl-config>
                  <user-search-attribute>principalName</user-search-attribute>
                  <user-name-identifier>userName</user-name-identifier>
                  <!--
                    user-uniquename-identifier = id (ref: baw-microshift-rhel):
                    UMS SCIM uses full LDAP DN as user id (cn=bawadmin,ou=dev,...).
                    BAW calls GET /ibm/api/scim/Users/{id} — must use the DN.
                    A DB fixup task updates lsw_usr user_name='bawadmin' to the
                    full DN so the bootstrapped admin record is still found.
                  -->
                  <user-uniquename-identifier>id</user-uniquename-identifier>
                  <user-displayname-query-attr>displayName</user-displayname-query-attr>
                  <user-displayname-result-attr>displayName</user-displayname-result-attr>
                  <group-search-attribute>principalName</group-search-attribute>
                  <group-name-identifier>name</group-name-identifier>
                  <group-uniquename-identifier>id</group-uniquename-identifier>
                  <group-displayname-result-attr>displayName</group-displayname-result-attr>
                  <group-displayname-query-attr>displayName</group-displayname-query-attr>
                </scim-options>

                <ums-auth-options>
                  <ums-auth-endpoint-url merge="replace">https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/oidc/endpoint/ums</ums-auth-endpoint-url>
                  <ums-auth-client-alias-name merge="replace">UMSAuth-client-alias</ums-auth-client-alias-name>
                  <ums-auth-ssl-config></ums-auth-ssl-config>
                  <ums-auth-connection-timeout    merge="replace">360000</ums-auth-connection-timeout>
                  <ums-auth-receive-timeout       merge="replace">360000</ums-auth-receive-timeout>
                  <ums-auth-connection-pool-size  merge="replace">20</ums-auth-connection-pool-size>
                  <disable-cn-check>true</disable-cn-check>
                </ums-auth-options>

                <ums-teams-options>
                  <!-- UMS Teams not deployed; empty URL disables teams integration (prevents CWLLG2330E) -->
                  <ums-teams-endpoint-url merge="replace"></ums-teams-endpoint-url>
                </ums-teams-options>
              </security>
            </common>
          </properties>

        oidc-issuer-override.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Fix issuer mismatch (CWWKS1751E):
            oidc-rp.xml (image default) sets tokenEndpointUrl to the internal service URL
            (ums_urlprefix_service_sso = https://ums-svc.<ns>.svc.cluster.local:9443).
            Liberty derives the expected ID-token issuer from that base URL, giving:
              https://ums-svc.<ns>.svc.cluster.local:9443/oidc/endpoint/ums
            But UMS issues tokens with the external hostname as issuer:
              https://<baw_hostname>/oidc/endpoint/ums
            These differ, so token validation fails post-login.
            This override explicitly sets issuerIdentifier to the external URL, fixing the mismatch.
          -->
          <server>
            <openidConnectClient id="umsClient"
              issuerIdentifier="https://{{ baw_hostname }}/oidc/endpoint/ums"/>
          </server>

        logout-domain-override.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Fix logout redirect domain after setting ums_hostname to the internal service URL.
            baw_server.xml (image default) sets:
              logoutPageRedirectDomainNames="${ums_hostname}"
            Since ums_hostname is now ums-svc.<ns>.svc.cluster.local (internal, for SCIM),
            that attribute would be set to the internal hostname — blocking logout redirects
            back to the external BAW hostname.
            This override restores it to the external hostname.
          -->
          <server>
            <webAppSecurity logoutPageRedirectDomainNames="{{ baw_hostname }}" />
          </server>

        jms-server.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Embedded SIB messaging engine (wasJmsServer). REQUIRED for project/workflow
            creation: createNewProject -> ProjectDAO.postSave -> sendEvent publishes to
            the JMS bus. The image only ships the JMS *client* (jms-client.xml), which
            connects to ${jms_server_host}:${jms_server_ssl_port} (127.0.0.1:9127). With
            no server listening there, every send fails with CWSIT0127E and project
            creation aborts with CWTBG0737E ("Your request couldn't be processed").

            Two auth concerns handled here:
              1. Connection authentication (JMSAuthAlias -> jms_user/jms_password):
                 jms_user = ${admin_user} (bawadmin) — same as reference. With TDS LDAP +
                 federatedRepository (LdapRegistry realm, UID-based), bawadmin resolves
                 cleanly. The previous CWWKM3009E was specific to the old Custom LDAP
                 (full-DN user IDs causing realm mismatch). The basicRegistry here lets
                 the JMS auth layer find bawadmin with the local admin_password before
                 going to LDAP, avoiding any federation lookup for the JMS user.
              2. Authorization (messagingSecurity role workflowPS): granted to BOTH
                 jms_user (connection identity) AND admin_user (the logged-in subject
                 under which server-internal cache publishes run).
          -->
          <server>
            <featureManager>
              <feature>wasJmsServer-1.0</feature>
              <feature>wasJmsSecurity-1.0</feature>
            </featureManager>

            <basicRegistry realm="defaultWIMFileBasedRealm" id="basicRegistry" ignoreCaseForAuthentication="true">
              <user name="${admin_user}" password="${admin_password}" />
            </basicRegistry>

            <wasJmsEndpoint id="InboundJmsCommsEndpoint" host="*"
              wasJmsPort="-1"
              wasJmsSSLPort="${jms_server_ssl_port}">
              <sslOptions sslRef="defaultSSLConfig" />
              <tcpOptions soReuseAddr="true" />
            </wasJmsEndpoint>

            <messagingEngine>
              <queue id="CHEventDestination" forceReliability="ReliablePersistent" maxMessageDepth="50000"></queue>
              <queue id="DefEventDestination" forceReliability="ReliablePersistent" maxMessageDepth="50000"></queue>
              <queue id="eventQueueDestination" forceReliability="ReliablePersistent" maxMessageDepth="50000"></queue>
              <queue id="eventErrorQueueDestination" forceReliability="ReliablePersistent" maxMessageDepth="50000"></queue>
              <queue id="BPDDocMigServiceDeployQueueDestination" forceReliability="ReliablePersistent" maxMessageDepth="50000"></queue>
              <topicSpace id="PortalWebMessagingTopicSpace" forceReliability="ReliablePersistent" maintainStrictOrder="false" maxMessageDepth="50000"></topicSpace>
              <topicSpace id="TaskChangeTopicSpace" forceReliability="ReliablePersistent" maintainStrictOrder="true" maxMessageDepth="50000"></topicSpace>
              <topicSpace id="EventMgrControlTopicSpace" forceReliability="ReliablePersistent" maintainStrictOrder="true" maxMessageDepth="50000"></topicSpace>
              <topicSpace id="TWClientTopicSpace" forceReliability="ReliablePersistent" maintainStrictOrder="true" maxMessageDepth="50000"></topicSpace>
              <topicSpace id="TWServerTopicSpace" forceReliability="ReliablePersistent" maintainStrictOrder="true" maxMessageDepth="50000"></topicSpace>
              <topicSpace id="cacheTopicSpace" forceReliability="ReliablePersistent" maintainStrictOrder="true" maxMessageDepth="50000"></topicSpace>
              <topicSpace id="HealthCheckTopicSpace" forceReliability="ReliablePersistent" maintainStrictOrder="true" maxMessageDepth="50000"></topicSpace>
              <topicSpace id="caseTopicSpace" forceReliability="ReliablePersistent" maintainStrictOrder="true" maxMessageDepth="50000"></topicSpace>
              <messagingSecurity>
                <role name="workflowPS">
                  <queuePermission queueRef="DefEventDestination"><action>ALL</action></queuePermission>
                  <queuePermission queueRef="CHEventDestination"><action>ALL</action></queuePermission>
                  <queuePermission queueRef="eventQueueDestination"><action>ALL</action></queuePermission>
                  <queuePermission queueRef="eventErrorQueueDestination"><action>ALL</action></queuePermission>
                  <queuePermission queueRef="BPDDocMigServiceDeployQueueDestination"><action>ALL</action></queuePermission>
                  <topicPermission topicSpaceRef="PortalWebMessagingTopicSpace"><action>ALL</action></topicPermission>
                  <topicPermission topicSpaceRef="TaskChangeTopicSpace"><action>ALL</action></topicPermission>
                  <topicPermission topicSpaceRef="EventMgrControlTopicSpace"><action>ALL</action></topicPermission>
                  <topicPermission topicSpaceRef="TWClientTopicSpace"><action>ALL</action></topicPermission>
                  <topicPermission topicSpaceRef="TWServerTopicSpace"><action>ALL</action></topicPermission>
                  <topicPermission topicSpaceRef="cacheTopicSpace"><action>ALL</action></topicPermission>
                  <topicPermission topicSpaceRef="HealthCheckTopicSpace"><action>ALL</action></topicPermission>
                  <topicPermission topicSpaceRef="caseTopicSpace"><action>ALL</action></topicPermission>
                  <user name="${admin_user}" />
                </role>
              </messagingSecurity>
            </messagingEngine>
          </server>

        # Shared LTPA keys — identical to CPE and ICN.
        # Required for LTPA SSO: when a user logs into ICN, the browser's LtpaToken2
        # cookie (realm defaultldap1Realm) is sent to BAStudio for the STP pre-check.
        # BAStudio must validate it with the same keys or it redirects to UMS → STP fails.
        ibm_custom-ltpa.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <ltpa
              keysFileName="${server.config.dir}/resources/security/custom-ltpa.keys"
              keysPassword="${ssl_keystore_password}"
              realm="defaultldap1Realm"
              expiration="120m" />
          </server>

        custom-ltpa.keys: |
          #Wed Jun 25 05:42:33 CEST 2025
          com.ibm.websphere.CreationDate=Wed Jun 25 05\:42\:33 CEST 2025
          com.ibm.websphere.CreationHost=localhost
          com.ibm.websphere.ltpa.3DESKey=Bms6ULbxVu+GeUlHua3GyZNYnh9iehiVfAwEtKnDBFw\=
          com.ibm.websphere.ltpa.\=
          com.ibm.websphere.ltpa.PublicKey=AMJpYeSavFgbpBBv8QfC9Xe9mxYmivrLbQZJ6mtSipYjIVVxDl20cZOQFZBSFAuG4rEsqFZ5vqVPxqLMXTa3tSLBAPbVWTRqM33kXjLrWL3iiCeYmhp4WS8+/rTtPbQ0Lt6JGjZKkpws1M16fK1zQ27YSUmGyjISTmg5yzQ2PBzjAQAB
          com.ibm.websphere.ltpa.Realm=defaultldap1Realm
          com.ibm.websphere.ltpa.version=1.0

        # ── CaseBuilder / FileNet support files ───────────────────────────────
        # Ref: baw-microshift-rhel/install/bas/bastudio-configmap.yaml

        oidc-rp.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Override the image-default oidc-rp.xml to add authFilter exclusions for
            CaseBuilder and CaseManager paths. Without these exclusions OIDC intercepts
            /bas/CaseBuilder requests, replacing the Subject with an OIDC-only token.
            The FileNet WSI client then finds no UsernamePassword/LTPA credentials in
            the Subject and throws FNRCE0019 → "Something went wrong" on CaseBuilder load.
            Exclusion forces Basic+LTPA auth for these paths so CPE WSI calls succeed.
          -->
          <server>
            <featureManager>
              <feature>openidConnectClient-1.0</feature>
            </featureManager>
            <oidcClientWebapp contextPath="/bas/oidcclient"/>
            <openidConnectClient id="umsClient"
              isClientSideRedirectSupported="false"
              accessTokenInLtpaCookie="true"
              mapIdentityToRegistryUser="true"
              redirectToRPHostAndPort="https://{{ baw_hostname }}"
              authorizationEndpointUrl="https://{{ baw_hostname }}/oidc/endpoint/ums/authorize"
              clientId="${client_id}" clientSecret="${client_secret}"
              tokenEndpointUrl="https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/oidc/endpoint/ums/token"
              signatureAlgorithm="RS256"
              jwkEndpointUrl="https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/oidc/endpoint/ums/jwk"
              validationEndpointUrl="https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/oidc/endpoint/ums/introspect"
              issuerIdentifier="https://{{ baw_hostname }}/oidc/endpoint/ums"
              inboundPropagation="supported"
              audiences="ALL_AUTHENTICATED_USERS"
              tokenReuse="true"
              scope="openid profile email">
              <authFilter id="basicAuthFilter">
                <requestHeader id="basicAuth" name="Authorization" value="Basic" matchType="notcontain"/>
                <requestUrl id="excludeCaseBuilder"  urlPattern="/bas/CaseBuilder"  matchType="notContain"/>
                <requestUrl id="excludeCaseManager"  urlPattern="/bas/CaseManager"  matchType="notContain"/>
                <requestUrl id="excludeCaseRest"     urlPattern="/CASEREST"         matchType="notContain"/>
                <requestUrl id="excludeP8jaxrs"      urlPattern="/p8/CE/3.0"        matchType="notContain"/>
              </authFilter>
            </openidConnectClient>
          </server>

        case-libs.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Adds FileNet JARs (Jace, pe, pe3pt, peResources) to Liberty classloaders
            used by CaseBuilder, CaseManager and CaseDocs servlets.
            Without these: NoClassDefFoundError: filenet.vw.api.VWException on load.
          -->
          <server>
            <library id="TeamworksLib">
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/Lombardi/lib" includes="commons-logging.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="Jace.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="pe.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="pe3pt.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="peResources.jar"/>
            </library>
            <library id="FileNetCaseLib">
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/Lombardi/lib" includes="commons-logging.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="Jace.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="pe.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="pe3pt.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="peResources.jar"/>
            </library>
            <library id="FileNetCaseTeamworksLib">
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/Lombardi/lib" includes="commons-logging.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="Jace.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="pe.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="pe3pt.jar"/>
              <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/BPM/FileNet/lib" includes="peResources.jar"/>
            </library>
          </server>

        filenet-jaaslogin.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Restores the full JAAS login chain for FileNet CPE WSI authentication.
            CaseBuilder makes server-side calls to CPE; without this the WSI client
            cannot build a Subject containing FileNet credentials.
          -->
          <server>
            <jaasLoginModule id="wsiLoginModule"
              className="com.filenet.api.util.WSILoginModule"
              controlFlag="REQUIRED"
              libraryRef="FileNetCaseTeamworksLib">
            </jaasLoginModule>
            <jaasLoginContextEntry id="FileNetP8WSI" name="FileNetP8WSI"
              loginModuleRef="wsiLoginModule, hashtable, userNameAndPassword, certificate, token"/>
          </server>

        cpe-auth.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Defines FileNetAdminAlias used by CaseBuilder/CaseManager to authenticate
            against CPE on behalf of the server (not the logged-in user).
            CPE_USERNAME and CPE_PASSWORD Liberty variables are set in processServer_variables.xml.
          -->
          <server>
            <authData id="FileNetAdminAlias" user="${CPE_USERNAME}" password="${CPE_PASSWORD}"/>
          </server>

        jvm-overrides.options: |
          -DFileNet.WSI.AutoDetectLTPAToken=true
          -Dcom.filenet.authentication.wsi.AutoDetectAuthToken=true
          -Dcom.filenet.authentication.wsi.AuthTokenOrder=ltpa,oauth,oidc
          -Dcom.filenet.authentication.token.userid=sso:ltpa

        # LDAP registry aligned to CPE/ICN (TDS type + federatedRepository = realm "LdapRegistry").
        # Using the same type ensures LTPA tokens from BAStudio form login carry
        # user:LdapRegistry/bawadmin, which CPE accepts for CaseBuilder WSI calls.
        # Ref: baw-microshift-rhel/install/bas/bastudio-configmap.yaml ibm_ldap_custom_default1.xml
        ibm_ldap_custom_default1.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <ldapRegistry id="defaultldap1"
              host="{{ ldap_host }}"
              baseDN="{{ ldap_base_dn }}"
              port="{{ ldap_port }}"
              ldapType="IBM Tivoli Directory Server"
              bindDN="{{ ldap_bind_dn }}"
              sslEnabled="false"
              bindPassword="${env.LDAP_BIND_PASSWORD}">
              <idsFilters
                userFilter="(&amp;(uid=%v)(objectclass=person))"
                groupFilter="(&amp;(cn=%v)(|(objectclass=groupofnames)(objectclass=groupofuniquenames)(objectclass=groupofurls)))"
                userIdMap="*:uid"
                groupIdMap="*:cn"
                groupMemberIdMap="groupofnames:member"/>
            </ldapRegistry>
          </server>

        ibm_ldap_federated.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <federatedRepository>
              <primaryRealm name="LdapRegistry" allowOpIfRepoDown="true">
                <participatingBaseEntry name="{{ ldap_base_dn }}"/>
              </primaryRealm>
            </federatedRepository>
          </server>

- name: Create BAStudio fix-java-security ConfigMap (startup hook)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: bastudio-startup-scripts
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-bastudio
      data:
        00-fix-java-security.sh: |
          #!/bin/bash
          # Fix IBM Semeru 21 java.security for BAW container.
          #
          # Problem: The image's java.security lists IBM-proprietary providers
          # (IBMJCE, IBMJSSEProvider2 etc.) that do NOT exist in IBM Semeru
          # Certified Edition (OpenJDK-based). Provider 10 (sun.security.provider.Sun)
          # is restricted to FIPS/RestrictedSecurity mode with the '#' suffix.
          # baw-setup.sh tries to fix this via security_provider_disable_IBMJCEFIPS,
          # but that file lacks a trailing newline, so the last line merges with the
          # next '#' comment in java.security and Sun ends up restricted again.
          #
          # Fix: replace the entire provider list with standard OpenJDK providers.
          # This runs in the liberty-start.sh pre-start hook (shared/scripts/*.sh),
          # AFTER baw-setup.sh and BEFORE the Liberty JVM reads java.security.

          SEC=/opt/ibm/java/conf/security/java.security

          # Write the correct provider list to a temp file (heredoc guarantees
          # a proper trailing newline — no merge issue).
          cat > /tmp/jdk_providers.txt << 'PROVIDERS'
          security.provider.1=sun.security.provider.Sun
          security.provider.2=sun.security.rsa.SunRsaSign
          security.provider.3=sun.security.ec.SunEC
          security.provider.4=sun.security.ssl.SunJSSE
          security.provider.5=com.sun.crypto.provider.SunJCE
          security.provider.6=sun.security.jgss.SunProvider
          security.provider.7=com.sun.security.sasl.Provider
          security.provider.8=org.jcp.xml.dsig.internal.dom.XMLDSigRI
          PROVIDERS

          # Remove all existing security.provider.N= lines (any digit count).
          sed -i '/^security\.provider\.[0-9]/d' "$SEC"

          # Insert the new provider list after the canonical comment anchor.
          sed -i "/# List of providers and their preference orders (see above):/r /tmp/jdk_providers.txt" "$SEC"

          echo "00-fix-java-security: java.security providers replaced with standard JDK providers"

        01-activate-postgresql-ds.sh: |
          #!/bin/bash
          # Activate the PostgreSQL Liberty datasource in configDropins/defaults/ when
          # DB_TYPE=POSTGRESQL.
          #
          # WHY: LibertyConfigurationOfflineSpi.getDatabaseInfo() reads db_type from Liberty
          # variables (processServer_variables.xml) and resolves the JDBC driver classpath
          # from configDropins/defaults/datasource.xml via ConfigUtil.getConfigFilePath().
          # The default datasource.xml ships pointing to DB2JCC4Lib. When db_type=PostgreSQL
          # the code expects the PostgreSQL driver (org.postgresql.Driver) to be in
          # postgresqlJDBCLib — but the DB2 JAR doesn't contain it → ConfigException.
          #
          # The image ships datasource.xml.PostgreSQL alongside datasource.xml in
          # configDropins/defaults/. We simply activate it here, exactly as database.sh
          # activates 60Database.xml.PostgreSQL for the SQL-statements file.
          #
          # NOTE: Do NOT additionally mount datasource.xml in configDropins/overrides/.
          # Liberty merges defaults+overrides for the same datasource id, producing two
          # <properties> child elements (max 1 allowed) → CWWKG0074E.

          DEFAULTS="/opt/ibm/wlp/usr/servers/defaultServer/configDropins/defaults"

          if [[ "${DB_TYPE^^}" == "POSTGRESQL" ]]; then
              cp "${DEFAULTS}/datasource.xml.PostgreSQL" "${DEFAULTS}/datasource.xml"
              echo "01-activate-postgresql-ds: datasource.xml.PostgreSQL activated as datasource.xml"
          fi

        02-download-postgresql-driver.sh: |
          #!/bin/bash
          # Download the PostgreSQL JDBC driver JAR at container startup.
          #
          # WHY: workflow-authoring:25.0.1 does NOT ship a PostgreSQL JDBC driver.
          # Only DB2/db2jcc4.jar exists under ibmProcessServer/lib/jdbcdrivers/.
          # ValidateDatabaseInitialized (OSGi bundle com.ibm.workflow.ps.config.impl)
          # is called during Liberty startup. Its Activator.start() calls
          # LibertyConfigurationOfflineSpi.getDatabaseInfo() which:
          #   1. Reads db_type from Liberty variables (processServer_variables.xml)
          #   2. Reads the datasource.xml server/library/fileset XPath to build the
          #      JDBC driver classpath
          #   3. Uses URLClassLoader + Class.forName("org.postgresql.Driver") to
          #      load the driver
          # Without the JAR at the path referenced in datasource.xml it throws:
          #   ConfigException: org.postgresql.Driver
          #   Caused by: ClassNotFoundException: org.postgresql.Driver
          #
          # datasource.xml.PostgreSQL (image-provided, activated by 01-activate-postgresql-ds.sh)
          # references: ${wlp.install.dir}/ibmProcessServer/lib/jdbcdrivers/PostgreSQL/postgresql.jar
          # An emptyDir volume is mounted at that path in the pod spec, making it writable.

          DRIVER_DIR="/opt/ibm/wlp/ibmProcessServer/lib/jdbcdrivers/PostgreSQL"
          DRIVER_JAR="${DRIVER_DIR}/postgresql.jar"
          JDBC_URL="https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar"

          if [[ -f "${DRIVER_JAR}" ]]; then
              echo "02-download-postgresql-driver: JAR already present at ${DRIVER_JAR} — skipping"
              exit 0
          fi

          echo "02-download-postgresql-driver: Downloading PostgreSQL JDBC driver from Maven Central..."
          curl -sSf --connect-timeout 30 --retry 3 --retry-delay 5 \
               -o "${DRIVER_JAR}" "${JDBC_URL}"
          RC=$?
          if [[ $RC -ne 0 ]]; then
              echo "02-download-postgresql-driver: ERROR — curl failed (exit ${RC}). Check cluster internet access."
              exit $RC
          fi
          echo "02-download-postgresql-driver: Driver saved → $(ls -lh ${DRIVER_JAR})"

# ── Storage ───────────────────────────────────────────────────────────────────

- name: Create BAStudio data PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: bastudio-pvc
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-bastudio
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 20Gi
        storageClassName: "{{ storage_class_name }}"

- name: Create BAStudio logs PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: bastudio-logs-pvc
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-bastudio
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 5Gi
        storageClassName: "{{ storage_class_name }}"

# ── DB init Job ───────────────────────────────────────────────────────────────
# Runs dbConfig init defaultServer to initialise the BAW PostgreSQL schema.
#
# Root cause analysis (verified by introspection):
#   1. LibertyConfigurationOfflineSpi cannot expand ${env.X} references at runtime.
#   2. The image ships overrides/datasource.xml (DB2) which beats defaults/datasource.xml
#      (PostgreSQL) alphabetically; must be removed before dbConfig runs.
#   3. processServer_variables_system.xml in overrides/ has @placeholder@ values for ALL
#      DB variables; it sorts AFTER our ConfigMap file so it overwrites db_user/db_pass/etc.
#      with @placeholder@, causing NullPointerException in DatabaseInfo.getUser().
#   4. Solution: write z-db-init-credentials.xml (z-prefix sorts last) with literal
#      bash-expanded values AND redefine postgresqlJDBCLib with an absolute path so
#      the offline SPI doesn't need to expand ${wlp.install.dir}.
#
# Steps performed:
#   1. Activate PostgreSQL datasource in configDropins/defaults/
#   1b. Remove the image's DB2 overrides/datasource.xml
#   2. Download PostgreSQL JDBC driver into emptyDir at jdbcdrivers/PostgreSQL/
#   3. Write overrides/z-db-init-credentials.xml with literal DB credentials + absolute library path
#   4. Run dbConfig init defaultServer

- name: Delete previous db-init Job (if any)
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: bastudio-db-init
        namespace: "{{ baw_namespace }}"
  ignore_errors: true

- name: Run BAStudio DB init Job (dbConfig init defaultServer)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: bastudio-db-init
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-bastudio
      spec:
        backoffLimit: 2
        template:
          metadata:
            labels:
              app: baw-bastudio-job
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            restartPolicy: Never
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000
            containers:
              - name: bastudio-db-init
                image: "{{ bastudio_image }}"
                imagePullPolicy: IfNotPresent
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -e

                    OVERRIDES=/opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides
                    DEFAULTS=/opt/ibm/wlp/usr/servers/defaultServer/configDropins/defaults
                    SYS=/opt/ibm/wlp/usr/servers/defaultServer/config/system
                    SYSMT=/opt/ibm/wlp/usr/servers/defaultServer/config/system_multiTenant
                    DRIVER_DIR=/opt/ibm/wlp/ibmProcessServer/lib/jdbcdrivers/PostgreSQL

                    # ── Step 0: activate PostgreSQL 60Database.xml (CRITICAL for bootstrap) ──
                    # 60Database.xml holds the database-dialect SQL templates, including the
                    # <lock-acquire> query used by DBLockHelper to grab IMPORT_LOCK_TWX_KEY
                    # during the system-toolkit import in bootstrapProcessServer.
                    # The image default is the DB2 variant: "...FOR UPDATE WITH RS", which
                    # PostgreSQL rejects (syntax error at/near "WITH") — so the toolkit import
                    # fails, leaving system toolkit projects with NO snapshot content. The UI
                    # then fails to create a workflow with "Snapshot ... not found" / CWTBG0737E.
                    # The image's database.sh does this copy at pod startup (for the live
                    # server), but the DB-init Job never runs database.sh, so we must do it
                    # here too. The PostgreSQL variant uses plain "FOR UPDATE" (no WITH RS).
                    echo "==> Step 0: activate PostgreSQL 60Database.xml..."
                    cp "${SYS}/60Database.xml.PostgreSQL" "${SYS}/60Database.xml"
                    if [ -f "${SYSMT}/60Database.xml.PostgreSQL" ]; then
                        cp "${SYSMT}/60Database.xml.PostgreSQL" "${SYSMT}/60Database.xml"
                    fi
                    if grep -q "FOR UPDATE WITH RS" "${SYS}/60Database.xml"; then
                        echo "    ERROR: 60Database.xml still contains DB2 'FOR UPDATE WITH RS'"; exit 1
                    fi
                    echo "    60Database.xml.PostgreSQL activated (lock SQL = plain FOR UPDATE)"

                    # ── Step 1: activate PostgreSQL datasource in configDropins/defaults/ ──
                    echo "==> Step 1: activate PostgreSQL datasource in defaults/..."
                    cp "${DEFAULTS}/datasource.xml.PostgreSQL" "${DEFAULTS}/datasource.xml"
                    echo "    datasource.xml.PostgreSQL activated"

                    # ── Step 1b: remove image-default DB2 overrides/datasource.xml ──
                    # The image ships overrides/datasource.xml (DB2 config).
                    # overrides/ beats defaults/, so it would shadow the PostgreSQL datasource.
                    # Removing it lets defaults/datasource.xml (PostgreSQL) take effect.
                    echo "==> Step 1b: remove image-default DB2 overrides/datasource.xml..."
                    if [ -f "${OVERRIDES}/datasource.xml" ]; then
                        rm -f "${OVERRIDES}/datasource.xml"
                        echo "    Removed overrides/datasource.xml (image DB2 default)"
                    else
                        echo "    overrides/datasource.xml not present — skipping"
                    fi

                    # ── Step 2: download PostgreSQL JDBC driver ──
                    echo "==> Step 2: download PostgreSQL JDBC driver..."
                    curl -sSf --connect-timeout 30 --retry 3 --retry-delay 5 \
                         -o "${DRIVER_DIR}/postgresql.jar" \
                         "https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar"
                    echo "    Driver: $(ls -lh ${DRIVER_DIR}/postgresql.jar)"

                    # ── Step 3: write z-db-init-credentials.xml ──
                    # Writes a Liberty XML override that:
                    # (a) Supplies all DB variables as LITERAL values (processServer_variables_system.xml
                    #     in overrides/ has @placeholder@ strings that beat our ConfigMap's ${env.X}
                    #     refs alphabetically — z-file sorts last and wins).
                    # (b) Redefines postgresqlJDBCLib with an absolute path so the offline SPI
                    #     (LibertyConfigurationOfflineSpi) does not need to expand ${wlp.install.dir}.
                    echo "==> Step 3: write z-db-init-credentials.xml..."
                    cat > "${OVERRIDES}/z-db-init-credentials.xml" << 'XMLEOF'
                    <?xml version="1.0" encoding="UTF-8"?>
                    <server>
                      <variable name="db_type"     value="POSTGRESQL"/>
                      <variable name="db_name"     value="DBNAME_PH"/>
                      <variable name="db_host"     value="DBHOST_PH"/>
                      <variable name="db_port"     value="DBPORT_PH"/>
                      <variable name="db_user"     value="DBUSER_PH"/>
                      <variable name="db_password" value="DBPASS_PH"/>
                      <library id="postgresqlJDBCLib">
                        <fileset dir="/opt/ibm/wlp/ibmProcessServer/lib/jdbcdrivers/PostgreSQL"
                                 includes="postgresql.jar"/>
                      </library>
                    </server>
                    XMLEOF
                    sed -i \
                      "s|DBNAME_PH|${BAS_DB_NAME}|g; \
                       s|DBHOST_PH|${BAS_DB_HOST}|g; \
                       s|DBPORT_PH|${BAS_DB_PORT}|g; \
                       s|DBUSER_PH|${BAS_DB_USER}|g; \
                       s|DBPASS_PH|${BAS_DB_PASS}|g" \
                      "${OVERRIDES}/z-db-init-credentials.xml"
                    echo "    Written (db_user=${BAS_DB_USER}, db_name=${BAS_DB_NAME}, db_host=${BAS_DB_HOST}:${BAS_DB_PORT})"

                    # ── Step 4: create BAW schema ──
                    echo "==> Step 4: dbConfig init defaultServer..."
                    /opt/ibm/wlp/ibmProcessServer/bin/dbConfig init defaultServer
                    RC=$?
                    echo "dbConfig exit code: $RC"
                    [ $RC -ne 0 ] && exit $RC

                    # ── Step 5: run bootstrapProcessServer ──
                    # Loads initial system data into the schema: admin user (lsw_usr_xref +
                    # group memberships), user attribute definitions (lsw_user_attribute_def),
                    # and — critically — imports ALL system toolkits (System Data, Content
                    # Management, Dashboards, Responsive Coaches, BPM UI) plus the Workstreams
                    # app, creating their projects/branches/snapshots. The BAStudio UI clones
                    # these when you create a workflow automation; without them, creation fails
                    # with "Snapshot ... not found" / CWTBG0737E.
                    #
                    # This now SUCCEEDS because Step 0 activated the PostgreSQL 60Database.xml
                    # (lock SQL = plain "FOR UPDATE"). With the image-default DB2 variant the
                    # toolkit import dies on "FOR UPDATE WITH RS".
                    #
                    # ADMIN_USER is set in env so bootstrap writes the real admin name into
                    # lsw_usr_xref (otherwise it inserts the literal "${env.ADMIN_USER}").
                    echo "==> Step 5: bootstrapProcessServer defaultServer (imports system toolkits)..."
                    /opt/ibm/wlp/ibmProcessServer/bin/bootstrapProcessServer defaultServer
                    echo "    bootstrapProcessServer completed (exit $?)"

                    # NOTE: Remaining DB fixups (lsw_usr profile row + IsRepository flag) run as
                    # a SEPARATE Ansible task against the PostgreSQL pod — the workflow-authoring
                    # image does NOT ship the psql client, so they cannot run here.
                    exit 0
                env:
                  - name: ADMIN_USER
                    value: "{{ ums_admin_user }}"
                  - name: BAS_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: BAS_ADMIN_PASSWORD
                  - name: BAS_DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: BAS_DB_USER
                  - name: BAS_DB_PASS
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: BAS_DB_PASS
                  - name: BAS_DB_NAME
                    value: "{{ bas_db_name }}"
                  - name: BAS_DB_HOST
                    value: "{{ postgres_host }}"
                  - name: BAS_DB_PORT
                    value: "{{ postgres_port }}"
                  - name: KEYSTORE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: KEYSTORE_PASSWORD
                  - name: BASTUDIO_OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: BASTUDIO_OIDC_CLIENT_SECRET
                  - name: LDAP_BIND_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: LDAP_BIND_PASSWORD
                  - name: LIBERTY_SERVER_NAME
                    value: "defaultServer"
                  - name: DB_TYPE
                    value: "POSTGRESQL"
                  - name: disableFIPS
                    value: "true"
                  - name: IBMJCEPLUS_FIPS_ENABLED
                    value: "false"
                  - name: TZ
                    value: "{{ timezone }}"
                volumeMounts:
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/processServer_variables.xml
                    subPath: processServer_variables.xml
                  # emptyDir at the PostgreSQL driver path — guarantees writability so curl
                  # can place postgresql.jar there regardless of image filesystem ownership.
                  - name: postgresql-jdbc-driver
                    mountPath: /opt/ibm/wlp/ibmProcessServer/lib/jdbcdrivers/PostgreSQL
            volumes:
              - name: liberty-config
                configMap:
                  name: bastudio-liberty-config
              - name: postgresql-jdbc-driver
                emptyDir: {}

- name: Wait for DB init Job to complete
  ansible.builtin.shell: >
    oc wait job/bastudio-db-init
    -n {{ baw_namespace }}
    --for=condition=complete
    --timeout={{ bastudio_job_timeout }}s
  changed_when: false

# ── Post-bootstrap DB fixups ──────────────────────────────────────────────────
# Run the two remaining SQL fixups that the db-init Job cannot do itself (the
# workflow-authoring image ships no psql client). These run via the PostgreSQL
# pod, which has psql:
#   1. lsw_usr profile row for the admin user. bootstrapProcessServer populates
#      lsw_usr_xref but not lsw_usr; the post-login getOrCreateUserInfoObject path
#      expects a matching lsw_usr row.
#   2. IsRepository=true in lsw_system. Without it ServerTypeUtil.isRepository()
#      reads null -> false -> "database is Workflow Runtime" -> the UI shows
#      "/bas/BAStudio is not valid for this server type".

- name: Find PostgreSQL pod (has psql client)
  ansible.builtin.shell: >
    oc get pod -n {{ postgres_namespace | default('infra') }}
    -l {{ postgres_pod_selector | default('app=baw-postgresql') }}
    -o jsonpath='{.items[0].metadata.name}'
  register: _pg_pod
  changed_when: false

- name: Apply post-bootstrap BAStudio DB fixups (admin lsw_usr row + IsRepository flag)
  ansible.builtin.shell: >
    oc exec -n {{ postgres_namespace | default('infra') }} {{ _pg_pod.stdout }} --
    env PGPASSWORD='{{ bas_db_pass }}'
    psql -U {{ bas_db_user }} -d {{ bas_db_name }}
    -c "INSERT INTO {{ bas_db_user }}.lsw_usr (user_id,user_name,passwd,full_name,is_disabled)
        VALUES (1,'cn={{ ums_admin_user }},{{ ldap_user_base }}','n/a','{{ ums_admin_user }}','F')
        ON CONFLICT (user_id) DO UPDATE SET user_name='cn={{ ums_admin_user }},{{ ldap_user_base }}', full_name='{{ ums_admin_user }}';"
    -c "INSERT INTO {{ bas_db_user }}.lsw_system (propkey,propvalue) VALUES ('IsRepository','true')
        ON CONFLICT (propkey) DO UPDATE SET propvalue='true';"
  register: _bas_db_fixups
  changed_when: _bas_db_fixups.rc == 0
  ignore_errors: true
  no_log: true

# ── BAStudio Deployment ───────────────────────────────────────────────────────

- name: Deploy BAStudio
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: bastudio
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-bastudio
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: baw-bastudio
        template:
          metadata:
            labels:
              app: baw-bastudio
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000
            containers:
              - name: bastudio
                image: "{{ bastudio_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 9080
                    name: http
                  - containerPort: 9443
                    name: https
                env:
                  - name: BAS_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: BAS_ADMIN_PASSWORD
                  - name: BAS_DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: BAS_DB_USER
                  - name: BAS_DB_PASS
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: BAS_DB_PASS
                  - name: LDAP_BIND_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: LDAP_BIND_PASSWORD
                  - name: KEYSTORE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: KEYSTORE_PASSWORD
                  - name: BASTUDIO_OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: BASTUDIO_OIDC_CLIENT_SECRET
                  - name: LIBERTY_SERVER_NAME
                    value: "defaultServer"
                  - name: DB_TYPE
                    value: "POSTGRESQL"
                  - name: disableFIPS
                    value: "true"
                  - name: IBMJCEPLUS_FIPS_ENABLED
                    value: "false"
                  - name: TZ
                    value: "{{ timezone }}"
                  - name: JVM_HEAP_XMS
                    value: "1024m"
                  - name: JVM_HEAP_XMX
                    value: "2048m"
                  - name: CPE_URL
                    value: "https://cpe-svc.{{ baw_namespace }}.svc.cluster.local:9443/wsi/FNCEWS40MTOM"
                  - name: CMIS_URL
                    value: "https://cpe-svc.{{ baw_namespace }}.svc.cluster.local:9443/cmis/openfncmis_wlp/services"
                  - name: GRAPHQL_ENDPOINT
                    value: "https://graphql-svc.{{ baw_namespace }}.svc.cluster.local:9443/content-services-graphql/graphql"
                  - name: is_internal_baw
                    value: "true"
                  - name: CAPABILITIES
                    value: "workflow,content-integration,case"
                  - name: CPE_DOMAIN_NAME
                    value: "{{ cpe_domain_name }}"
                  - name: DOS_OBJECTSTORE_NAME
                    value: "DOS"
                  - name: TOS_OBJECTSTORE_NAME
                    value: "TOS"
                  - name: DEFAULT_TOS_OBJECTSTORE_NAME
                    value: "TOS"
                  - name: disableCaseEventEmitter
                    value: "true"
                  - name: enableContainerCHEmitter
                    value: "false"
                  - name: CPE_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: bastudio-secret
                        key: CPE_ADMIN_PASSWORD
                  # BAW_CONTEXT_ROOT_PREFIX is read by BPMContextRootConfigService to build
                  # the endpoint URLs injected into index.jsp at login time. Without it the
                  # service returns paths without the /bas prefix (e.g. /rest/bpm/wle instead
                  # of /bas/rest/bpm/wle). The browser JS then calls the wrong OCP route paths
                  # which have no route → 404 → "The current user didn't load properly."
                  # Note: baw_context_root_prefix (Liberty variable) controls Liberty context
                  # root deployment; BAW_CONTEXT_ROOT_PREFIX (env var) controls URL generation.
                  - name: BAW_CONTEXT_ROOT_PREFIX
                    value: "/bas"
                resources:
                  requests:
                    memory: 2Gi
                    cpu: 500m
                  limits:
                    memory: 4Gi
                    cpu: "2"
                # mpHealth-1.0 serves at /health directly on the pod (not via route).
                # Kubernetes probes bypass the OpenShift router, so the /bas route
                # prefix does NOT apply here.
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 9080
                    scheme: HTTP
                  initialDelaySeconds: 180
                  periodSeconds: 30
                  failureThreshold: 10
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 9080
                    scheme: HTTP
                  initialDelaySeconds: 120
                  periodSeconds: 15
                  failureThreshold: 20
                startupProbe:
                  httpGet:
                    path: /health
                    port: 9080
                    scheme: HTTP
                  periodSeconds: 15
                  failureThreshold: 80
                volumeMounts:
                  - name: data
                    mountPath: /opt/ibm/bas/data
                  - name: logs
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/logs
                  - name: overrides-dir
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/processServer_variables.xml
                    subPath: processServer_variables.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ssl.xml
                    subPath: ssl.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/transport.xml
                    subPath: transport.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_ldap_custom_default1.xml
                    subPath: ibm_ldap_custom_default1.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_ldap_federated.xml
                    subPath: ibm_ldap_federated.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/oidc-issuer-override.xml
                    subPath: oidc-issuer-override.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/logout-domain-override.xml
                    subPath: logout-domain-override.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ums-jaaslogin.xml
                    subPath: ums-jaaslogin.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/config/111Custom.xml
                    subPath: 111Custom.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/jms-server.xml
                    subPath: jms-server.xml
                  # Shared LTPA keys — enables SSO with ICN/CPE (same realm=defaultldap1Realm)
                  # so browser LtpaToken2 cookie from ICN is accepted by BAStudio → STP works
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_custom-ltpa.xml
                    subPath: ibm_custom-ltpa.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/resources/security/custom-ltpa.keys
                    subPath: custom-ltpa.keys
                  # ── CaseBuilder / FileNet config files ──────────────────────
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/oidc-rp.xml
                    subPath: oidc-rp.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/case-libs.xml
                    subPath: case-libs.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/filenet-jaaslogin.xml
                    subPath: filenet-jaaslogin.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/cpe-auth.xml
                    subPath: cpe-auth.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/jvm.options
                    subPath: jvm-overrides.options
                  - name: tls
                    mountPath: /shared/tls/pkcs12
                  - name: startup-scripts
                    mountPath: /shared/scripts/00-fix-java-security.sh
                    subPath: 00-fix-java-security.sh
                  - name: startup-scripts
                    mountPath: /shared/scripts/01-activate-postgresql-ds.sh
                    subPath: 01-activate-postgresql-ds.sh
                  - name: startup-scripts
                    mountPath: /shared/scripts/02-download-postgresql-driver.sh
                    subPath: 02-download-postgresql-driver.sh
                  # emptyDir at the PostgreSQL driver path — writable for the download script
                  # regardless of image filesystem ownership; also shadows the (absent) image
                  # directory so 01-activate-postgresql-ds.sh doesn't fail if it doesn't exist.
                  - name: postgresql-jdbc-driver
                    mountPath: /opt/ibm/wlp/ibmProcessServer/lib/jdbcdrivers/PostgreSQL
                  # case-init PVC: case-init job writes cbConfig.properties here;
                  # CaseBuilder reads it at startup to find CPE/object store config.
                  - name: case-init-shared
                    mountPath: /opt/ibm/icm/shared
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: bastudio-pvc
              - name: logs
                persistentVolumeClaim:
                  claimName: bastudio-logs-pvc
              - name: overrides-dir
                emptyDir: {}
              - name: liberty-config
                configMap:
                  name: bastudio-liberty-config
              - name: tls
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: server.p12
                      path: server.p12
                    - key: trusts.p12
                      path: trusts.p12
              - name: startup-scripts
                configMap:
                  name: bastudio-startup-scripts
                  defaultMode: 0755
              - name: case-init-shared
                persistentVolumeClaim:
                  claimName: bastudio-case-init
              - name: postgresql-jdbc-driver
                emptyDir: {}

- name: Create BAStudio Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: bastudio-svc
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-bastudio
      spec:
        selector:
          app: baw-bastudio
        ports:
          - port: 9080
            targetPort: 9080
            name: http
          - port: 9443
            targetPort: 9443
            name: https

- name: Wait for BAStudio deployment to be ready
  ansible.builtin.shell: >
    oc rollout status deployment/bastudio
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false

- name: Check if content-init Job already completed
  ansible.builtin.shell: >
    oc get job job-baw-content-init -n {{ baw_namespace }}
    -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}'
    2>/dev/null || echo ""
  register: _content_init_done
  changed_when: false
  failed_when: false

- name: Create content-init PersistentVolumeClaim
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: job-baw-content-init-pvc
        namespace: "{{ baw_namespace }}"
      spec:
        accessModes:
          - ReadWriteMany
        storageClassName: "{{ storage_class_name }}"
        resources:
          requests:
            storage: 2Gi

- name: Create BAStudio content-init Job
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: job-baw-content-init
        namespace: "{{ baw_namespace }}"
        labels:
          name: job-baw-content-init
      spec:
        completions: 1
        parallelism: 1
        backoffLimit: 30
        manualSelector: false
        suspend: false
        podReplacementPolicy: TerminatingOrFailed
        completionMode: NonIndexed
        template:
          metadata:
            labels:
              name: job-baw-content-init
          spec:
            restartPolicy: OnFailure
            serviceAccount: default
            serviceAccountName: default
            terminationGracePeriodSeconds: 30
            automountServiceAccountToken: false
            dnsPolicy: ClusterFirst
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: contentintegration-init-job
                image: "cp.icr.io/cp/cp4a/baw/iaws-ps-content-integration:25.0.1"
                imagePullPolicy: IfNotPresent
                securityContext:
                  capabilities:
                    drop:
                      - ALL
                  privileged: false
                  runAsNonRoot: true
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                command:
                  - sh
                  - '-c'
                args:
                  - /home/config/config-script.sh
                terminationMessagePath: /dev/termination-log
                terminationMessagePolicy: File
                env:
                  - name: CREDENTIAL_FOLDER
                    value: /credentials/
                  - name: CPE_URL
                    value: "https://cpe-svc.{{ baw_namespace }}.svc.cluster.local:9443/wsi/FNCEWS40MTOM"
                  - name: IS_SECURE
                    value: T
                  - name: DOMAIN_NAME
                    value: P8Domain
                  - name: OBJECTSTORE_NAME
                    value: DOS
                  - name: EVENTHANDLER_PATH
                    value: /home/config/docs-config
                  - name: BPMCALLBACK_URL
                    value: "https://bastudio-svc.{{ baw_namespace }}.svc.cluster.local:9443/bas/rest/bpm/wle"
                  - name: Enable_EventHandler
                    value: "true"
                resources:
                  limits:
                    cpu: "1"
                    ephemeral-storage: 2Gi
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    ephemeral-storage: 1Gi
                    memory: 128Mi
                volumeMounts:
                  - name: temp-folder
                    mountPath: /tmp
                  - name: temp-folder
                    mountPath: /home/config/certs
                  - name: credentials-env
                    mountPath: /credentials
                  - name: ca-tls-volume
                    mountPath: /shared/resources/cert-trusted
                  - name: log-pvc
                    mountPath: /logs/application
            volumes:
              - name: temp-folder
                emptyDir: {}
              - name: ca-tls-volume
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: ca.crt
                      path: ca.crt
              - name: log-pvc
                persistentVolumeClaim:
                  claimName: job-baw-content-init-pvc
              - name: credentials-env
                secret:
                  secretName: cpe-secret
                  defaultMode: 420
                  items:
                    - key: CPE_ADMIN_USER
                      path: CPE_USERNAME
                    - key: CPE_ADMIN_PASSWORD
                      path: CPE_PASSWORD
            imagePullSecrets:
              - name: ibm-entitlement-key
  when: _content_init_done.stdout != 'True'

- name: Wait for content-init job to complete
  ansible.builtin.shell: >
    kubectl wait --for=condition=complete job/job-baw-content-init
    -n {{ baw_namespace }} --timeout={{ bastudio_job_timeout }}s
  changed_when: false
  when: _content_init_done.stdout != 'True'

- name: Check if case-init Job already completed
  ansible.builtin.shell: >
    oc get job job-bastudio-case-init -n {{ baw_namespace }}
    -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}'
    2>/dev/null || echo ""
  register: _case_init_done
  changed_when: false
  failed_when: false

- name: Delete case-init Job if not completed (allows spec update on retry)
  ansible.builtin.shell: >
    oc delete job job-bastudio-case-init -n {{ baw_namespace }} --ignore-not-found
  changed_when: false
  when: _case_init_done.stdout | trim != 'True'

- name: Create case-init PersistentVolumeClaim
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: bastudio-case-init
        namespace: "{{ baw_namespace }}"
      spec:
        accessModes:
          - ReadWriteMany
        storageClassName: "{{ storage_class_name }}"
        resources:
          requests:
            storage: 5Gi

- name: Create BAStudio case-init Job
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: job-bastudio-case-init
        namespace: "{{ baw_namespace }}"
        labels:
          app: job-bastudio-case-init
      spec:
        backoffLimit: 30
        completions: 1
        parallelism: 1
        template:
          metadata:
            labels:
              app: job-bastudio-case-init
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            restartPolicy: OnFailure
            terminationGracePeriodSeconds: 30
            serviceAccountName: default
            containers:
              - name: bastudio-case-init-job
                image: 'cp.icr.io/cp/cp4a/baw/workflow-server-case-initialization:25.0.1'
                imagePullPolicy: IfNotPresent
                terminationMessagePolicy: File
                terminationMessagePath: /dev/termination-log
                securityContext:
                  capabilities:
                    drop:
                      - ALL
                  privileged: false
                  runAsNonRoot: true
                  readOnlyRootFilesystem: false
                  allowPrivilegeEscalation: false
                command:
                  - sh
                  - '-c'
                args:
                  - if [ -f /temp/jms-client.xml ]; then cp /temp/jms-client.xml /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/jms-client.xml; else echo "jms-client.xml not provided; continuing without it"; fi; /opt/ibm/icm/case-init-script.sh
                env:
                  - name: CREDENTIAL_FOLDER
                    value: /credentials/
                  - name: CPE_URL
                    value: 'https://cpe-svc.{{ baw_namespace }}.svc.cluster.local:9443/wsi/FNCEWS40MTOM'
                  - name: CPE_STATEFUL_URL
                    value: 'https://cpe-svc.{{ baw_namespace }}.svc.cluster.local:9443/wsi/FNCEWS40MTOM'
                  - name: CPE_GATEWAY_URL
                    value: 'https://cpe-svc.{{ baw_namespace }}.svc.cluster.local:9443/WSCPEService/WSCPEServiceSoapService'
                  - name: DOS_OBJECTSTORE_NAME
                    value: DOS
                  - name: TOS_OBJECTSTORE_NAME
                    value: "TOS"
                  - name: DEFAULT_TOS_OBJECTSTORE_NAME
                    value: "TOS"
                  - name: CONN_POINT_NAME
                    value: "tos-cp"
                  - name: NAV_DESKTOP_ID
                    value: "{{ baw_subdomain }}"
                  - name: DOMAIN_NAME
                    value: P8Domain
                  - name: DISABLE_BASIC_AUTH
                    value: 'False'
                  - name: NAVIGATOR_URL
                    value: 'https://icn-svc.{{ baw_namespace }}.svc.cluster.local:9443/navigator'
                  - name: CASEMANAGER_URL
                    value: 'https://bastudio-svc.{{ baw_namespace }}.svc.cluster.local:9443/bas/CaseManager'
                  - name: BAW_HOSTNAME
                    value: "{{ baw_hostname }}"
                  - name: BAW_PORT
                    value: "443"
                  - name: BAW_SERVICE_NAME
                    value: bastudio-svc.{{ baw_namespace }}.svc.cluster.local
                  - name: BAW_SERVICE_PORT
                    value: '9443'
                  - name: ICN_HOSTNAME
                    value: icn-svc.{{ baw_namespace }}.svc.cluster.local
                  - name: ICN_PORT
                    value: "443"
                  - name: SSL_CA_CERT_PATH
                    value: /shared/resources/cert-trusted/ca.crt
                  - name: IS_SECURE
                    value: T
                  - name: TARGET_ENV_NAME
                    value: dev_env_connection_definition
                  - name: ENV_TYPE
                    value: DEV
                  - name: ADD_OS_ADMINS_IN_DEFAULT_PA
                    value: 'true'
                  - name: JMSTopicConnectionFactoryName
                    value: tw.jms.caseMessageConnectionFactory
                  - name: JMSTopicName
                    value: caseTopic
                  - name: INDEX_NUMBER_OF_SHARDS
                    value: '3'
                  - name: INDEX_NUMBER_OF_REPLICAS
                    value: '1'
                  - name: enableContainerCHEmitter
                    value: 'false'
                  - name: CASE_HISTORY_STORE_SCHEMA_NAME
                    value: CHSCHEMA
                  - name: CASE_HISTORY_STORE_CPE_DATASOURCE_NAME
                    value: FNTOSDS
                  - name: CASE_HISTORY_STORE_CPE_XA_DATASOURCE_NAME
                    value: FNTOSDSXA
                  - name: BAW_CONTEXT_ROOT_PREFIX
                    value: /bas
                resources:
                  limits:
                    cpu: '1'
                    ephemeral-storage: 2Gi
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    ephemeral-storage: 1Gi
                    memory: 128Mi
                volumeMounts:
                  - name: com-folder
                    mountPath: /com
                  - name: case-init-volume
                    mountPath: /opt/ibm/icm/shared
                  - name: icn-config-overrides
                    mountPath: /opt/ibm/icm/shared/configDropins/overrides
                    subPath: shared/configDropins/overrides
                  - name: icn-config-overrides
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides
                    subPath: defaultServer/configDropins/overrides
                  - name: icn-config-overrides
                    mountPath: /logs/application
                    subPath: logs/application
                  - name: ca-tls-volume
                    mountPath: /shared/resources/cert-trusted
                  - name: credentials-env
                    mountPath: /credentials
            volumes:
              - name: com-folder
                emptyDir: {}
              - name: case-init-volume
                persistentVolumeClaim:
                  claimName: bastudio-case-init
              - name: icn-config-overrides
                persistentVolumeClaim:
                  claimName: bastudio-pvc
              - name: credentials-env
                secret:
                  secretName: cpe-secret
                  defaultMode: 420
                  items:
                    - key: CPE_ADMIN_USER
                      path: CPE_USERNAME
                    - key: CPE_ADMIN_PASSWORD
                      path: CPE_PASSWORD
                    - key: CPE_ADMIN_USER
                      path: NAVIGATOR_USERNAME
                    - key: CPE_ADMIN_PASSWORD
                      path: NAVIGATOR_PASSWORD
              - name: ca-tls-volume
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: ca.crt
                      path: ca.crt
  when: _case_init_done.stdout != 'True'

- name: Wait for case-init job to complete
  ansible.builtin.shell: >
    kubectl wait --for=condition=complete job/job-bastudio-case-init
    -n {{ baw_namespace }} --timeout={{ bastudio_job_timeout }}s
  changed_when: false
  when: _case_init_done.stdout != 'True'

- name: Create bas-secrets for workplace-init
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: bas-secrets
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-bastudio
      type: Opaque
      stringData:
        umsAdminUser: "{{ ums_admin_user }}"
        umsAdminPassword: "{{ ums_admin_password }}"
        oidcClientId: bastudio
        oidcClientSecret: "{{ ums_admin_password }}"
        navigatorUsername: "{{ cpe_admin_user }}"
        navigatorPassword: "{{ cpe_admin_password }}"

- name: Check if workplace-init Job already completed
  ansible.builtin.shell: >
    oc get job job-bas-workplace -n {{ baw_namespace }}
    -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}'
    2>/dev/null || echo ""
  register: _workplace_init_done
  changed_when: false
  failed_when: false

- name: Create BAStudio workplace-init Job
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: job-bas-workplace
        namespace: "{{ baw_namespace }}"
        labels:
          app: job-bas-workplace
      spec:
        completions: 1
        parallelism: 1
        backoffLimit: 15
        manualSelector: false
        completionMode: NonIndexed
        template:
          metadata:
            labels:
              name: job-bas-workplace
          spec:
            restartPolicy: OnFailure
            serviceAccountName: default
            terminationGracePeriodSeconds: 30
            automountServiceAccountToken: false
            dnsPolicy: ClusterFirst
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            initContainers:
              - name: wait-for-icn
                image: registry.access.redhat.com/ubi8/ubi-minimal:latest
                imagePullPolicy: IfNotPresent
                command:
                  - sh
                  - '-c'
                  - |
                    echo "Waiting for ICN to be ready..."
                    until curl -k -s -o /dev/null -w "%{http_code}" https://icn-svc.{{ baw_namespace }}.svc.cluster.local:9443/navigator | grep -q "200\|302\|401"; do
                      echo "ICN not ready yet, retrying in 15s..."
                      sleep 15
                    done
                    echo "ICN is ready."
                securityContext:
                  capabilities:
                    drop:
                      - ALL
                  privileged: false
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
                  seccompProfile:
                    type: RuntimeDefault
            containers:
              - name: baw-ibm-workplace-init-job
                image: "cp.icr.io/cp/cp4a/baw/iaws-ibm-workplace:25.0.1"
                imagePullPolicy: IfNotPresent
                terminationMessagePath: /dev/termination-log
                terminationMessagePolicy: File
                securityContext:
                  capabilities:
                    drop:
                      - ALL
                  privileged: false
                  runAsNonRoot: true
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  seccompProfile:
                    type: RuntimeDefault
                command:
                  - /bin/bash
                  - '-ec'
                  - |+
                    for filename in /credentials/*; do
                      export $(basename $filename)=$(cat $filename);
                    done
                    mkdir -p /logs/application/${HOSTNAME}
                    cp /opt/ibm/applications/publishApplication.sh /tmp/publishApplication.sh
                    sed -i 's/grep -E $grep_status/grep -E "$grep_status|204"/' /tmp/publishApplication.sh
                    sed -i 's|checkLiveness "https://$VAR_APPENGINE_HOST/k8s/liveliness" "200"||' /tmp/publishApplication.sh
                    sed -i 's/local statusCode=201/local statusCode=200/' /tmp/publishApplication.sh
                    sed -i 's/VAR_PLUGINS="IbmbpmSolutionDiscoveryPlugin,WalkMePlugin"/VAR_PLUGINS=""/' /tmp/publishApplication.sh
                    chmod +x /tmp/publishApplication.sh
                    exec /tmp/publishApplication.sh
                env:
                  - name: OIDC_HOST
                    value: "ums-svc.{{ baw_namespace }}.svc.cluster.local:9443"
                  - name: NAVIGATOR_HOST
                    value: "icn-svc.{{ baw_namespace }}.svc.cluster.local:9443"
                  - name: APPENGINE_HOST
                    value: "bastudio-svc.{{ baw_namespace }}.svc.cluster.local:9443/bas"
                  - name: APP_ENGINE_CONNECTION_REPO_ID
                    value: 'ICMTarget Objectstore'
                  - name: DISABLE_BASIC_AUTH
                    value: 'False'
                  - name: CURL_CA_BUNDLE
                    value: /shared/resources/cert-trusted/ca.crt
                  - name: SSL_CERT_FILE
                    value: /shared/resources/cert-trusted/ca.crt
                  - name: ZEN_JWK_URL
                    value: ''
                  - name: ZEN_PRE_AUTH_URL
                    value: ''
                  - name: OPENID_ID_TOKEN_URL
                    value: ''
                resources:
                  limits:
                    cpu: '1'
                    ephemeral-storage: 2Gi
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    ephemeral-storage: 1Gi
                    memory: 128Mi
                volumeMounts:
                  - name: temp-folder
                    mountPath: /tmp
                  - name: log-pvc
                    mountPath: /logs/application
                  - name: credentials
                    mountPath: /credentials
                  - name: ca-tls-volume
                    mountPath: /shared/resources/cert-trusted
            volumes:
              - name: temp-folder
                emptyDir: {}
              - name: log-pvc
                emptyDir: {}
              - name: ca-tls-volume
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: ca.crt
                      path: ca.crt
              - name: credentials
                projected:
                  defaultMode: 0777
                  sources:
                    - secret:
                        name: bas-secrets
                        items:
                          - key: umsAdminUser
                            path: OIDC_USERNAME
                          - key: umsAdminPassword
                            path: OIDC_PASSWORD
                          - key: oidcClientId
                            path: APP_ENGINE_CLIENT_ID
                          - key: oidcClientSecret
                            path: APP_ENGINE_CLIENT_SECRET
                          - key: navigatorUsername
                            path: NAVIGATOR_USERNAME
                          - key: navigatorPassword
                            path: NAVIGATOR_PASSWORD
            imagePullSecrets:
              - name: ibm-entitlement-key
  when: _workplace_init_done.stdout != 'True'

- name: Wait for workplace-init job to complete
  ansible.builtin.shell: >
    kubectl wait --for=condition=complete job/job-bas-workplace
    -n {{ baw_namespace }} --timeout={{ bastudio_job_timeout }}s
  changed_when: false
  when: _workplace_init_done.stdout != 'True'

# ── Fix BPM Navigator plugin REST origin (browser reachability) ────────────────
# workplace-init registers IbmbpmNavigatorPlugin in ICN with BPMRestOrigin set to
# the INTERNAL bastudio-svc URL. The Case Client's browser JS calls BPMRestOrigin
# for straight-through processing, but the browser cannot reach an internal
# cluster service name -> "The resources required for straight-through processing
# are not reachable". Repoint it to the external route (bastudio-route serves
# /bas, and the plugin appends /bas/rest/bpm/...). Idempotent.

- name: Repoint BPM plugin BPMRestOrigin to external route in ICN config
  ansible.builtin.shell: >
    oc exec -n {{ infra_namespace }} {{ _pg_pod.stdout }} --
    env PGPASSWORD={{ postgres_admin_password }}
    psql -U postgres -d {{ icn_db_name }} -c
    "UPDATE icndb.configuration SET attributes = REPLACE(attributes,
    'https://bastudio-svc.{{ baw_namespace }}.svc.cluster.local:9443',
    'https://{{ baw_hostname }}:443')
    WHERE id='plugin.navigator.IbmbpmNavigatorPlugin'
    AND attributes LIKE '%BPMRestOrigin%bastudio-svc%'"
  register: _bpm_origin_fix
  changed_when: "'UPDATE 0' not in _bpm_origin_fix.stdout"

- name: Restart ICN if BPM origin changed (reload plugin config)
  ansible.builtin.shell: >
    oc rollout restart deployment/icn -n {{ baw_namespace }}
  when: "'UPDATE 0' not in _bpm_origin_fix.stdout"
  changed_when: true

- name: BAStudio summary
  ansible.builtin.debug:
    msg:
      - "BAStudio ready"
      - "  BAStudio   : https://{{ baw_hostname }}/bas/BAStudio"
      - "  WorkflowCtr: https://{{ baw_hostname }}/bas/WorkflowCenter"
      - "  ProcessAdmin: https://{{ baw_hostname }}/bas/ProcessAdmin"
      - "  REST APIs  : https://{{ baw_hostname }}/bas/bpm/..."
      - "  Admin user : {{ ums_admin_user }}"

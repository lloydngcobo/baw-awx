---
# Role: icn
# Deploys IBM Content Navigator (ICN) 3.2 in the baw namespace.
# ICN provides the web-based document management UI.
# Requires CPE to be running and the icn_db PostgreSQL database to exist.

# ── Secrets ───────────────────────────────────────────────────────────────────

- name: Create ICN credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: icn-secret
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-icn
      stringData:
        ICN_ADMIN_USER:     "{{ cpe_admin_user }}"
        ICN_ADMIN_PASSWORD: "{{ cpe_admin_password }}"
        ICN_DB_USER:        "{{ icn_db_user }}"
        ICN_DB_PASS:        "{{ icn_db_pass }}"
        LDAP_BIND_PASSWORD: "{{ ldap_bind_password }}"
        KEYSTORE_PASSWORD:  "{{ keystore_password }}"
  no_log: true

# ── Liberty server overrides ──────────────────────────────────────────────────

- name: Create ICN Liberty config ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: icn-liberty-config
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-icn
      data:
        db-datasources.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <library id="PostgreSQLLib">
              <fileset dir="/opt/ibm/wlp/usr/shared/resources/db/postgres"
                       includes="*.jar"/>
            </library>

            <dataSource id="ECMClientDS" jndiName="ECMClientDS"
                        type="javax.sql.XADataSource">
              <jdbcDriver libraryRef="PostgreSQLLib"/>
              <properties.postgresql
                serverName="{{ postgres_host }}"
                portNumber="{{ postgres_port }}"
                databaseName="{{ icn_db_name }}"
                user="${env.ICN_DB_USER}"
                password="${env.ICN_DB_PASS}"
                currentSchema="icn_schema"/>
              <connectionManager maxPoolSize="20" minPoolSize="1"/>
            </dataSource>
          </server>

        ldap-registry.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <ldapRegistry id="LDAPUserRegistry"
              realm="defaultWIMFileBasedRealm"
              host="{{ ldap_host }}"
              port="{{ ldap_port }}"
              baseDN="{{ ldap_user_base }}"
              bindDN="{{ ldap_bind_dn }}"
              bindPassword="${env.LDAP_BIND_PASSWORD}"
              ldapType="Custom">
              <ldapEntityType name="PersonAccount">
                <rdnProperty name="uid"/>
                <objectClass>inetOrgPerson</objectClass>
              </ldapEntityType>
              <ldapEntityType name="Group">
                <rdnProperty name="cn"/>
                <objectClass>groupOfNames</objectClass>
                <memberAttribute name="member"/>
              </ldapEntityType>
              <userFilter
                filter="(&amp;(uid=%v)(objectclass=inetOrgPerson))"/>
              <groupFilter
                filter="(&amp;(cn=%v)(objectclass=groupOfNames))"/>
              <userIdMap filter="uid"/>
              <groupIdMap filter="cn"/>
              <groupMemberIdMap filter="member"/>
            </ldapRegistry>
          </server>

        session-config.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <httpSession invalidateOnUnauthorizedSessionRequestException="false"/>
          </server>

        ssl-config.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <keyStore id="defaultKeyStore"
              location="/shared/tls/pkcs12/server.p12"
              password="${env.KEYSTORE_PASSWORD}"
              type="PKCS12"/>
            <keyStore id="defaultTrustStore"
              location="/shared/tls/pkcs12/trusts.p12"
              password="${env.KEYSTORE_PASSWORD}"
              type="PKCS12"/>
            <ssl id="defaultSSLConfig"
              keyStoreRef="defaultKeyStore"
              trustStoreRef="defaultTrustStore"
              sslProtocol="TLSv1.2"/>
            <sslDefault sslRef="defaultSSLConfig"/>
          </server>

# ── Storage ───────────────────────────────────────────────────────────────────

- name: Create ICN data PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: icn-pvc
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-icn
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 10Gi
        storageClassName: "{{ storage_class_name }}"

- name: Create ICN logs PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: icn-logs-pvc
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-icn
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 5Gi
        storageClassName: "{{ storage_class_name }}"

# Shared with bastudio case-init job — case-init writes ICMAPIPlugin JARs here,
# ICN reads them from /opt/ibm/plugins/properties. Must exist before ICN pod starts.
- name: Create bastudio-case-init shared PVC (ICMAPIPlugin JAR staging)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: bastudio-case-init
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-icn
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 5Gi
        storageClassName: "{{ storage_class_name }}"

# ── Deployment ────────────────────────────────────────────────────────────────

- name: Deploy ICN Navigator
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: icn
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-icn
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: baw-icn
        template:
          metadata:
            labels:
              app: baw-icn
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000
            initContainers:
              # Downloads the PostgreSQL JDBC driver into an emptyDir
              # mounted into the main container at the Liberty shared-resources path.
              - name: icn-init-jdbc
                image: busybox
                command:
                  - sh
                  - -c
                  - >-
                    wget -q -O /jdbc-target/postgresql.jar
                    https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
                    && echo "JDBC driver downloaded OK"
                volumeMounts:
                  - name: jdbc-drivers
                    mountPath: /jdbc-target
              # Fixes permissions on the PVC-backed directories that ICN requires
              # to be writable (runs as root before the main container starts).
              - name: icn-init-permissions
                image: busybox
                command:
                  - sh
                  - -c
                  - >-
                    mkdir -p
                    /opt/ibm/viewerconfig/cache
                    /opt/ibm/viewerconfig/logs
                    && chmod -R 777
                    /opt/ibm/viewerconfig
                    /opt/ibm/wlp/usr/servers/defaultServer/logs
                securityContext:
                  runAsUser: 0
                volumeMounts:
                  - name: data
                    mountPath: /opt/ibm/viewerconfig
                  - name: logs
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/logs
            containers:
              - name: icn
                image: "{{ icn_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 9080
                    name: http
                  - containerPort: 9443
                    name: https
                envFrom:
                  - secretRef:
                      name: icn-secret
                env:
                  - name: LICENSE
                    value: "accept"
                  - name: LICENSEMODEL
                    value: "{{ baw_license }}"
                  - name: disableFIPS
                    value: "true"
                  - name: TZ
                    value: "{{ timezone }}"
                  - name: JVM_HEAP_XMS
                    value: "512m"
                  - name: JVM_HEAP_XMX
                    value: "1536m"
                resources:
                  requests:
                    memory: 1Gi
                    cpu: 500m
                  limits:
                    memory: 3Gi
                    cpu: "2"
                livenessProbe:
                  httpGet:
                    path: /navigator/logout.jsp
                    port: 9080
                    scheme: HTTP
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  failureThreshold: 10
                readinessProbe:
                  httpGet:
                    path: /navigator/logout.jsp
                    port: 9080
                    scheme: HTTP
                  initialDelaySeconds: 90
                  periodSeconds: 15
                  failureThreshold: 20
                startupProbe:
                  httpGet:
                    path: /navigator/logout.jsp
                    port: 9080
                    scheme: HTTP
                  periodSeconds: 15
                  failureThreshold: 40
                volumeMounts:
                  - name: data
                    mountPath: /opt/ibm/viewerconfig
                  - name: logs
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/logs
                  # PostgreSQL JDBC driver — populated by icn-init-jdbc init container
                  - name: jdbc-drivers
                    mountPath: /opt/ibm/wlp/usr/shared/resources/db/postgres
                  # The overrides directory does NOT exist in the ICN image (only defaults/
                  # is present). Mount an emptyDir here to provide a writable directory,
                  # then subPath-mount each config file into it.
                  - name: overrides-dir
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/db-datasources.xml
                    subPath: db-datasources.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ldap-registry.xml
                    subPath: ldap-registry.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ssl-config.xml
                    subPath: ssl-config.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/session-config.xml
                    subPath: session-config.xml
                  - name: tls
                    mountPath: /shared/tls/pkcs12
                  # ICMAPIPlugin JARs written here by case-init job (via bastudio-case-init PVC)
                  - name: icm-plugins
                    mountPath: /opt/ibm/plugins/properties
                    subPath: properties
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: icn-pvc
              - name: logs
                persistentVolumeClaim:
                  claimName: icn-logs-pvc
              - name: overrides-dir
                emptyDir: {}
              - name: jdbc-drivers
                emptyDir: {}
              - name: liberty-config
                configMap:
                  name: icn-liberty-config
              - name: tls
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: server.p12
                      path: server.p12
                    - key: trusts.p12
                      path: trusts.p12
              # Shared PVC with case-init job: case-init writes ICMAPIPlugin.jar to
              # /opt/ibm/icm/shared/properties/, ICN reads it at /opt/ibm/plugins/properties/
              - name: icm-plugins
                persistentVolumeClaim:
                  claimName: bastudio-case-init

# ── Service ───────────────────────────────────────────────────────────────────

- name: Create ICN Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: icn-svc
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-icn
      spec:
        selector:
          app: baw-icn
        ports:
          - port: 9080
            targetPort: 9080
            name: http
          - port: 9443
            targetPort: 9443
            name: https

# ── Wait ──────────────────────────────────────────────────────────────────────

- name: Wait for ICN deployment
  ansible.builtin.shell: >
    oc rollout status deployment/icn
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false

# ── ICN Repository Initialisation Job ────────────────────────────────────────
# Modelled on install/icn/icn-job-init-repos.yaml from baw-microshift-rhel.
# Logs in via /navigator/jaxrs/logon, sets adminUsers, creates DOCS/DOS/TOS
# P8 repositories and connection points.  Must complete before case-init.

- name: Check if ICN init-repos Job already completed
  ansible.builtin.shell: >
    oc get job job-icn-init-repos -n {{ baw_namespace }}
    -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}'
    2>/dev/null || echo ""
  register: _icn_init_done
  changed_when: false
  failed_when: false

- name: Delete ICN init-repos Job if not completed (allows spec update on retry)
  ansible.builtin.shell: >
    oc delete job job-icn-init-repos -n {{ baw_namespace }} --ignore-not-found
  changed_when: false
  when: _icn_init_done.stdout | trim != 'True'

- name: Create ICN init-repos Job
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: job-icn-init-repos
        namespace: "{{ baw_namespace }}"
        labels:
          app: job-icn-init-repos
      spec:
        completions: 1
        parallelism: 1
        backoffLimit: 5
        template:
          metadata:
            labels:
              app: job-icn-init-repos
          spec:
            restartPolicy: OnFailure
            terminationGracePeriodSeconds: 30
            containers:
              - name: icn-init-repos
                image: registry.access.redhat.com/ubi8/ubi-minimal:latest
                imagePullPolicy: IfNotPresent
                securityContext:
                  capabilities:
                    drop: ["ALL"]
                  privileged: false
                  allowPrivilegeEscalation: false
                env:
                  - name: CURL_CA_BUNDLE
                    value: /shared/resources/cert-trusted/ca.crt
                resources:
                  limits:
                    cpu: 500m
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 64Mi
                volumeMounts:
                  - name: tmp-dir
                    mountPath: /tmp
                  - name: ca-tls-volume
                    mountPath: /shared/resources/cert-trusted
                command:
                  - /bin/bash
                  - '-ec'
                  - |+
                    ICN_HOST="icn-svc.{{ baw_namespace }}.svc.cluster.local:9443"
                    ICN_USER="{{ cpe_admin_user }}"
                    ICN_PASS="{{ cpe_admin_password }}"
                    CPE_MTOM="https://cpe-svc.{{ baw_namespace }}.svc.cluster.local:9443/wsi/FNCEWS40MTOM"
                    COOKIES="/tmp/icn-cookies.txt"

                    echo "Waiting for ICN to respond..."
                    until STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "https://${ICN_HOST}/navigator/"); \
                          echo "ICN status: ${STATUS}"; \
                          echo "${STATUS}" | grep -qE "^(200|302|401)$"; do
                      echo "ICN not ready yet, retrying in 15s..."
                      sleep 15
                    done

                    echo "Logging on to ICN as ${ICN_USER}..."
                    RESP=$(curl -sk -c "${COOKIES}" \
                      -X POST "https://${ICN_HOST}/navigator/jaxrs/logon" \
                      -H "Content-Type: application/x-www-form-urlencoded" \
                      --data-urlencode "desktop=admin" \
                      --data-urlencode "application=navigator" \
                      --data-urlencode "userid=${ICN_USER}" \
                      --data-urlencode "password=${ICN_PASS}")
                    TOKEN=$(echo "${RESP}" | sed -n 's/.*"security_token":"\([^"]*\)".*/\1/p')
                    if [ -z "${TOKEN}" ]; then
                      echo "ERROR: No security_token in logon response."
                      echo "Full response: ${RESP}"
                      exit 1
                    fi
                    echo "Got security token."

                    # Helper: refresh TOKEN from any ICN response that contains security_token
                    refresh_token() {
                      local NEW_TOK
                      NEW_TOK=$(echo "$1" | sed -n 's/.*"security_token":"\([^"]*\)".*/\1/p')
                      if [ -n "${NEW_TOK}" ]; then TOKEN="${NEW_TOK}"; fi
                    }

                    echo "Step 1-1: Updating ICN admin settings (adminUsers)..."
                    JSON_ADMIN_CFG='{"settingsConfig":{"editServiceCustomURLEnabled":false,"editServiceDownloadLinkEnabled":true,"adminUsers":"{{ cpe_admin_user }},{{ ums_admin_user }},admin,odmadmin","absoluteSessionTimeoutDuration":120,"absoluteSessionTimeoutEnabled":false,"id":"default","globalId":"settings.navigator.default","fileTypes":["boxnote","excel","outlook","pdf","powerpoint","word"],"navigatorMode":0,"tempfileCleanupInterval":6,"tempfileExpirationInterval":24,"pluginInitAttempts":3,"taskManagerServiceEnabled":"false","taskManagerHeartBeatMonitor":false,"editFilesCleanupInterval":20,"mobileAccess":"true","disableAutocomplete":"true","helpUrl":"https://www.ibm.com/docs","logging.level":"2","encryptLinks":false,"customSettings":"{}","umsUrl":"","ssoLogOutURL":"","ssoLogOutMethodRedirect":false,"culturalCollation":"false","officeOnlineEnabled":false,"asperaEnabled":false,"userActionMacros":["added.p8","modified.p8","checkedOut.p8","added.cm","modified.cm","checkedOut.cm"],"iconStatus":["docHold","docNotes","docMinorVersions","docDeclaredRecord","docBookmarks","docCheckedOut","workItemSuspended","workItemDeadlineImportance","workItemDeadlineReminderSent","workItemLocked","workItemCheckedOut"]},"objectExpiration":10,"fileTypesMappingData":[{"id":"pdf","_attributes":{"name":"PDF","description":"Adobe Portable Document Format(PDF)","contentTypes":"application/pdf","onlyUseInETAssociations":false}},{"id":"word","_attributes":{"name":"Word","description":"Microsoft Office Word","contentTypes":"application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.wordprocessingml.template","onlyUseInETAssociations":false}},{"id":"excel","_attributes":{"name":"Excel","description":"Microsoft Office Excel","contentTypes":"application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.spreadsheetml.template","onlyUseInETAssociations":false}},{"id":"powerpoint","_attributes":{"name":"PowerPoint","description":"Microsoft Office PowerPoint","contentTypes":"application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.presentationml.slideshow,application/vnd.openxmlformats-officedocument.presentationml.template","onlyUseInETAssociations":false}},{"id":"outlook","_attributes":{"name":"Outlook","description":"Microsoft Office Outlook","contentTypes":"application/x-filenet-filetype-msg,application/x-filenet-fileext-msg,application/vnd.ms-outlook","onlyUseInETAssociations":false}},{"id":"boxnote","_attributes":{"name":"Box Note","description":"Box Note","contentTypes":"application/x-box-note","onlyUseInETAssociations":false}}],"interfaceTextArray":[]}'
                    ADMIN_RESP=$(curl -sk -b "${COOKIES}" -c "${COOKIES}" \
                      -H "security_token: ${TOKEN}" \
                      -X POST "https://${ICN_HOST}/navigator/jaxrs/admin/updateAdminSettingsData" \
                      --data-urlencode "action=update" \
                      --data-urlencode "application=navigator" \
                      --data-urlencode "login_desktop=admin" \
                      --data-urlencode "securityTopic=settings.settings" \
                      --data-urlencode "userid=${ICN_USER}" \
                      --data-urlencode "json_post=${JSON_ADMIN_CFG}")
                    refresh_token "${ADMIN_RESP}"
                    echo "  Admin settings done (token refreshed)."

                    for ENTRY in "DOCS:Docs Objectstore" "DOS:ICMDesign Objectstore" "TOS:ICMTarget Objectstore"; do
                      OS="${ENTRY%%:*}"
                      case "${OS}" in
                        DOS) OS_LOWER="icmdos" ;;
                        TOS) OS_LOWER="icmtos" ;;
                        *)   OS_LOWER=$(echo "${OS}" | tr '[:upper:]' '[:lower:]') ;;
                      esac
                      REPO_NAME="${ENTRY#*:}"
                      REPO_ID="${OS_LOWER}_CIWEBADMIN"
                      echo "--- Processing repository: ${REPO_ID} ---"

                      P8_RESP=$(curl -sk -b "${COOKIES}" -c "${COOKIES}" \
                        -X POST "https://${ICN_HOST}/navigator/jaxrs/p8/logon" \
                        -H "Content-Type: application/x-www-form-urlencoded" \
                        -H "security_token: ${TOKEN}" \
                        --data-urlencode "desktop=admin" \
                        --data-urlencode "repositoryId=${REPO_ID}" \
                        --data-urlencode "userid=${ICN_USER}" \
                        --data-urlencode "password=${ICN_PASS}" \
                        --data-urlencode "displayName=${REPO_NAME}" \
                        --data-urlencode "serverName=${CPE_MTOM}" \
                        --data-urlencode "objectStore=${OS}" \
                        --data-urlencode "objectStoreDisplayName=${REPO_NAME}" \
                        --data-urlencode "protocol=FileNetP8WSI")
                      refresh_token "${P8_RESP}"
                      echo "  P8 logon: ${P8_RESP:0:200}"

                      JSON_POST=$(printf '{"repositoryConfig":{"type":"p8","id":"%s","version":"2.0","serverName":"%s","objectStore":"%s","name":"%s","objectStoreName":"%s","protocol":"FileNetP8WSI","useSSO":false,"enableWSI":true,"maxHits":1000,"timeoutInSeconds":"60","simpleSearchMaxResults":"5000","searchMaxResults":"0","maxDownloadSize":0,"maxInMemoryRetrieveSize":0,"traceLevel":0,"portNumber":"0","docNameProp":"DocumentTitle","folderNameProp":"FolderName","cmisRepositoryID":"*","cmisBindingType":"AtomPub","checkinAsMajorVersion":true,"addAsMajorVersion":true,"globalId":"repository.navigator.p8defaultsettings","defaultSearchType":"document","defaultSearchVersion":"releasedversion","allClassesSearch":"documentsIncludesNonFolders","teamspaceTemplatePermissions":"[]","teamspacePermissions":"[]","redactionPermissions":"[]","redactionPolicyPermissions":"[]","entryTemplatePermissions":"[]","searchPermissions":"[]","searchDefCols":["{NAME}","ContentSize","LastModifier","DateLastModified","MajorVersionNumber"],"folderDefCols":["{NAME}","ContentSize","LastModifier","DateLastModified","MajorVersionNumber"],"documentSystemProperties":["Creator","DateCreated","LastModifier","DateLastModified","Id","IsReserved","IsCurrentVersion","MajorVersionNumber","MinorVersionNumber","ContentSize","MimeType"],"folderSystemProperties":["Creator","DateCreated","Id","PathName"],"searchShowHiddenProperties":true,"restrictedSearchDocumentsType":true,"restrictedSearchFoldersType":true,"includeMIMETypesInSearchResults":true,"matchAll":true,"usePartFileName":true,"includeAttrGroupInAttrDisplayName":true,"keepInAutoFolder":true,"burnPDFToPDF":"true","approvalWorkflowEnabled":"true","annotationSecurity":"inherit","statusDocCheckedOut":"true","statusDocHold":true,"statusDocNotes":true,"statusDocFavorite":"true","statusOffline":"true","statusWorkItemDeadline":"true","statusWorkItemLocked":"true","isValid":true,"isWarn":"false"}}' \
                        "${OS_LOWER}" "${CPE_MTOM}" "${OS}" "${REPO_NAME}" "${REPO_NAME}")

                      SAVE_RESP=$(curl -sk -b "${COOKIES}" -c "${COOKIES}" \
                        -X POST "https://${ICN_HOST}/navigator/jaxrs/admin/p8/updateAdminRepositoryData" \
                        -H "Content-Type: application/x-www-form-urlencoded" \
                        -H "security_token: ${TOKEN}" \
                        --data-urlencode "application=navigator" \
                        --data-urlencode "repositoryId=${REPO_ID}" \
                        --data-urlencode "userid=${ICN_USER}" \
                        --data-urlencode "login_desktop=admin" \
                        --data-urlencode "action=add" \
                        --data-urlencode "json_post=${JSON_POST}" \
                        --data-urlencode "desktop=admin")
                      refresh_token "${SAVE_RESP}"
                      echo "  Save: ${SAVE_RESP:0:200}"
                      if echo "${SAVE_RESP}" | grep -q '"error"\|"errors"'; then
                        if echo "${SAVE_RESP}" | grep -qi 'already exist\|duplicate\|exists'; then
                          echo "  ${REPO_ID} already exists, skipping."
                        else
                          echo "ERROR saving ${REPO_ID}: ${SAVE_RESP}"
                          exit 1
                        fi
                      fi

                      curl -sk -b "${COOKIES}" -c "${COOKIES}" \
                        -X POST "https://${ICN_HOST}/navigator/jaxrs/admin/configuration" \
                        -H "security_token: ${TOKEN}" \
                        --data-urlencode "action=updatePropertiesMapping" \
                        --data-urlencode "id=${OS_LOWER}" \
                        --data-urlencode "userid=${ICN_USER}" \
                        --data-urlencode "login_desktop=admin" \
                        --data-urlencode "configuration=RepositoryConfig" \
                        --data-urlencode 'json_post={"propertiesMappingData":[]}' \
                        --data-urlencode "desktop=admin")
                      refresh_token "${MAP_RESP}"
                      echo "  ${REPO_ID} done."
                    done

                    echo "ICN repository initialisation complete."
            volumes:
              - name: tmp-dir
                emptyDir: {}
              - name: ca-tls-volume
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: ca.crt
                      path: ca.crt
  when: _icn_init_done.stdout | trim != 'True'

- name: Wait for ICN init-repos Job to complete
  ansible.builtin.shell: >
    kubectl wait --for=condition=complete job/job-icn-init-repos
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false
  when: _icn_init_done.stdout | trim != 'True'

- name: ICN summary
  ansible.builtin.debug:
    msg:
      - "ICN ready at https://icn-svc.{{ baw_namespace }}.svc.cluster.local:9443"
      - "Navigator URL : https://{{ baw_hostname }}/navigator/"

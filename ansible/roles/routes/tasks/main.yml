---
# Role: routes
# Creates OpenShift Routes for all BAW services.
#
# Termination strategy:
#   edge     — pods that serve BOTH HTTP (9080) and HTTPS: CPE, ICN, GraphQL, BAStudio, BAW-RT.
#              The router terminates TLS with its wildcard *.apps cert and forwards plain
#              HTTP to port 9080. insecureEdgeTerminationPolicy=Redirect forces http→https.
#   reencrypt — pods that serve HTTPS ONLY (httpPort=-1): UMS.
#              The router terminates the client's TLS, then re-encrypts toward the pod
#              using the destinationCACertificate (BAW Root CA from shared-ssl-config).
#
# Route layout:
#   /acce/                       → cpe-svc:9080        (edge)
#   /wsi/                        → cpe-svc:9080        (edge)
#   /navigator/                  → icn-svc:9080        (edge, when deploy_icn)
#   /content-services-graphql/   → graphql-svc:9080    (edge, when deploy_graphql)
#   /ums/                        → ums-svc:9443        (reencrypt, when deploy_ums)
#   /oidc/                       → ums-svc:9443        (reencrypt, when deploy_ums)
#   /ibm/                        → ums-svc:9443        (reencrypt, when deploy_ums)
#   /bas/                        → bastudio-svc:9080   (edge, when deploy_bastudio)
#   /baw/                        → baw-runtime-svc:9080 (edge, when deploy_baw_runtime)

# Fetch the BAW Root CA cert so it can be embedded as destinationCACertificate
# for reencrypt routes. Uses the shared-ssl-config ConfigMap (always created by
# the certificates role), making this role independently runnable.
- name: Get shared-ssl-config ConfigMap for CA cert
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: shared-ssl-config
    namespace: "{{ baw_namespace }}"
  register: _ssl_cm
  when: >
    deploy_ums | default(true) | bool or
    deploy_app_engine | default(false) | bool

- name: Set BAW CA cert fact
  ansible.builtin.set_fact:
    _baw_ca_cert: "{{ _ssl_cm.resources[0].data['ca.crt'] }}"
  when: >
    deploy_ums | default(true) | bool or
    deploy_app_engine | default(false) | bool

- name: Create CPE ACCE route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: cpe-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /acce
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: cpe-svc

- name: Create CPE WSI route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: cpe-wsi-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /wsi
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: cpe-svc

- name: Create ICN Navigator route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: icn-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /navigator
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: icn-svc
  when: deploy_icn | default(true) | bool

- name: Create GraphQL route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: graphql-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /content-services-graphql
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: graphql-svc
  when: deploy_graphql | default(true) | bool

# UMS serves HTTPS only (httpPort=-1), so all UMS routes use reencrypt termination
# (edge termination requires pod to serve HTTP on port 9080, which UMS does not).
# Three separate routes cover the UMS surface area:
#   /ums            → UMS UI and admin endpoints
#   /oidc           → OIDC/OAuth2 authorize, token, introspect endpoints
#   /ibm            → SCIM and Liberty explorer endpoints

- name: Create UMS UI route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: ums-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /ums
        port:
          targetPort: https
        tls:
          termination: reencrypt
          insecureEdgeTerminationPolicy: Redirect
          destinationCACertificate: "{{ _baw_ca_cert }}"
        to:
          kind: Service
          name: ums-svc
  when: deploy_ums | default(true) | bool

- name: Create UMS OIDC route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: ums-oidc-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /oidc
        port:
          targetPort: https
        tls:
          termination: reencrypt
          insecureEdgeTerminationPolicy: Redirect
          destinationCACertificate: "{{ _baw_ca_cert }}"
        to:
          kind: Service
          name: ums-svc
  when: deploy_ums | default(true) | bool

- name: Create UMS IBM-API route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: ums-ibm-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /ibm
        port:
          targetPort: https
        tls:
          termination: reencrypt
          insecureEdgeTerminationPolicy: Redirect
          destinationCACertificate: "{{ _baw_ca_cert }}"
        to:
          kind: Service
          name: ums-svc
  when: deploy_ums | default(true) | bool

- name: Create BAStudio route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: bastudio-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /bas
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: bastudio-svc
  when: deploy_bastudio | default(true) | bool

- name: Create BAStudio OIDC callback route
  # Liberty's openidConnectClient redirects the browser to /oidcclient/redirect/umsClient
  # after UMS authenticates the user. This path must be routed to bastudio-svc so Liberty
  # can complete the OIDC code exchange. Without this route, post-login hits a 503.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: bastudio-oidcclient-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /oidcclient
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: bastudio-svc
  when: deploy_bastudio | default(true) | bool

- name: Create ICMClient route
  # BAW Case Client browser JS loads resources from /ICMClient/ (no /bas/ prefix).
  # BAStudio serves the ICMClient EAR at context-root /bas/ICMClient (set by
  # baw_context_root_prefix variable). HAProxy rewrites /ICMClient → /bas/ICMClient.
  # Without this route, the Case Client gets 503 → STP "not reachable" error.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: icmclient-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
        annotations:
          haproxy.router.openshift.io/rewrite-target: /bas/ICMClient
      spec:
        host: "{{ baw_hostname }}"
        path: /ICMClient
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: bastudio-svc
  when: deploy_bastudio | default(true) | bool

- name: Create CaseBuilder route
  # BAW Case Builder also needs its own route since the context root is /bas/CaseBuilder
  # but browsers access /CaseBuilder/. Same rewrite pattern as ICMClient.
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: casebuilder-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
        annotations:
          haproxy.router.openshift.io/rewrite-target: /bas/CaseBuilder
      spec:
        host: "{{ baw_hostname }}"
        path: /CaseBuilder
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: bastudio-svc
  when: deploy_bastudio | default(true) | bool

- name: Create BAW Runtime route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: baw-runtime-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /baw
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: baw-runtime-svc
  when: deploy_baw_runtime | default(false) | bool

# ── ODM routes (Liberty pods serve HTTP → edge termination) ───────────────────
#   /decisioncenter   → odm-dc-svc:9060   Decision Center (rule authoring UI)
#   /res              → odm-dsc-svc:9080  Decision Server Console (admin)
#   /DecisionService  → odm-dsr-svc:9080  Decision Server Runtime (REST execution)

- name: Create ODM Decision Center route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: odm-decisioncenter-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /decisioncenter
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: odm-dc-svc
  when: deploy_odm | default(false) | bool

- name: Create ODM Decision Server Console route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: odm-decisionserverconsole-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /res
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: odm-dsc-svc
  when: deploy_odm | default(false) | bool

- name: Create ODM Decision Server Runtime route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: odm-decisionserverruntime-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_hostname }}"
        path: /DecisionService
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        to:
          kind: Service
          name: odm-dsr-svc
  when: deploy_odm | default(false) | bool

# ── App Engine route (HTTPS-only Node.js on 3001 → reencrypt) ─────────────────
# App Engine serves root paths (/, /v1, /ProcessPortal) so it gets a DEDICATED
# host rather than a path on baw_hostname. baw-ae-service port 443 → targetPort 3001.

- name: Create App Engine route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: app-engine-route
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw
      spec:
        host: "{{ baw_ae_subdomain }}.{{ effective_ingress_domain }}"
        port:
          targetPort: https
        tls:
          termination: reencrypt
          insecureEdgeTerminationPolicy: Redirect
          destinationCACertificate: "{{ _baw_ca_cert }}"
        to:
          kind: Service
          name: baw-ae-service
  when: deploy_app_engine | default(false) | bool

- name: Routes summary
  ansible.builtin.debug:
    msg:
      - "Routes created on host: {{ baw_hostname }}"
      - "  CPE ACCE   : https://{{ baw_hostname }}/acce/"
      - "  ICN        : https://{{ baw_hostname }}/navigator/"
      - "  GraphQL    : https://{{ baw_hostname }}/content-services-graphql/"
      - "  UMS        : https://{{ baw_hostname }}/ums/"
      - "  BAStudio   : https://{{ baw_hostname }}/bas/"
      - "  BAW Runtime: https://{{ baw_hostname }}/baw/"
      - "  ODM DC     : https://{{ baw_hostname }}/decisioncenter"
      - "  ODM Console: https://{{ baw_hostname }}/res"
      - "  ODM Runtime: https://{{ baw_hostname }}/DecisionService"
      - "  App Engine : https://{{ baw_ae_subdomain }}.{{ effective_ingress_domain }}/"

---
# Role: app_engine
# Deploys IBM App Engine (Playback Server) 25.0.1
# Enables Process Designer "Play" button for interactive process testing in BAStudio.
# Only runs when deploy_app_engine: true.
# Requires: CPE, UMS running. Uses aae_db database.

# ── Secrets ───────────────────────────────────────────────────────────────────

- name: Create App Engine credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ae-secret
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      stringData:
        AE_ADMIN_USER:               "{{ ums_admin_user }}"
        AE_ADMIN_PASSWORD:           "{{ ums_admin_password }}"
        AE_DB_USER:                  "{{ aae_db_user }}"
        AE_DB_PASS:                  "{{ aae_db_pass }}"
        LDAP_BIND_PASSWORD:          "{{ ldap_bind_password }}"
        KEYSTORE_PASSWORD:           "{{ keystore_password }}"
        LTPA_PASSWORD:               "{{ ltpa_password }}"
        UMS_INTERNAL_CLIENT_SECRET:  "{{ ums_internal_client_secret }}"
  no_log: true

# ── Liberty server config ─────────────────────────────────────────────────────

- name: Create App Engine Liberty config ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ae-liberty-config
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      data:
        db-datasources.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <library id="PostgreSQLLib">
              <fileset dir="/opt/ibm/wlp/usr/shared/resources/db/postgres"
                       includes="*.jar"/>
            </library>

            <dataSource id="AEDATASOURCE" jndiName="jdbc/AEDATASOURCE"
                        type="javax.sql.XADataSource">
              <jdbcDriver libraryRef="PostgreSQLLib"/>
              <properties.postgresql
                serverName="{{ postgres_host }}"
                portNumber="{{ postgres_port }}"
                databaseName="{{ aae_db_name }}"
                user="${env.AE_DB_USER}"
                password="${env.AE_DB_PASS}"/>
              <connectionManager maxPoolSize="20" minPoolSize="1"/>
            </dataSource>
          </server>

        ldap-registry.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <ldapRegistry id="LDAPUserRegistry"
              realm="defaultWIMFileBasedRealm"
              host="{{ ldap_host }}"
              port="{{ ldap_port }}"
              baseDN="{{ ldap_base_dn }}"
              bindDN="{{ ldap_bind_dn }}"
              bindPassword="${env.LDAP_BIND_PASSWORD}"
              ldapType="Custom">
              <ldapEntityType name="PersonAccount">
                <rdnProperty name="uid"/>
                <objectClass>inetOrgPerson</objectClass>
              </ldapEntityType>
              <ldapEntityType name="Group">
                <rdnProperty name="cn"/>
                <objectClass>groupOfNames</objectClass>
                <memberAttribute name="member"/>
              </ldapEntityType>
              <userFilter
                filter="(&amp;(uid=%v)(objectclass=inetOrgPerson))"/>
              <groupFilter
                filter="(&amp;(cn=%v)(objectclass=groupOfNames))"/>
              <userIdMap filter="uid"/>
              <groupIdMap filter="cn"/>
              <groupMemberIdMap filter="member"/>
            </ldapRegistry>
          </server>

        ssl-config.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <keyStore id="defaultKeyStore"
              location="/shared/tls/pkcs12/server.p12"
              password="${env.KEYSTORE_PASSWORD}"
              type="PKCS12"/>
            <keyStore id="defaultTrustStore"
              location="/shared/tls/pkcs12/trusts.p12"
              password="${env.KEYSTORE_PASSWORD}"
              type="PKCS12"/>
            <ssl id="defaultSSLConfig"
              keyStoreRef="defaultKeyStore"
              trustStoreRef="defaultTrustStore"
              sslProtocol="TLSv1.2"/>
            <sslDefault sslRef="defaultSSLConfig"/>
          </server>

# ── Storage ───────────────────────────────────────────────────────────────────

- name: Create App Engine data PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: ae-pvc
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 10Gi
        storageClassName: "{{ storage_class_name }}"

# ── Deployment ────────────────────────────────────────────────────────────────

- name: Deploy App Engine
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app-engine
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: app-engine
        template:
          metadata:
            labels:
              app: app-engine
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000
            containers:
              - name: app-engine
                image: "{{ ae_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 9080
                    name: http
                  - containerPort: 9443
                    name: https
                envFrom:
                  - secretRef:
                      name: ae-secret
                env:
                  - name: CPE_URI
                    value: "https://{{ cpe_host }}:{{ cpe_port }}/wsi/FNCEWS40MTOM/"
                  - name: UMS_HOST
                    value: "https://{{ baw_hostname }}/ums"
                  - name: TZ
                    value: "{{ timezone }}"
                  - name: JVM_HEAP_XMS
                    value: "512m"
                  - name: JVM_HEAP_XMX
                    value: "1024m"
                resources:
                  requests:
                    memory: 1Gi
                    cpu: 250m
                  limits:
                    memory: 2Gi
                    cpu: "1"
                livenessProbe:
                  httpGet:
                    path: /playback/health
                    port: 9080
                    scheme: HTTP
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  failureThreshold: 10
                readinessProbe:
                  httpGet:
                    path: /playback/health
                    port: 9080
                    scheme: HTTP
                  initialDelaySeconds: 90
                  periodSeconds: 15
                  failureThreshold: 20
                startupProbe:
                  httpGet:
                    path: /playback/health
                    port: 9080
                    scheme: HTTP
                  periodSeconds: 15
                  failureThreshold: 60
                volumeMounts:
                  - name: data
                    mountPath: /opt/ibm/ae/data
                  - name: logs
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/logs
                  - name: overrides-dir
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/db-datasources.xml
                    subPath: db-datasources.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ldap-registry.xml
                    subPath: ldap-registry.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ssl-config.xml
                    subPath: ssl-config.xml
                  - name: tls
                    mountPath: /shared/tls/pkcs12
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: ae-pvc
              - name: logs
                emptyDir: {}
              - name: overrides-dir
                emptyDir: {}
              - name: liberty-config
                configMap:
                  name: ae-liberty-config
              - name: tls
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: server.p12
                      path: server.p12
                    - key: trusts.p12
                      path: trusts.p12

# ── Service ───────────────────────────────────────────────────────────────────

- name: Create App Engine Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: app-engine-svc
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      spec:
        selector:
          app: app-engine
        ports:
          - port: 9080
            targetPort: 9080
            name: http
          - port: 9443
            targetPort: 9443
            name: https

# ── Wait ──────────────────────────────────────────────────────────────────────

- name: Wait for App Engine deployment
  ansible.builtin.shell: >
    oc rollout status deployment/app-engine
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false

- name: App Engine summary
  ansible.builtin.debug:
    msg:
      - "App Engine ready at https://app-engine-svc.{{ baw_namespace }}.svc.cluster.local:9443"
      - "App Engine URL : https://{{ baw_hostname }}/playback/"

---
# Role: app_engine
# Deploys IBM App Engine (Playback Server / solution-server) 25.0.1
# Node.js application on port 3001 (HTTPS).
# Faithful port of baw-microshift-rhel/install/ae/* with homelab substitutions:
#   baw-microshift.dev.internal -> {{ baw_hostname }}
#   ums-sso-service             -> ums-svc
#   root-ca-volume ConfigMap    -> shared-ssl-config
#   keypair                     -> baw-ssl-certs (tls.crt + tls.key)
# Only runs when deploy_app_engine: true.

# ── Main env-var ConfigMap (baw-ae-configuration) ─────────────────────────────

- name: Create App Engine configuration ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: baw-ae-configuration
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      data:
        MODEL_DIRECTORY: ""
        CSP_ENABLED: "false"
        SERVER_ENV_TYPE: "development"
        CSP_WHITELIST: ""
        CSP_FRAME_ANCESTOR: ""
        STATIC_ASSET_MAXAGE: "2592000"
        HSTS_MAXAGE: "2592000"

        # UMS OIDC
        OPENID_ISSUER: "https://{{ baw_hostname }}/oidc/endpoint/ums"
        OPENID_AUTHORIZATION_URL: "https://{{ baw_hostname }}/oidc/endpoint/ums/authorize"
        OPENID_TOKEN_URL: "https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/oidc/endpoint/ums/token"
        OPENID_INTROSPECTION_URL: "https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/oidc/endpoint/ums/introspect"
        OPENID_TOKEN_REFRESH_URL: "https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/oidc/endpoint/ums/token"
        OPENID_LOGOUT_URL: "https://{{ baw_hostname }}/oidc/endpoint/ums/logout"
        OPENID_JWK_URL: "https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/oidc/endpoint/ums/jwk"
        OPENID_SCOPE: "openid profile email"
        OPENID_FUNCTION_USER_SCOPE: "openid profile email"

        # UMS team server
        TEAM_SERVER_GRAPH_QL_URL: "https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/teamserver/rest/graphql"

        # Session
        SESSION_DURATION: "1800000"
        SESSION_RESAVE: "false"
        SESSION_ROLLING: "true"
        SESSION_SAVE_UNINITIALEZED: "false"
        SESSION_USE_EXTERNAL_STORE: "false"
        SESSION_CHECK_PERIOD: "3600000"
        SESSION_MAX: "10000"

        # Redis (disabled)
        REDIS_HOST: "localhost"
        REDIS_PORT: "6379"
        REDIS_TTL: "1800"
        REDIS_TLS: "false"
        REDIS_USER: ""

        # Max ages
        CSRF_COOKIE_MAXAGE: "3600000"
        AUTHENTICATION_COOKIE_MAXAGE: "900000"

        # Resource Registry (not deployed)
        RESOURCE_REGISTRY_HOSTNAME: ""
        RESOURCE_REGISTRY_PORT: "2379"
        RESOURCE_REGISTRY_URL: "/v3"
        LRU_CACHE_MAX_SIZE_RR: "1000"
        LRU_CACHE_MAX_AGE_TEAMS: "600000"

        # Database (PostgreSQL)
        AE_DATABASE_NAME: "{{ aae_db_name }}"
        AE_DATABASE_HOST: "{{ postgres_host }}"
        AE_DATABASE_PORT: "{{ postgres_port }}"
        AE_DATABASE_ALT_HOST: ""
        AE_DATABASE_ALT_PORT: ""
        AE_DATABASE_TYPE: "postgresql"
        AE_DATABASE_PROTOCOL: "TCPIP"
        AE_DATABASE_CURRENT_SCHEMA: "{{ aae_db_user }}"
        AE_DATABASE_POOL_SIZE_INIT: "1"
        AE_DATABASE_ENABLE_SSL: "false"
        AE_DATABASE_ENABLE_SSL_CLIENT_CERTIFICATE_AUTHENTICATION: "false"

        # LRU cache for DB
        UV_THREADPOOL_SIZE: "40"
        LRU_CACHE_MAX_SIZE_DB: "1000"
        LRU_CACHE_MAX_AGE_DB: "600000"

        # BAStudio (Playback Server mode)
        CONFIGURATOR_TARGET_ORIGIN: "https://{{ baw_hostname }}"
        DESIGNER_SERVER: "true"
        BIZ_ORCH_SERVER_ORIGIN: "https://{{ baw_hostname }}"
        BIZ_ORCH_SERVER_ORIGIN_INTERNAL: "https://bastudio-svc.{{ baw_namespace }}.svc.cluster.local:9443"

        # Public endpoint — App Engine is on its OWN dedicated host (baw-ae),
        # not the shared baw_hostname. PUBLIC_HOSTNAME drives the URLs it builds
        # for itself (including the OIDC redirect target).
        PUBLIC_HOSTNAME: "{{ baw_ae_hostname }}"
        PUBLIC_HTTPS_PORT: "443"
        INTERNAL_HOSTNAME: "baw-ae-service.{{ baw_namespace }}.svc.cluster.local"
        INTERNAL_HTTPS_PORT: "443"

        # OIDC callback — must be on the baw-ae host AND registered as a
        # redirect on the UMS 'baw-ae' client (see ums role).
        CONTEXT_ROOT_PREFIX: ""
        SESSION_COOKIE_PATH: "/"
        OPENID_CALLBACK_URL: "https://{{ baw_ae_hostname }}/auth/openidconnect/callback"

        # Misc
        PURGE_STALE_APPS_INTERVAL: "86400000"
        APPS_THRESHOLD: "100"
        STALE_THRESHOLD: "172800000"
        AUTOMATION_SERVICES_THRESHOLD: "100"
        AUTOMATION_SERVICES_STALE_THRESHOLD: "172800000"
        AE_SERVER_IDENTIFIER: ""
        AUTO_SERVICE_ONLY_MODE: "false"
        DEPLOYMENT_PURPOSE: ""
        ANALYTICS_KEY: ""
        ANALYTICS_URL: ""
        ACCOUNT_ID: ""
        ACCOUNT_PLAN: ""
        ACCOUNT_COUNTRYCODE: ""
        CONNECTION_TIMEOUT: "360000"
        HTTP_KEEP_ALIVE_TIMEOUT: "60000"
        CPE_ENABLE: "false"
        LICENSE_TYPE: "non-production"
        ENABLE_FILE_LOG: ""
        LOG_FILE_SIZE: "20M"
        LOG_ROTATE_SIZE: "5"
        RESTRICTED_MODE: "false"
        PUBLIC_APP_CONTEXT: "/public-app"

# ── /etc/nodejs file config (baw-ae-file-config) ──────────────────────────────
# This is the file the Node.js pino logger reads. NODE_LOG_LEVEL is REQUIRED —
# without it pino crashes with "default level: undefined".

- name: Create App Engine file-config ConfigMap (/etc/nodejs)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: baw-ae-file-config
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      data:
        common-config.yml: |-
          NODE_LOG_LEVEL: audit
          BROWSER_LOG_LEVEL: 2
          AE_DATABASE_POOL_SIZE_MAX: 100
          AE_SERVER_LOCALE: en
          MAX_REQUEST_BODY_SIZE: 2000

# ── Log rotation config (empty) ───────────────────────────────────────────────

- name: Create App Engine logrotate ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: baw-ae-logrotate
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      data:
        filebeat.conf: ""
        logging.conf: ""

# ── Startup scripts (/shared/scripts) ─────────────────────────────────────────

- name: Create App Engine scripts ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: baw-ae-scripts
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      data:
        merge_dot_env.sh: |+
          #!/bin/bash
          if [[ -e /usr/home/solution-server/secrets.env ]]; then
            echo "Merge dot env"
            cat /usr/home/solution-server/secrets.env >> /usr/home/solution-server/.env
          fi
          mkdir -p $LOG_FILE_PATH
        update_swidtag.sh: |+
          #!/bin/bash
          echo "Application Engine runs on mode $LICENSE_TYPE"

# ── TLS keypair secret (reuse baw-ssl-certs tls.crt + tls.key) ─────────────────

- name: Read shared TLS cert + key for App Engine keypair
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: baw-ssl-certs
    namespace: "{{ baw_namespace }}"
  register: _baw_certs

- name: Create App Engine TLS keypair Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: baw-app-engine-tls-secret
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ _baw_certs.resources[0].data['tls.crt'] }}"
        tls.key: "{{ _baw_certs.resources[0].data['tls.key'] }}"
  no_log: true

# ── Admin secret (init containers, OIDC) ──────────────────────────────────────

- name: Create App Engine admin Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: baw-app-engine-admin-secret
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      type: Opaque
      stringData:
        SSL_KEYSTORE_PASSWORD: "{{ keystore_password }}"
        AE_DATABASE_USER:      "{{ aae_db_user }}"
        AE_DATABASE_PWD:       "{{ aae_db_pass }}"
        OPENID_CLIENT_ID:      "baw-ae"
        OPENID_CLIENT_SECRET:  "{{ ums_admin_password }}"
        FUNCTION_ADMIN_USER:   "{{ ums_admin_user }}"
        FUNCTION_ADMIN_PWD:    "{{ ums_admin_password }}"
        adminUser:             "{{ ums_admin_user }}"
        adminPassword:         "{{ ums_admin_password }}"
  no_log: true

# ── Credential secret (secrets.env merged into .env) ──────────────────────────

- name: Create App Engine credential Secret (secrets.env)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: baw-ae-credential
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      type: Opaque
      stringData:
        secrets.env: |
          AE_DATABASE_USER={{ aae_db_user }}
          AE_DATABASE_PWD={{ aae_db_pass }}
          OPENID_CLIENT_ID=baw-ae
          OPENID_CLIENT_SECRET={{ ums_admin_password }}
          SESSION_SECRET=baw-ae-session-secret-change-me-32c
          SESSION_COOKIE_NAME=AESession
          REDIS_PASSWORD=
          FUNCTION_ADMIN_USER={{ ums_admin_user }}
          FUNCTION_ADMIN_PWD={{ ums_admin_password }}
          TEMPORARY_FILE_ENCRYPTION_PASSWORD={{ keystore_password }}encrypt
          SSL_KEYSTORE_PASSWORD={{ keystore_password }}
          RESOURCE_REGISTRY_AUTH_PASSWORD=
          RESOURCE_REGISTRY_AUTH_USERNAME=
          AUTOMATION_USER={{ ums_admin_user }}
          AUTOMATION_PWD={{ ums_admin_password }}
          APICATALOG_ENABLED=false
  no_log: true

# ── Init credential secret (slim — used by db-init import-toolkits) ────────────

- name: Create App Engine init credential Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: baw-ae-credential-init
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      type: Opaque
      stringData:
        secrets.env: |
          AE_DATABASE_USER={{ aae_db_user }}
          AE_DATABASE_PWD={{ aae_db_pass }}
          FUNCTION_ADMIN_USER={{ ums_admin_user }}
          FUNCTION_ADMIN_PWD={{ ums_admin_password }}
          SSL_KEYSTORE_PASSWORD={{ keystore_password }}
          APICATALOG_ENABLED=false
  no_log: true

# ── DB init Job (creates AE schema + imports base toolkits) ───────────────────
# Runs ONCE before the deployment. 3 init containers (keytool, Java DB schema,
# .env seed) + import-toolkits main container. k8s Jobs are immutable, so check
# completion first and skip if already done.

- name: Check if App Engine db-init Job already completed
  ansible.builtin.shell: >
    oc get job baw-ae-db-job -n {{ baw_namespace }}
    -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}'
    2>/dev/null || echo ""
  register: _ae_dbinit_done
  changed_when: false
  failed_when: false

- name: Create App Engine db-init Job
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: baw-ae-db-job
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      spec:
        backoffLimit: 5
        template:
          metadata:
            name: solution-server-db-init
            labels:
              app: app-engine
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            automountServiceAccountToken: false
            restartPolicy: OnFailure
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000140000
              fsGroup: 1000140000
            initContainers:
              # Step 1: TLS keystore
              - name: ssl-init-container
                image: "{{ ae_keytool_image }}"
                imagePullPolicy: IfNotPresent
                securityContext:
                  privileged: false
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: [ALL]
                env:
                  - name: KEYTOOL_ACTION
                    value: "GENERATE-BOTH"
                  - name: CREATE_KEYPAIR
                    value: "false"
                  - name: STORE_TYPES
                    value: "P12"
                volumeMounts:
                  - name: temp-folder
                    mountPath: /tmp
                  - name: tls-stores
                    mountPath: /shared/tls
                  - name: trust-tls-volume
                    mountPath: /shared/resources/cert-trusted
                  - name: keypair-secret
                    mountPath: /shared/resources/keypair
                  - name: credentials-env
                    mountPath: /credentials
              # Step 2: Java DB schema initializer
              - name: ae-db-init
                image: "{{ ae_dbinit_image }}"
                imagePullPolicy: IfNotPresent
                securityContext:
                  privileged: false
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: [ALL]
                env:
                  - name: OPENJ9_JAVA_OPTIONS
                    value: "-Dsemeru.fips=false -Djavax.net.ssl.trustStoreType=PKCS12"
                  - name: AE_NODE_ENV
                    value: "production"
                  - name: DESIGNER_SERVER
                    value: "true"
                  - name: ADMIN_USER
                    value: "{{ ums_admin_user }}"
                  - name: OIDC_HOST
                    value: "ums-svc.{{ baw_namespace }}.svc.cluster.local:9443"
                  - name: APPENGINE_HOST
                    value: "baw-ae-service.{{ baw_namespace }}.svc"
                  - name: RESOURCE_REGISTRY_TRUSTSTORE
                    value: "/shared/tls/truststore/pkcs12/trusts.p12"
                  - name: AE_CONTEXT_ROOT_PREFIX
                    value: ""
                  - name: PODNAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: LOG_FILE_PATH
                    value: logs/application/AE/$(PODNAME)
                envFrom:
                  - configMapRef:
                      name: baw-ae-configuration
                volumeMounts:
                  - name: temp-folder
                    mountPath: /tmp
                  - name: tls-stores
                    mountPath: /shared/tls/truststore/pkcs12/trusts.p12
                    subPath: truststore/pkcs12/trusts.p12
                    readOnly: true
                  - name: ae-log-pv
                    mountPath: /logs/application
                  - name: log-rotate-config
                    mountPath: /etc/supervisor/ext/filebeat.conf
                    subPath: filebeat.conf
                  - name: log-rotate-config
                    mountPath: /etc/supervisor/ext/logging.conf
                    subPath: logging.conf
                  - name: credentials-env
                    mountPath: /credentials
              # Step 3: seed .env
              - name: init-config
                image: "{{ ae_image }}"
                imagePullPolicy: IfNotPresent
                securityContext:
                  privileged: false
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: [ALL]
                command:
                  - /bin/bash
                  - -ec
                  - cp /usr/home/solution-server/.env /config/
                volumeMounts:
                  - name: config-folder
                    mountPath: /config
            containers:
              # Step 4: import base toolkits
              - name: import-toolkits
                image: "{{ ae_image }}"
                imagePullPolicy: IfNotPresent
                securityContext:
                  privileged: false
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: [ALL]
                env:
                  - name: AE_NODE_ENV
                    value: "production"
                  - name: DESIGNER_SERVER
                    value: "true"
                  - name: ADMIN_USER
                    value: "{{ ums_admin_user }}"
                  - name: TEMPORARY_FILE_DIRECTORY
                    value: "/shared/ae-shared-file"
                  - name: CORS_ALLOWED_ORIGINS
                    value: "https://{{ baw_hostname }}"
                  - name: AE_CONTEXT_ROOT_PREFIX
                    value: ""
                  - name: SERVICES
                    value: "system_artifact_import"
                  - name: PODNAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: LOG_FILE_PATH
                    value: /logs/application/AE/$(PODNAME)/
                envFrom:
                  - configMapRef:
                      name: baw-ae-configuration
                volumeMounts:
                  - name: system-log
                    mountPath: /logs/system
                  - name: config-folder
                    mountPath: /usr/home/solution-server/.env
                    subPath: .env
                  - name: temp-folder
                    mountPath: /tmp
                  - name: tls-stores
                    mountPath: /shared/tls
                  - name: models
                    mountPath: /usr/home/solution-server/models
                  - name: log-setting
                    mountPath: /etc/nodejs
                  - name: ae-file-pv
                    mountPath: /shared/ae-shared-file
                  - name: credentials
                    mountPath: /usr/home/solution-server/secrets.env
                    subPath: secrets.env
                  - name: plugin-script
                    mountPath: /shared/scripts
                  - name: log-rotate-config
                    mountPath: /etc/supervisor/ext/filebeat.conf
                    subPath: filebeat.conf
                  - name: log-rotate-config
                    mountPath: /etc/supervisor/ext/logging.conf
                    subPath: logging.conf
                  - name: ae-log-pv
                    mountPath: /logs/application
            volumes:
              - name: temp-folder
                emptyDir: {}
              - name: config-folder
                emptyDir: {}
              - name: models
                emptyDir: {}
              - name: tls-stores
                emptyDir: {}
              - name: ae-file-pv
                emptyDir: {}
              - name: ae-log-pv
                emptyDir: {}
              - name: system-log
                emptyDir: {}
              - name: keypair-secret
                secret:
                  secretName: baw-app-engine-tls-secret
              - name: trust-tls-volume
                projected:
                  defaultMode: 0770
                  sources:
                    - configMap:
                        name: shared-ssl-config
                        items:
                          - key: ca.crt
                            path: ca.crt
              - name: log-rotate-config
                configMap:
                  name: baw-ae-logrotate
              - name: log-setting
                configMap:
                  name: baw-ae-file-config
              - name: plugin-script
                configMap:
                  defaultMode: 0551
                  name: baw-ae-scripts
              - name: credentials
                secret:
                  defaultMode: 0551
                  secretName: baw-ae-credential-init
              - name: credentials-env
                projected:
                  sources:
                    - secret:
                        name: baw-app-engine-admin-secret
                        items:
                          - key: FUNCTION_ADMIN_USER
                            path: OIDC_USERNAME
                          - key: FUNCTION_ADMIN_PWD
                            path: OIDC_PASSWORD
                          - key: OPENID_CLIENT_ID
                            path: APP_ENGINE_CLIENT_ID
                          - key: OPENID_CLIENT_SECRET
                            path: APP_ENGINE_CLIENT_SECRET
                          - key: AE_DATABASE_USER
                            path: AE_DATABASE_USER
                          - key: AE_DATABASE_PWD
                            path: AE_DATABASE_PWD
                          - key: SSL_KEYSTORE_PASSWORD
                            path: KEYSTORE_PASSWORD
  when: _ae_dbinit_done.stdout != 'True'

- name: Wait for App Engine db-init Job to complete
  ansible.builtin.shell: >
    oc wait job/baw-ae-db-job -n {{ baw_namespace }}
    --for=condition=complete --timeout={{ bastudio_job_timeout }}s
  changed_when: false
  ignore_errors: true
  when: _ae_dbinit_done.stdout != 'True'

# ── Deployment ────────────────────────────────────────────────────────────────

- name: Deploy App Engine
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app-engine
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: app-engine
        template:
          metadata:
            labels:
              app: app-engine
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000140000
              fsGroup: 1000140000
            initContainers:
              # Init 1: Generate TLS keystore from keypair
              - name: ssl-init-container
                image: "{{ ae_keytool_image }}"
                imagePullPolicy: IfNotPresent
                securityContext:
                  privileged: false
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: [ALL]
                env:
                  - name: KEYTOOL_ACTION
                    value: "GENERATE-BOTH"
                  - name: CREATE_KEYPAIR
                    value: "false"
                  - name: STORE_TYPES
                    value: "P12"
                volumeMounts:
                  - name: temp-folder
                    mountPath: /tmp
                  - name: tls-stores
                    mountPath: /shared/tls
                  - name: trust-tls-volume
                    mountPath: /shared/resources/cert-trusted
                  - name: keypair-secret
                    mountPath: /shared/resources/keypair
                  - name: credentials-env
                    mountPath: /credentials
              # Init 2: Seed .env and facility store
              - name: init-config
                image: "{{ ae_image }}"
                imagePullPolicy: IfNotPresent
                securityContext:
                  privileged: false
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: [ALL]
                command:
                  - /bin/bash
                  - -ec
                  - |
                    cp /usr/home/solution-server/.env /config/
                    rm -rf /facilitystore/collectd
                    rm -rf /facilitystore/ext
                    cp -r /etc/collectd /facilitystore/
                    cp -r /etc/supervisor/ext /facilitystore/
                volumeMounts:
                  - name: config-folder
                    mountPath: /config
                  - name: facility-store
                    mountPath: /facilitystore
            containers:
              - name: app-engine-work-pod
                image: "{{ ae_image }}"
                imagePullPolicy: IfNotPresent
                securityContext:
                  privileged: false
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities:
                    drop: [ALL]
                env:
                  - name: TEMPORARY_FILE_DIRECTORY
                    value: "/shared/ae-shared-file"
                  - name: CORS_ALLOWED_ORIGINS
                    value: "https://{{ baw_hostname }}"
                  - name: PODNAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: LOG_FILE_PATH
                    value: /logs/application/AE/$(PODNAME)/
                  - name: ENABLE_AUDIT_LOGGING
                    value: "false"
                envFrom:
                  - configMapRef:
                      name: baw-ae-configuration
                ports:
                  - name: https
                    containerPort: 3001
                    protocol: TCP
                livenessProbe:
                  httpGet:
                    path: /k8s/liveliness
                    port: https
                    scheme: HTTPS
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 180
                  successThreshold: 1
                  failureThreshold: 5
                readinessProbe:
                  httpGet:
                    path: /k8s/readiness
                    port: https
                    scheme: HTTPS
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 180
                  successThreshold: 1
                  failureThreshold: 5
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    cpu: "2"
                    memory: 1024Mi
                volumeMounts:
                  - name: system-log
                    mountPath: /logs/system
                  - name: facility-store
                    mountPath: /etc/collectd
                    subPath: collectd
                  - name: facility-store
                    mountPath: /etc/supervisor/ext
                    subPath: ext
                  - name: config-folder
                    mountPath: /usr/home/solution-server/.env
                    subPath: .env
                  - name: temp-folder
                    mountPath: /tmp
                  - name: tls-stores
                    mountPath: /shared/tls
                  - name: models
                    mountPath: /usr/home/solution-server/models
                  - name: log-setting
                    mountPath: /etc/nodejs
                  - name: ae-file-pv
                    mountPath: /shared/ae-shared-file
                  - name: credentials
                    mountPath: /usr/home/solution-server/secrets.env
                    subPath: secrets.env
                  - name: plugin-script
                    mountPath: /shared/scripts
                  - name: log-rotate-config
                    mountPath: /etc/supervisor/ext/filebeat.conf
                    subPath: filebeat.conf
                  - name: log-rotate-config
                    mountPath: /etc/supervisor/ext/logging.conf
                    subPath: logging.conf
                  - name: ae-log-pv
                    mountPath: /logs/application
            volumes:
              - name: temp-folder
                emptyDir: {}
              - name: config-folder
                emptyDir: {}
              - name: models
                emptyDir: {}
              - name: tls-stores
                emptyDir: {}
              - name: system-log
                emptyDir: {}
              - name: ae-file-pv
                emptyDir: {}
              - name: ae-log-pv
                emptyDir: {}
              - name: facility-store
                emptyDir: {}
              - name: keypair-secret
                secret:
                  secretName: baw-app-engine-tls-secret
              - name: trust-tls-volume
                projected:
                  defaultMode: 0770
                  sources:
                    - configMap:
                        name: shared-ssl-config
                        items:
                          - key: ca.crt
                            path: ca.crt
              - name: log-rotate-config
                configMap:
                  name: baw-ae-logrotate
              - name: log-setting
                configMap:
                  name: baw-ae-file-config
              - name: plugin-script
                configMap:
                  defaultMode: 0551
                  name: baw-ae-scripts
              - name: credentials
                secret:
                  defaultMode: 0551
                  secretName: baw-ae-credential
              - name: credentials-env
                projected:
                  sources:
                    - secret:
                        name: baw-app-engine-admin-secret
                        items:
                          - key: SSL_KEYSTORE_PASSWORD
                            path: KEYSTORE_PASSWORD
                          - key: SSL_KEYSTORE_PASSWORD
                            path: TRUST_STORE_PWD
                          - key: AE_DATABASE_USER
                            path: DATABASE_USER
                          - key: AE_DATABASE_PWD
                            path: DATABASE_PWD

# ── Service ───────────────────────────────────────────────────────────────────

- name: Create App Engine Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: baw-ae-service
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      spec:
        selector:
          app: app-engine
        ports:
          - name: https
            protocol: TCP
            port: 443
            targetPort: 3001
        type: ClusterIP

# ── Wait ──────────────────────────────────────────────────────────────────────

- name: Wait for App Engine deployment
  ansible.builtin.shell: >
    oc rollout status deployment/app-engine
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false
  ignore_errors: true

- name: App Engine summary
  ansible.builtin.debug:
    msg:
      - "App Engine ready at https://baw-ae-service.{{ baw_namespace }}.svc.cluster.local"
      - "App Engine URL : https://{{ baw_hostname }}/playback/"

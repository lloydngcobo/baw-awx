---
# Role: app_engine
# Deploys IBM App Engine (Playback Server / solution-server) 25.0.1
# Node.js application on port 3001 (HTTPS).
# Enables Process Designer "Play" button for interactive process testing.
# Only runs when deploy_app_engine: true.
# Requires: CPE, UMS, BAStudio running. Uses aae_db database.

# ── Secrets ───────────────────────────────────────────────────────────────────

- name: Create App Engine credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ae-secret
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      stringData:
        AE_DB_USER:         "{{ aae_db_user }}"
        AE_DB_PASS:         "{{ aae_db_pass }}"
        OIDC_CLIENT_SECRET: "{{ ums_admin_password }}"
        SESSION_KEY:        "{{ keystore_password }}"
  no_log: true

# ── common-config.yml ConfigMap ────────────────────────────────────────────────
# Node.js solution-server reads all config from /etc/nodejs/common-config.yml

- name: Create App Engine common-config ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ae-common-config
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      data:
        common-config.yml: |
          # App Engine (solution-server) configuration
          # Ref: baw-microshift-rhel/install/ae/ae-configmap.yaml

          # Server
          PORT: 3000
          HOST: "0.0.0.0"
          PUBLIC_HOSTNAME: "https://{{ baw_hostname }}"
          SECURE_CONTEXT: "/playback"
          UV_THREADPOOL_SIZE: "4"

          # Licensing
          LICENSE_TYPE: "non-production"

          # OIDC (UMS)
          OIDC_ISSUER: "https://{{ baw_hostname }}/oidc/endpoint/ums"
          OIDC_ISSUER_SERVICE: "https://ums-svc.{{ baw_namespace }}.svc.cluster.local:9443/oidc/endpoint/ums"
          OIDC_CLIENT_ID: "baw-ae"
          OIDC_CALLBACK: "https://{{ baw_hostname }}/playback/callback"
          OIDC_LOGOUT_REDIRECT: "https://{{ baw_hostname }}/playback"
          OIDC_DISABLE_PKCE: "false"

          # Database (PostgreSQL)
          DB_TYPE: "postgresql"
          DB_HOST: "{{ postgres_host }}"
          DB_PORT: "{{ postgres_port }}"
          DB_NAME: "{{ aae_db_name }}"
          DB_SSL: "false"
          DB_SCHEMA: "{{ aae_db_user }}"

          # BAStudio connection
          DESIGNER_ENABLED: "true"
          DESIGNER_SERVER_URL: "https://bastudio-svc.{{ baw_namespace }}.svc.cluster.local:9443/bas"

          # Session
          SESSION_DURATION: "1800000"
          MAX_SESSIONS: "10000"
          SESSION_STORE: "memory"

          # Security
          CSP_DISABLED: "true"
          RESTRICT_MODE: "false"

          # Logging
          LOG_LEVEL: "info"
          LOG_TO_FILE: "false"

          # Timezone
          TZ: "{{ timezone }}"

# ── Storage ───────────────────────────────────────────────────────────────────

- name: Create App Engine logs PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: ae-logs-pvc
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 5Gi
        storageClassName: "{{ storage_class_name }}"

# ── Deployment ────────────────────────────────────────────────────────────────

- name: Deploy App Engine
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app-engine
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: app-engine
        template:
          metadata:
            labels:
              app: app-engine
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000
            containers:
              - name: app-engine
                image: "{{ ae_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 3001
                    name: https
                env:
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: ae-secret
                        key: AE_DB_USER
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: ae-secret
                        key: AE_DB_PASS
                  - name: OIDC_CLIENT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: ae-secret
                        key: OIDC_CLIENT_SECRET
                  - name: SESSION_KEY
                    valueFrom:
                      secretKeyRef:
                        name: ae-secret
                        key: SESSION_KEY
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                resources:
                  requests:
                    memory: 512Mi
                    cpu: 500m
                  limits:
                    memory: 2Gi
                    cpu: "2"
                livenessProbe:
                  httpGet:
                    path: /k8s/liveliness
                    port: 3001
                    scheme: HTTPS
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  failureThreshold: 10
                readinessProbe:
                  httpGet:
                    path: /k8s/readiness
                    port: 3001
                    scheme: HTTPS
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 20
                volumeMounts:
                  - name: common-config
                    mountPath: /etc/nodejs
                  - name: logs
                    mountPath: /opt/ibm/ae/logs
                  - name: tls
                    mountPath: /etc/ssl/certs/ca-bundle.crt
                    subPath: ca.crt
            volumes:
              - name: common-config
                configMap:
                  name: ae-common-config
              - name: logs
                persistentVolumeClaim:
                  claimName: ae-logs-pvc
              - name: tls
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: ca.crt
                      path: ca.crt

# ── Service ───────────────────────────────────────────────────────────────────

- name: Create App Engine Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: app-engine-svc
        namespace: "{{ baw_namespace }}"
        labels:
          app: app-engine
      spec:
        selector:
          app: app-engine
        ports:
          - port: 3001
            targetPort: 3001
            name: https

# ── Wait ──────────────────────────────────────────────────────────────────────

- name: Wait for App Engine deployment
  ansible.builtin.shell: >
    oc rollout status deployment/app-engine
    -n {{ baw_namespace }} --timeout={{ pod_ready_timeout }}s
  changed_when: false

- name: App Engine summary
  ansible.builtin.debug:
    msg:
      - "App Engine ready at https://app-engine-svc.{{ baw_namespace }}.svc.cluster.local:3001"
      - "App Engine URL : https://{{ baw_hostname }}/playback/"

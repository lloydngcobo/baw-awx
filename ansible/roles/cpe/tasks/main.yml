---
# Role: cpe
# Deploys IBM FileNet Content Platform Engine (CPE) 5.7 in the baw namespace.
# Configures JDBC datasources (Liberty overrides), LDAP registry, and SSL.
# After CPE is ready, creates the FileNet domain (GCD) and DOCS/DOS/TOS object stores.

# ── Secrets ───────────────────────────────────────────────────────────────────

- name: Create CPE credentials Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cpe-secret
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-cpe
      stringData:
        CPE_ADMIN_USER:     "{{ cpe_admin_user }}"
        CPE_ADMIN_PASSWORD: "{{ cpe_admin_password }}"
        UMS_ADMIN_USER:     "{{ ums_admin_user }}"
        UMS_ADMIN_PASSWORD: "{{ ums_admin_password }}"
        GCD_DB_USER:        "{{ gcd_db_user }}"
        GCD_DB_PASS:        "{{ gcd_db_pass }}"
        DOCS_DB_USER:       "{{ docs_db_user }}"
        DOCS_DB_PASS:       "{{ docs_db_pass }}"
        DOS_DB_USER:        "{{ dos_db_user }}"
        DOS_DB_PASS:        "{{ dos_db_pass }}"
        TOS_DB_USER:        "{{ tos_db_user }}"
        TOS_DB_PASS:        "{{ tos_db_pass }}"
        LDAP_BIND_PASSWORD: "{{ ldap_bind_password }}"
        KEYSTORE_PASSWORD:  "{{ keystore_password }}"
  no_log: true

# ── Liberty server overrides ──────────────────────────────────────────────────
# Mounted at /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/
# CPE reads these at startup to configure JDBC, LDAP, and SSL.

# ── Liberty config ConfigMap ──────────────────────────────────────────────────
# Aligned to reference baw-microshift-rhel/install/configmap.yaml.
# Key differences from reference: env vars for secrets (${env.*}) instead of
# XOR-encoded passwords; homelab JDBC path; homelab SSO domain.
# Shared LTPA keys (custom-ltpa.keys) MUST be identical in CPE and ICN for SSO.

- name: Create CPE Liberty config ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cpe-liberty-config
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-cpe
      data:
        # PostgreSQL JDBC driver library (jar placed by cpe-init-jdbc init container)
        PostgreSQLJDBCDriver.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <library id="PostgreSQLJDBC">
              <fileset dir="/opt/ibm/wlp/usr/shared/resources/db/postgres" includes="*.jar"/>
            </library>
          </server>

        # GCD datasources — non-XA for reads, XA for 2PC writes (reference pattern)
        ibm_GCD.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <dataSource id="FNGCDDS" jndiName="FNGCDDS" validationTimeout="15"
                        isolationLevel="TRANSACTION_READ_COMMITTED" type="javax.sql.DataSource">
              <jdbcDriver libraryRef="PostgreSQLJDBC"/>
              <properties.postgresql serverName="{{ postgres_host }}" portNumber="{{ postgres_port }}"
                databaseName="{{ gcd_db_name }}" user="${env.GCD_DB_USER}" password="${env.GCD_DB_PASS}" ssl="false"/>
              <connectionManager enableSharingForDirectLookups="false" minPoolSize="0" maxPoolSize="50"
                maxIdleTime="1m" reapTime="2m" agedTimeout="3m"/>
            </dataSource>
            <dataSource id="FNGCDDSXA" jndiName="FNGCDDSXA" validationTimeout="15"
                        isolationLevel="TRANSACTION_READ_COMMITTED" type="javax.sql.XADataSource" supplementalJDBCTrace="true">
              <jdbcDriver libraryRef="PostgreSQLJDBC"/>
              <properties.postgresql serverName="{{ postgres_host }}" portNumber="{{ postgres_port }}"
                databaseName="{{ gcd_db_name }}" user="${env.GCD_DB_USER}" password="${env.GCD_DB_PASS}" ssl="false"/>
              <connectionManager enableSharingForDirectLookups="true" minPoolSize="0" maxPoolSize="50"
                maxIdleTime="1m" reapTime="2m" agedTimeout="3m"/>
            </dataSource>
          </server>

        ibm_DOCS.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <dataSource id="FNDOCSDS" jndiName="FNDOCSDS" validationTimeout="15"
                        isolationLevel="TRANSACTION_READ_COMMITTED" type="javax.sql.DataSource">
              <jdbcDriver libraryRef="PostgreSQLJDBC"/>
              <properties.postgresql serverName="{{ postgres_host }}" portNumber="{{ postgres_port }}"
                databaseName="{{ docs_db_name }}" user="${env.DOCS_DB_USER}" password="${env.DOCS_DB_PASS}" ssl="false"/>
              <connectionManager enableSharingForDirectLookups="false" minPoolSize="0" maxPoolSize="50"
                maxIdleTime="1m" reapTime="2m" agedTimeout="3m"/>
            </dataSource>
            <dataSource id="FNDOCSDSXA" jndiName="FNDOCSDSXA" validationTimeout="15"
                        isolationLevel="TRANSACTION_READ_COMMITTED" type="javax.sql.XADataSource" supplementalJDBCTrace="true">
              <jdbcDriver libraryRef="PostgreSQLJDBC"/>
              <properties.postgresql serverName="{{ postgres_host }}" portNumber="{{ postgres_port }}"
                databaseName="{{ docs_db_name }}" user="${env.DOCS_DB_USER}" password="${env.DOCS_DB_PASS}" ssl="false"/>
              <connectionManager enableSharingForDirectLookups="true" minPoolSize="0" maxPoolSize="50"
                maxIdleTime="1m" reapTime="2m" agedTimeout="3m"/>
            </dataSource>
          </server>

        ibm_DOS.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <dataSource id="FNDOSDS" jndiName="FNDOSDS" validationTimeout="15"
                        isolationLevel="TRANSACTION_READ_COMMITTED" type="javax.sql.DataSource">
              <jdbcDriver libraryRef="PostgreSQLJDBC"/>
              <properties.postgresql serverName="{{ postgres_host }}" portNumber="{{ postgres_port }}"
                databaseName="{{ dos_db_name }}" user="${env.DOS_DB_USER}" password="${env.DOS_DB_PASS}" ssl="false"/>
              <connectionManager enableSharingForDirectLookups="false" minPoolSize="0" maxPoolSize="50"
                maxIdleTime="1m" reapTime="2m" agedTimeout="3m"/>
            </dataSource>
            <dataSource id="FNDOSDSXA" jndiName="FNDOSDSXA" validationTimeout="15"
                        isolationLevel="TRANSACTION_READ_COMMITTED" type="javax.sql.XADataSource" supplementalJDBCTrace="true">
              <jdbcDriver libraryRef="PostgreSQLJDBC"/>
              <properties.postgresql serverName="{{ postgres_host }}" portNumber="{{ postgres_port }}"
                databaseName="{{ dos_db_name }}" user="${env.DOS_DB_USER}" password="${env.DOS_DB_PASS}" ssl="false"/>
              <connectionManager enableSharingForDirectLookups="true" minPoolSize="0" maxPoolSize="50"
                maxIdleTime="1m" reapTime="2m" agedTimeout="3m"/>
            </dataSource>
          </server>

        ibm_TOS.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <dataSource id="FNTOSDS" jndiName="FNTOSDS" validationTimeout="15"
                        isolationLevel="TRANSACTION_READ_COMMITTED" type="javax.sql.DataSource">
              <jdbcDriver libraryRef="PostgreSQLJDBC"/>
              <properties.postgresql serverName="{{ postgres_host }}" portNumber="{{ postgres_port }}"
                databaseName="{{ tos_db_name }}" user="${env.TOS_DB_USER}" password="${env.TOS_DB_PASS}" ssl="false"/>
              <connectionManager enableSharingForDirectLookups="false" minPoolSize="0" maxPoolSize="50"
                maxIdleTime="1m" reapTime="2m" agedTimeout="3m"/>
            </dataSource>
            <dataSource id="FNTOSDSXA" jndiName="FNTOSDSXA" validationTimeout="15"
                        isolationLevel="TRANSACTION_READ_COMMITTED" type="javax.sql.XADataSource" supplementalJDBCTrace="true">
              <jdbcDriver libraryRef="PostgreSQLJDBC"/>
              <properties.postgresql serverName="{{ postgres_host }}" portNumber="{{ postgres_port }}"
                databaseName="{{ tos_db_name }}" user="${env.TOS_DB_USER}" password="${env.TOS_DB_PASS}" ssl="false"/>
              <connectionManager enableSharingForDirectLookups="true" minPoolSize="0" maxPoolSize="50"
                maxIdleTime="1m" reapTime="2m" agedTimeout="3m"/>
            </dataSource>
          </server>

        # LDAP — reference uses Tivoli DS type + federated repository
        ibm_ldap_custom_default1.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <ldapRegistry id="defaultldap1"
              host="{{ ldap_host }}"
              baseDN="{{ ldap_base_dn }}"
              port="{{ ldap_port }}"
              ldapType="IBM Tivoli Directory Server"
              bindDN="{{ ldap_bind_dn }}"
              sslEnabled="false"
              bindPassword="${env.LDAP_BIND_PASSWORD}">
              <idsFilters
                userFilter="(&amp;(uid=%v)(objectclass=person))"
                groupFilter="(&amp;(cn=%v)(|(objectclass=groupofnames)(objectclass=groupofuniquenames)(objectclass=groupofurls)))"
                userIdMap="*:uid"
                groupIdMap="*:cn"
                groupMemberIdMap="groupofnames:member"/>
            </ldapRegistry>
          </server>

        ibm_ldap_federated.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <federatedRepository>
              <primaryRealm name="LdapRegistry" allowOpIfRepoDown="true">
                <participatingBaseEntry name="{{ ldap_base_dn }}"/>
              </primaryRealm>
            </federatedRepository>
          </server>

        # SSL — reference pattern with sslDefault pointing to cssSSLSettings
        ibm_custom-ssl.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <sslDefault sslRef="cssSSLSettings"/>
            <ssl id="cssSSLSettings"
              keyStoreRef="defaultKeyStore"
              trustStoreRef="defaultTrustStore"
              sslProtocol="TLSv1.2,TLSv1.3"/>
            <keyStore id="defaultKeyStore"
              location="/shared/tls/pkcs12/server.p12"
              type="PKCS12"
              password="${env.KEYSTORE_PASSWORD}"/>
            <keyStore id="defaultTrustStore"
              location="/shared/tls/pkcs12/trusts.p12"
              type="PKCS12"
              password="${env.KEYSTORE_PASSWORD}"/>
          </server>

        # LTPA — shared keys required for SSO between CPE and ICN
        # Both services must use the SAME custom-ltpa.keys or LTPA tokens are rejected
        ibm_custom-ltpa.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <ltpa
              keysFileName="${server.config.dir}/resources/security/custom-ltpa.keys"
              keysPassword="${env.KEYSTORE_PASSWORD}"
              realm="defaultldap1Realm"
              expiration="120m" />
          </server>

        # Shared LTPA keys from reference repo — identical in CPE and ICN
        custom-ltpa.keys: |
          #Wed Jun 25 05:42:33 CEST 2025
          com.ibm.websphere.CreationDate=Wed Jun 25 05\:42\:33 CEST 2025
          com.ibm.websphere.CreationHost=localhost
          com.ibm.websphere.ltpa.3DESKey=Bms6ULbxVu+GeUlHua3GyZNYnh9iehiVfAwEtKnDBFw\=
          com.ibm.websphere.ltpa.\=
          com.ibm.websphere.ltpa.PublicKey=AMJpYeSavFgbpBBv8QfC9Xe9mxYmivrLbQZJ6mtSipYjIVVxDl20cZOQFZBSFAuG4rEsqFZ5vqVPxqLMXTa3tSLBAPbVWTRqM33kXjLrWL3iiCeYmhp4WS8+/rTtPbQ0Lt6JGjZKkpws1M16fK1zQ27YSUmGyjISTmg5yzQ2PBzjAQAB
          com.ibm.websphere.ltpa.Realm=defaultldap1Realm
          com.ibm.websphere.ltpa.version=1.0

        http-session.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <httpSession invalidationTimeout="120m" cloneId="the-session" idReuse="true" />
            <webAppSecurity
              ssoDomainNames="{{ ingress_domain }}|svc.cluster.local"
              preserveFullyQualifiedReferrerUrl="true" />
          </server>

        ibm_CORS.xml: |
          <?xml version="1.0" encoding="UTF-8"?>
          <server>
            <cors domain="/contentapi/rest/share/v1"
              allowedOrigins="*"
              allowedMethods="GET, DELETE, PUT, POST, OPTIONS"
              allowedHeaders="Connection,Pragma,Cache-Control,Navigator-Client-Build,XSRFtoken,ECM-XSRF-Token,Origin,User-Agent,Content-Type,Content-Length,Navigator-Client-Identity,Accept-Control-Request-Method,Accept-Control-Request-Headers,Accept,Referer,Accept-Encoding,Accept-Language,DNT,Host,Cache-control,Cookie,auth-token-realm,Authorization,Sec-Fetch-Site,Sec-Fetch-Mode"
              exposeHeaders="Content-Length,Content_Type,Content-Language,X-Powered-By,Date,Allow,Transfer-Encoding,DNT,Access-Control-Allow-Credentials,Access-Control-Allow-Headers,Access-Control-Allow-Max-Age,Access-Control-Allow-Methods,Access-Control-Allow-Origin,Access-Control-Expose-Headers,Connection,Cache-control,Cookie,Expires,Pragma,Set-Cookie"
              maxAge="86400" />
          </server>

# ── Storage ───────────────────────────────────────────────────────────────────

- name: Create CPE FileNet data PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: cpe-filenet-pvc
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-cpe
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 20Gi
        storageClassName: "{{ storage_class_name }}"

- name: Create CPE logs PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: cpe-logs-pvc
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-cpe
      spec:
        accessModes: [ReadWriteMany]
        resources:
          requests:
            storage: 5Gi
        storageClassName: "{{ storage_class_name }}"

# ── Deployment ────────────────────────────────────────────────────────────────

- name: Deploy CPE
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cpe
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-cpe
      spec:
        replicas: 1
        progressDeadlineSeconds: 960
        selector:
          matchLabels:
            app: baw-cpe
        template:
          metadata:
            labels:
              app: baw-cpe
          spec:
            imagePullSecrets:
              - name: ibm-entitlement-key
            securityContext:
              runAsUser: 1000140000
              fsGroup: 1000140000
            initContainers:
              # Downloads the PostgreSQL JDBC driver (not bundled in the CPE image)
              # into an emptyDir that is mounted into the main container at the
              # Liberty shared-resources path referenced by db-datasources.xml.
              - name: cpe-init-jdbc
                image: busybox
                command:
                  - sh
                  - -c
                  - >-
                    wget -q -O /jdbc-target/postgresql.jar
                    https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
                    && echo "JDBC driver downloaded OK"
                volumeMounts:
                  - name: jdbc-drivers
                    mountPath: /jdbc-target
              - name: cpe-init-permissions
                image: busybox
                command:
                  - sh
                  - -c
                  - >-
                    chmod -R 777
                    /opt/ibm/wlp/usr/servers/defaultServer/logs
                    /opt/ibm/wlp/usr/servers/defaultServer/FileNet
                securityContext:
                  runAsUser: 0
                volumeMounts:
                  - name: filenet-data
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/FileNet
                  - name: logs
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/logs
            containers:
              - name: cpe
                image: "{{ cpe_image }}"
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 9080
                    name: http
                  - containerPort: 9443
                    name: https
                envFrom:
                  - secretRef:
                      name: cpe-secret
                env:
                  - name: LICENSE
                    value: "accept"
                  - name: LICENSEMODEL
                    value: "{{ baw_license }}"
                  # Disable OpenJ9 NSS FIPS mode.
                  # cpe-setup.sh writes "-Dsemeru.fips=true" unless disableFIPS=true.
                  # Without this, Liberty fails with "NSS module not available: fips"
                  # because the NSS FIPS module is not present in the container image,
                  # even when the cluster kernel has fips_enabled=0.
                  - name: disableFIPS
                    value: "true"
                  - name: TZ
                    value: "{{ timezone }}"
                  - name: CONTAINERTYPE
                    value: "1"
                  - name: CPESTATICPORT
                    value: "false"
                  - name: GCDJNDINAME
                    value: "FNGCDDS"
                  - name: GCDJNDIXANAME
                    value: "FNGCDDSXA"
                  - name: LOG_FORMAT
                    value: "json"
                  - name: DISABLE_BASIC_AUTH
                    value: "true"
                  - name: JVM_CUSTOMIZE_OPTIONS
                    value: "-Dcom.ibm.ws.session.cookie.secure=false -DInvalidateOnUnauthorizedSessionRequestException=false -Dcom.ibm.ws.session.useContextRootAsCookiePath=false -Dcom.filenet.authentication.wsi.AutoDetectAuthToken=true -DFileNet.WSI.AutoDetectLTPAToken=true -Dcom.filenet.authentication.token.userid=sso:ltpa"
                  - name: GATEWAY_SERVICE_URI
                    value: "http://cpe-svc.{{ baw_namespace }}.svc.cluster.local:9080/WSCPEService/WSCPEServiceSoapService"
                  - name: POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: JVM_INITIAL_HEAP_PERCENTAGE
                    value: "18"
                  - name: JVM_MAX_HEAP_PERCENTAGE
                    value: "33"
                resources:
                  requests:
                    memory: 1Gi
                    cpu: 500m
                  limits:
                    memory: 3Gi
                    cpu: "2"
                livenessProbe:
                  httpGet:
                    path: /P8CE/Health
                    port: 9080
                    scheme: HTTP
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  failureThreshold: 10
                readinessProbe:
                  httpGet:
                    path: /P8CE/Health
                    port: 9080
                    scheme: HTTP
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  failureThreshold: 20
                startupProbe:
                  httpGet:
                    path: /P8CE/Health
                    port: 9080
                    scheme: HTTP
                  periodSeconds: 15
                  failureThreshold: 40
                volumeMounts:
                  - name: filenet-data
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/FileNet
                  - name: logs
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/logs
                  # PostgreSQL JDBC driver — populated by cpe-init-jdbc init container
                  - name: jdbc-drivers
                    mountPath: /opt/ibm/wlp/usr/shared/resources/db/postgres
                  # Mount each Liberty override file individually (subPath) — reference pattern
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/PostgreSQLJDBCDriver.xml
                    subPath: PostgreSQLJDBCDriver.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_GCD.xml
                    subPath: ibm_GCD.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_DOCS.xml
                    subPath: ibm_DOCS.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_DOS.xml
                    subPath: ibm_DOS.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_TOS.xml
                    subPath: ibm_TOS.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_ldap_custom_default1.xml
                    subPath: ibm_ldap_custom_default1.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_ldap_federated.xml
                    subPath: ibm_ldap_federated.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_custom-ssl.xml
                    subPath: ibm_custom-ssl.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_custom-ltpa.xml
                    subPath: ibm_custom-ltpa.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/resources/security/custom-ltpa.keys
                    subPath: custom-ltpa.keys
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/http-session.xml
                    subPath: http-session.xml
                  - name: liberty-config
                    mountPath: /opt/ibm/wlp/usr/servers/defaultServer/configDropins/overrides/ibm_CORS.xml
                    subPath: ibm_CORS.xml
                  - name: tls
                    mountPath: /shared/tls/pkcs12
            volumes:
              - name: filenet-data
                persistentVolumeClaim:
                  claimName: cpe-filenet-pvc
              - name: logs
                persistentVolumeClaim:
                  claimName: cpe-logs-pvc
              - name: jdbc-drivers
                emptyDir: {}
              - name: liberty-config
                configMap:
                  name: cpe-liberty-config
              - name: tls
                configMap:
                  name: shared-ssl-config
                  items:
                    - key: server.p12
                      path: server.p12
                    - key: trusts.p12
                      path: trusts.p12

# ── Service ───────────────────────────────────────────────────────────────────

- name: Create CPE Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: cpe-svc
        namespace: "{{ baw_namespace }}"
        labels:
          app: baw-cpe
      spec:
        selector:
          app: baw-cpe
        ports:
          - port: 9080
            targetPort: 9080
            name: http
          - port: 9443
            targetPort: 9443
            name: https

# ── Wait for CPE readiness ────────────────────────────────────────────────────

- name: Wait for CPE deployment rollout
  ansible.builtin.shell: >
    oc rollout status deployment/cpe
    -n {{ baw_namespace }} --timeout={{ cpe_config_timeout }}s
  changed_when: false

- name: Wait for CPE WSI health endpoint
  ansible.builtin.shell: >-
    oc exec -n {{ baw_namespace }} -c cpe
    $(oc get pod -n {{ baw_namespace }} -l app=baw-cpe -o jsonpath='{.items[0].metadata.name}') --
    curl -s -o /dev/null -w "%{http_code}"
    http://localhost:9080/wsi/FNCEWS40MTOM/
  register: _cpe_wsi_check
  until: _cpe_wsi_check.stdout | trim in ['200', '401', '403']
  retries: 40
  delay: 30
  changed_when: false

- name: Get CPE pod name
  ansible.builtin.shell: >
    oc get pod -n {{ baw_namespace }} -l app=baw-cpe
    -o jsonpath='{.items[0].metadata.name}'
  register: _cpe_pod
  changed_when: false

# ── GCD + directory + object store initialization (idempotent) ───────────────
# Uses the container-native REST API (CONTAINERTYPE=1). Mirrors the reference
# config-gcd.sh / config-dos.sh / config-tos.sh / config-docs.sh scripts:
#   1. POST /domain                       — create the P8 domain
#   2. POST /domain/directoryConfigs      — register LDAP security provider
#   3. per object store (DOCS/DOS/TOS):
#        POST /databaseconnections        — register the JNDI datasource pair
#        POST /objectstores               — create the object store
#        PUT  /objectstores/<sym>/addons/ — install CE addons
# Without step 2 the domain has "No Security Providers" (FNRCS0004E) and CPE
# never finishes loading the domain (liveness fails, /P8CE/Health 500).

- name: Initialize FileNet GCD domain via container-native API
  ansible.builtin.shell: >
    oc exec -n {{ baw_namespace }} {{ _cpe_pod.stdout }} -c cpe --
    curl -sk -o /dev/null -w "%{http_code}"
    -X POST
    -u {{ cpe_admin_user }}:{{ cpe_admin_password }}
    -H "Content-Type: application/json"
    "http://localhost:9080/cpe/init/v1/domain"
    -d '{"serviceUser":"{{ cpe_admin_user }}","serviceUserPassword":"{{ cpe_admin_password }}","encryptionKeyLength":128,"domainName":"{{ cpe_domain_name }}"}'
  register: _gcd_init
  changed_when: _gcd_init.stdout | trim == "200"
  failed_when: _gcd_init.stdout | trim not in ['200', '409']
  no_log: true

- name: Register LDAP directory configuration on the domain
  ansible.builtin.shell: >
    oc exec -n {{ baw_namespace }} {{ _cpe_pod.stdout }} -c cpe --
    curl -sk -o /dev/null -w "%{http_code}"
    -X POST
    -u {{ cpe_admin_user }}:{{ cpe_admin_password }}
    -H "Content-Type: application/json"
    "http://localhost:9080/cpe/init/v1/domain/directoryConfigs"
    -d '{"adminUserNames":["{{ cpe_admin_user }}"],"groupMembershipSearchFilter":"(|(&(objectclass=groupofnames)(member={0}))(&(objectclass=groupofuniquenames)(uniquemember={0})))","groupSearchFilter":"(&(cn={0})(|(objectclass=groupofnames)(objectclass=groupofuniquenames)(objectclass=groupofurls)))","dirSvcUser":"{{ ldap_bind_dn }}","userBaseDN":"{{ ldap_base_dn }}","sslEnabled":"false","groupDisplayNameAttr":"cn","adminsGroupNames":["p8admins"],"dirSvcHostname":"{{ ldap_host }}","dcType":"Tivoli","directoryProviderName":"ldap","userSearchFilter":"(&(uid={0})(objectclass=person))","groupNameAttribute":"cn","userNameAttribute":"uid","dirSvcPort":"{{ ldap_port }}","groupBaseDN":"{{ ldap_base_dn }}","userDisplayNameAttr":"uid","allowEmailOrUPNShortNames":"false","dirSvcPasswd":"{{ ldap_bind_password }}","userUniqueIDAttribute":"ibm-entryUuid","groupUniqueIDAttribute":"ibm-entryUuid"}'
  register: _dir_cfg
  changed_when: _dir_cfg.stdout | trim == "200"
  failed_when: _dir_cfg.stdout | trim not in ['200', '409']
  no_log: true

- name: Create object store database connection
  ansible.builtin.shell: >
    oc exec -n {{ baw_namespace }} {{ _cpe_pod.stdout }} -c cpe --
    curl -sk -o /dev/null -w "%{http_code}"
    -X POST
    -u {{ cpe_admin_user }}:{{ cpe_admin_password }}
    -H "Content-Type: application/json"
    "http://localhost:9080/cpe/init/v1/databaseconnections"
    -d '{"jndiDataSource":"{{ item.ds }}","jndiXaDataSource":"{{ item.dsxa }}","siteName":"InitialSite","databaseConnectionName":"{{ item.dbc }}"}'
  loop: "{{ cpe_object_stores }}"
  loop_control:
    label: "{{ item.sym }}"
  register: _os_dbc
  changed_when: _os_dbc.stdout | trim == "200"
  failed_when: _os_dbc.stdout | trim not in ['200', '409']
  no_log: true

- name: Create object stores
  ansible.builtin.shell: >
    oc exec -n {{ baw_namespace }} {{ _cpe_pod.stdout }} -c cpe --
    curl -sk -o /dev/null -w "%{http_code}"
    -X POST
    -u {{ cpe_admin_user }}:{{ cpe_admin_password }}
    -H "Content-Type: application/json"
    "http://localhost:9080/cpe/init/v1/objectstores"
    -d '{"databaseConnectionName":"{{ item.dbc }}","objectStoreDisplayName":"{{ item.display }}","objectStoreSymbolicName":"{{ item.sym }}","databaseIndexStorageLocation":"{{ item.index }}","adminUserGroups":["p8admins","{{ cpe_admin_user }}","bawadmins","{{ ums_admin_user }}"],"basicUserGroups":["p8users","bawusers"]}'
  loop: "{{ cpe_object_stores }}"
  loop_control:
    label: "{{ item.sym }}"
  register: _os_create
  changed_when: _os_create.stdout | trim == "200"
  failed_when: _os_create.stdout | trim not in ['200', '409']
  no_log: true

- name: Install CE addons on object stores
  ansible.builtin.shell: >
    oc exec -n {{ baw_namespace }} {{ _cpe_pod.stdout }} -c cpe --
    curl -sk -o /dev/null -w "%{http_code}"
    -X PUT
    -u {{ cpe_admin_user }}:{{ cpe_admin_password }}
    -H "Content-Type: application/json"
    "http://localhost:9080/cpe/init/v1/objectstores/{{ item.0.sym }}/addons/"
    -d '{"addonId":"{{ item.1 }}"}'
  loop: "{{ cpe_object_stores | product(cpe_ce_addons) | list }}"
  loop_control:
    label: "{{ item.0.sym }} {{ item.1 }}"
  register: _os_addons
  changed_when: _os_addons.stdout | trim == "200"
  failed_when: false
  no_log: true

- name: CPE summary
  ansible.builtin.debug:
    msg:
      - "CPE ready at https://{{ cpe_host }}:{{ cpe_port }}"
      - "Admin console : https://{{ baw_hostname }}/acce/"
      - "WSI endpoint  : https://{{ cpe_host }}:{{ cpe_port }}/wsi/FNCEWS40MTOM/"
      - "Domain : {{ cpe_domain_name }} with LDAP directory + object stores DOCS/DOS/TOS"
